<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#1C6A4C">

</head>
<body>
<div id="root"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="sheetroot"></div>

<script>
(function(){
"use strict";
var R = window.RL, esc=R.esc, fmt=R.fmt, fmtPlain=R.fmtPlain, monthLabel=R.monthLabel, digitsOf=R.digitsOf;

/* ============================ أيقونات ============================ */
var I = {
  mark:'<svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#1C6A4C"/><path d="M8 18 20 10l12 8v13H8z" fill="#E9EDEB"/><path d="M12 31v-9h7v9M21 31v-9h7v9" stroke="#1C6A4C" stroke-width="2" fill="none"/></svg>',
  month:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 4l9 6.5V20H3z"/><path d="M8 20v-6h8v6"/></svg>',
  dad:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg>',
  rep:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>',
  ppl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19.5c.6-3 2.8-4.7 5.5-4.7s4.9 1.7 5.5 4.7"/><path d="M15.5 5.3a3 3 0 0 1 0 5.6M17.5 14.9c1.6.6 2.7 2.1 3 4.6"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  next:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  prev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  wa:'<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.2a9.8 9.8 0 0 0-8.4 14.7L2.2 21.8l5-1.3A9.8 9.8 0 1 0 12 2.2Zm0 17.9a8.1 8.1 0 0 1-4.1-1.1l-.3-.2-3 .8.8-3-.2-.3A8.1 8.1 0 1 1 12 20.1Zm4.5-6c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.4-2.9c-.3-.4.3-.4.8-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 2.8 2.8 0 0 0-.8 2.1 4.9 4.9 0 0 0 1 2.5 11 11 0 0 0 4.2 3.7c1.6.7 2.2.7 3 .6a2.6 2.6 0 0 0 1.7-1.2 2 2 0 0 0 .1-1.2c0-.1-.2-.2-.4-.3Z"/></svg>',
  tel:'<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7.9 4.2c.4-.1.9.1 1.1.5l1.4 2.8c.2.4.1.9-.2 1.2l-1.2 1.2a13 13 0 0 0 5.1 5.1l1.2-1.2c.3-.3.8-.4 1.2-.2l2.8 1.4c.4.2.6.6.5 1.1l-.6 2.6c-.1.5-.6.9-1.1.9C9.9 19.5 4.5 14.1 4.5 6.9c0-.5.4-1 .9-1.1z"/></svg>',
  sms:'<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3.1c-5.1 0-9.2 3.5-9.2 7.8 0 2.4 1.3 4.6 3.3 6-.1 1.1-.6 2.2-1.5 3.1-.2.3 0 .7.3.7 2 .1 3.7-.6 5-1.7.7.2 1.4.2 2.1.2 5.1 0 9.2-3.5 9.2-7.8S17.1 3.1 12 3.1Z"/></svg>',
  send:'<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3.4 20.4 21 12 3.4 3.6v6.5L15 12 3.4 13.9z"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>',
  warn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>',
  toDad:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
  fromDad:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>'
};

/* ============================ الحالة ============================ */
var A = {
  tab:"month", month:R.monthKeyNow(), sheet:null, q:"", filter:"", range:"1", showPaid:false,
  phase:"boot", err:"", loginBusy:false, loginErr:""
};
try{ var st=localStorage.getItem("rl2_tab"); if(["month","dad","rep","ppl"].indexOf(st)>=0) A.tab=st; }catch(e){}
var store, L;
function S(){ return store.state; }
function lastReceiver(){ try{ return localStorage.getItem("rl2_recv")||""; }catch(e){ return ""; } }

/* ============================ أدوات ============================ */
function toast(msg){ var el=document.getElementById("toast"); el.textContent=msg; el.classList.add("on"); clearTimeout(toast.h); toast.h=setTimeout(function(){ el.classList.remove("on"); },2600); }
function money(v, cls){ return '<span class="num'+(cls?" "+cls:"")+'">'+fmtPlain(v)+'</span>'; }
function qar(v){ return '<span class="num">'+fmtPlain(v)+'</span> ر.ق'; }
function stText(s){ return L.STATUS_TEXT[s]||""; }
function unitLabel(p){ return L.unitFor(p) || (p.name||"").slice(0,2); }
function uid(prefix){ return prefix+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function isStore(p){ return p && p.type==="store"; }

/* رسائل التذكير (بالإنجليزي للمستأجرين) */
function reminderMsg(p, m){
  var due=L.outstanding(p,m), name=String(p.name||"").trim(), mEn=monthLabel(m,"en");
  if(!(due>0)) return "Hello, thank you for settling the rent for "+name+" for "+mEn+". We appreciate it.";
  return "Good day, a reminder for the "+name+" rent for "+mEn+". Outstanding amount: "+fmtPlain(due)+" QAR. Thank you.";
}
function renewalMsg(p){
  var r=L.renewal(p), d=r?r.date.toLocaleDateString("en-GB"):"";
  return "Good day, the lease for "+String(p.name||"").trim()+(r&&r.daysLeft<0?" ended on ":" ends on ")+d+". Please confirm whether you wish to renew it. Thank you.";
}
function contactBtns(p, m, kind){
  var d=digitsOf(p.contact); if(!d) return '<span class="who none">بدون رقم</span>';
  var msg=encodeURIComponent(kind==="renew"?renewalMsg(p):reminderMsg(p,m));
  return '<span class="contact">' +
    '<a class="c-tel" href="tel:+'+d+'" aria-label="اتصال">'+I.tel+'</a>' +
    '<a class="c-wa" href="https://wa.me/'+d+'?text='+msg+'" target="_blank" rel="noopener" aria-label="واتساب">'+I.wa+'</a>' +
    (waReady() && (kind==="renew" || L.outstanding(p,m)>0) ? '<button type="button" class="c-send" data-act="wasend" data-pid="'+p.id+'" data-kind="'+(kind||"reminder")+'" aria-label="إرسال مباشر من رقم الأعمال">'+I.send+'</button>' : '') +
  '</span>';
}

/* ============================ الكتابة ============================ */
var AUDIT_FIELDS=[["billedAmount","الإيجار"],["amountPaid","المبلغ"],["paid","مدفوع"],["paymentDate","التاريخ"],["method","الطريقة"],["notes","ملاحظة"],["receiver","مين قبض"]];
function audit(pid, month, existed, before, after){
  try{
    var b={}, a={}, ch=false, base=existed?before:{billedAmount:(S().people[pid]||{}).rent||0, paid:false, amountPaid:0};
    AUDIT_FIELDS.forEach(function(f){ var k=f[0], x=base[k]==null?null:base[k], y=after[k]==null?null:after[k]; if(x!==y){ b[k]=x; a[k]=y; ch=true; } });
    if(!ch) return;
    var had=existed && ((before.amountPaid||0)>0 || before.paid===true), cleared=had && !((after.amountPaid||0)>0) && after.paid!==true;
    var e={at:new Date().toISOString(), email:(store.user&&store.user.email)||"local", action:!existed?"create":(cleared?"delete":"update"),
      personId:pid, personName:(S().people[pid]||{}).name||"", month:month, before:b, after:a};
    var w=store.set("audit", uid(""), e); if(w&&w.catch) w.catch(function(){});
  }catch(e){}
}
async function savePayment(pid, month, patch){
  var id=pid+"__"+month, existed=!!S().payments[id], ex=S().payments[id]||{}, p=S().people[pid]||{};
  var merged=Object.assign({personId:pid, month:month, billedAmount:(ex.billedAmount!=null?ex.billedAmount:(p.rent||0)),
    paid:false, amountPaid:0, paymentDate:null, method:null, notes:null, receiver:null, business:p.business||null}, ex, patch, {updatedAt:new Date().toISOString()});
  S().payments[id]=merged; refresh(); scheduleSheetSync();
  audit(pid, month, existed, ex, merged);
  try{ await store.set("payments", id, merged); toast("تم الحفظ"); }catch(e){ toast("تعذّر الحفظ — تحقق من الاتصال"); }
}
async function savePerson(pid, patch, quiet){
  var merged=Object.assign({}, S().people[pid]||{}, patch); S().people[pid]=merged; refresh(); scheduleSheetSync();
  try{ await store.set("people", pid, merged); if(!quiet) toast("تم الحفظ"); }catch(e){ toast("تعذّر الحفظ — تحقق من الاتصال"); }
}
async function saveSettings(patch, quiet){
  var merged=Object.assign({}, S().settings, patch); store.state.settings=merged; refresh(); if(!quiet) scheduleSheetSync();
  try{ await store.setSettings(merged); if(!quiet) toast("تم الحفظ"); }catch(e){ toast("تعذّر الحفظ — تحقق من الاتصال"); }
}
async function addPerson(data){
  var id="p_"+Date.now().toString(36)+Math.random().toString(36).slice(2,4);
  var d=Object.assign({name:"", nameAr:null, type:"store", group:"ONE_TO_EIGHT", business:null, rent:0, dueDay:null, contact:null,
    active:true, order:L.people().length+1, note:null, role:null, startMonth:R.monthKeyNow()}, data);
  S().people[id]=d; refresh(); scheduleSheetSync();
  try{ await store.set("people", id, d); toast("تمت الإضافة"); }catch(e){ toast("تعذّر الحفظ"); }
  return id;
}

/* تصحيحات بيانات طلبها يوسف (10 نوفمبر 2026) — تتنفّذ مرة وحدة وتنسجّل بالإعدادات */
var FIX_ID="2026-11-10-due-days", fixTried=false;
async function runDataFixes(){
  if(fixTried || !(store.fresh.people && store.fresh.payments && store.fresh.settings)) return;
  if((S().settings.dataFixes||{})[FIX_ID] || !Object.keys(S().people).length) return;
  fixTried=true;
  function find(id,name){ if(S().people[id] && !S().people[id].trashed) return id; var n=name.toLowerCase().replace(/\s+/g,"");
    return Object.keys(S().people).filter(function(k){ var p=S().people[k]; return p && !p.trashed && !p.archived && String(p.name||"").toLowerCase().replace(/\s+/g,"")===n; })[0]||null; }
  var DUE=[["storeA","Store A",1],["storeB","Store B",5],["storeC","Store C",1],["storeDE","Store D,E",7],["store1","Store 1",1],["store2","Store 2",1],["store3","Store 3",1],["store4","Store 4",5],["store5","Store 5",1],["store6","Store 6",15]];
  for(var i=0;i<DUE.length;i++){ var pid=find(DUE[i][0],DUE[i][1]); if(!pid) continue; var pt={dueDay:DUE[i][2]};
    if(DUE[i][0]==="store5") pt.payMethod="Cheque"; if(DUE[i][0]==="storeC") pt.rent=2500; await savePerson(pid,pt,true); }
  var p7=find("store7","Store 7"); if(p7){ var c7=S().people[p7].contractStart, pt7={dueFromStart:true}; if(/^\d{4}-\d{2}-\d{2}$/.test(c7||"")) pt7.dueDay=Math.min(28,Number(c7.slice(8,10))); await savePerson(p7,pt7,true); }
  var pc=find("storeC","Store C");
  if(pc) for(var k in S().payments){ var d=S().payments[k]; if(d && d.personId===pc && d.month>="2026-10" && Number(d.billedAmount)===3000 && (Number(d.amountPaid)||0)<=2500) await savePayment(pc,d.month,{billedAmount:2500}); }
  var done=Object.assign({}, S().settings.dataFixes||{}); done[FIX_ID]=new Date().toISOString();
  await saveSettings({dataFixes:done}, true);
}

/* ============================ الهيكل ============================ */
function shell(inner){
  var tabs=[["month","الشهر",I.month],["dad","الحساب مع الوالد",I.dad],["rep","التقارير",I.rep],["ppl","المستأجرون",I.ppl]];
  var m=A.month, now=R.monthKeyNow();
  return '<div class="wrap"><header class="top"><div class="top-row">' +
      '<div class="brand">'+I.mark+'<div><b>دفتر الإيجارات</b><small>مخازن الصادق · الريان القديم</small></div></div>' +
      '<button type="button" class="iconbtn" data-act="settings" aria-label="الإعدادات">'+I.gear+'</button></div>' +
    (A.tab==="ppl" ? '' : '<div class="month">' +
      '<button type="button" class="step" data-act="mprev" aria-label="الشهر السابق">'+I.prev+'</button>' +
      '<div class="mname"><b>'+monthLabel(m)+'</b>'+(m>now?'<span class="tag">قادم</span>':'')+
        (m!==now?'<button type="button" data-act="mnow">رجوع للشهر الحالي</button>':'')+'</div>' +
      '<button type="button" class="step" data-act="mnext" aria-label="الشهر التالي">'+I.next+'</button></div>') +
    '</header><main id="view">'+inner+'</main></div>' +
    '<nav class="tabbar" aria-label="الأقسام"><div class="tabbar-in">'+tabs.map(function(t){
      return '<button type="button" data-act="tab" data-tab="'+t[0]+'"'+(A.tab===t[0]?' aria-current="page"':'')+'>'+t[2]+'<span>'+t[1]+'</span></button>'; }).join("")+'</div></nav>';
}

function render(){
  var root=document.getElementById("root");
  if(A.phase==="error"){ root.innerHTML='<div class="login"><h1>تعذّر التحميل</h1><p>'+esc(A.err)+'</p><button class="btn" onclick="location.reload()">إعادة المحاولة</button></div>'; return; }
  if(A.phase==="login"){ root.innerHTML=loginView(); return; }
  if(A.phase!=="ready"){ root.innerHTML='<div class="login"><p>جارٍ التحميل…</p></div>'; return; }
  L=R.Ledger(S());
  var v = A.tab==="dad" ? dadView() : A.tab==="rep" ? repView() : A.tab==="ppl" ? pplView() : monthView();
  var y=window.scrollY;
  root.innerHTML=shell(v);
  window.scrollTo(0,y);
  if(A.sheet) renderSheet();
}
function refresh(){ render(); }

/* ============================ الدخول ============================ */
function loginView(){
  var em=""; try{ em=localStorage.getItem("rentbook_email")||""; }catch(e){}
  var rem=true; try{ rem=localStorage.getItem("rentbook_remember")!=="0"; }catch(e){}
  return '<form class="login stack" id="loginform">'+I.mark+'<div><h1>دفتر الإيجارات</h1><p>سجّل الدخول لعرض الدفتر ومزامنته بين أجهزتك.</p></div>' +
    '<div class="field"><label for="li-e">البريد الإلكتروني</label><input id="li-e" type="email" dir="ltr" autocomplete="username" required value="'+esc(em)+'"></div>' +
    '<div class="field"><label for="li-p">كلمة المرور</label><div class="pw"><input id="li-p" type="password" dir="ltr" autocomplete="current-password" required><button type="button" data-act="pwshow">إظهار</button></div></div>' +
    '<div style="display:flex;justify-content:space-between;align-items:center"><label class="check"><input type="checkbox" id="li-r"'+(rem?" checked":"")+'>تذكّرني على هذا الجهاز</label>' +
    '<button type="button" class="linkbtn" data-act="forgot">نسيت كلمة المرور؟</button></div>' +
    (A.loginErr?'<div class="note bad">'+esc(A.loginErr)+'</div>':'') +
    '<button class="btn block" type="submit"'+(A.loginBusy?" disabled":"")+'>'+(A.loginBusy?"جارٍ الدخول…":"دخول")+'</button></form>';
}

/* ============================ تبويب: الشهر ============================ */
function monthView(){
  var m=A.month, sum=L.monthSummary(m), fut=R.isFutureMonth(m), h="";
  // البطل: الرقم + شريط بخانة لكل مخزن
  var seg=function(g){ return L.stores(g,m).map(function(p){ return '<i class="'+L.status(p,m)+'" title="'+esc(p.name)+'"></i>'; }).join(""); };
  h+='<section class="hero" aria-label="ملخص الشهر">' +
    '<div class="hero-line"><span class="hero-big num">'+fmtPlain(sum.collected)+'</span><span class="hero-of">من '+qar(sum.expected)+(fut?' متوقعة':'')+'</span></div>' +
    '<div class="hero-sub">'+(fut ? 'شهر لسا ما بلّش — المحصَّل هنا دفعات مقدّمة.' :
      (sum.unpaid.length ? 'دفع '+sum.paid.length+' من '+sum.count+' مستأجرين، والباقي عليهم '+qar(sum.outstanding)+'.' : 'كل المستأجرين دفعوا هالشهر.'))+'</div>' +
    '<div class="units-bar" aria-hidden="true">'+seg("AE")+'<i class="gap"></i>'+seg("ONE_TO_EIGHT")+'</div>' +
    '<div class="legend"><span><i style="background:var(--roof)"></i>دفع</span><span><i style="background:var(--late)"></i>متأخر</span><span><i style="background:var(--part)"></i>جزء</span><span><i style="background:var(--due-soft);box-shadow:inset 0 0 0 1px var(--line)"></i>مستحق</span></div>' +
  '</section>';

  // تنبيهات تحتاج قرار
  var noRecv=[]; sum.paid.concat(sum.unpaid).forEach(function(r){ if(r.paidAmt>0 && !L.receiverOf(r.doc)) noRecv.push(r.p); });
  if(noRecv.length) h+='<div style="margin-top:12px"><button type="button" class="alert bad" data-act="openpay" data-pid="'+noRecv[0].id+'">'+I.warn+'<span><b>'+noRecv.length+' دفعة ما تحدد مين قبضها</b> — بدونها حساب الوالد ناقص. اضغط لتحديدها.</span></button></div>';
  if(!fut){
    var acc=L.fatherAccount(m), bt=L.balanceText(acc.balance);
    h+='<div style="margin-top:10px"><button type="button" class="alert info" data-act="tab" data-tab="dad">'+I.dad+'<span>الحساب مع الوالد: <b>'+esc(bt.text)+'</b></span></button></div>';
  }

  // المخطط
  h+='<section class="sec"><div class="sec-h"><h2>المخازن على الخريطة</h2><span class="count">اضغط على أي مخزن</span></div>' +
    '<div class="panel plan-wrap">'+R.planSVG(L, m, {clickable:true})+'</div></section>';

  // من لم يدفع
  h+='<section class="sec"><div class="sec-h"><h2>'+(fut?'الدفعات القادمة':'ما دفعوا لسا')+'</h2><span class="count">'+sum.unpaid.length+'</span></div>';
  h+= sum.unpaid.length ? '<div class="panel">'+sum.unpaid.map(function(r){ return payRow(r,m,true); }).join("")+'</div>' : '<div class="panel empty">ما في حدا عليه شي هالشهر</div>';
  h+='</section>';

  // من دفع
  h+='<section class="sec"><div class="sec-h"><h2>دفعوا</h2><span class="count">'+sum.paid.length+'</span></div>';
  if(sum.paid.length){
    var show=A.showPaid || sum.paid.length<=4, list=show?sum.paid:sum.paid.slice(0,3);

function payRow(r, m, withContact){

function rangeMonths(){
  var n={"1":1,"3":3,"12":12}[A.range]||1, arr=[], mk=A.month, first=L.monthsWithData()[0];

  for(var i=0;i<n;i++){ arr.unshift(mk); mk=R.shiftMonth(mk,-1); }

  return arr;
}

  function group(title, arr){
    if(!arr.length) return '';
    return '<section class="sec"><div class="sec-h"><h2>'+title+'</h2><span class="count">'+arr.length+'</span></div><div class="panel">'+arr.map(personRow).join("")+'</div></section>';
  }
  h+=group("هنجر A – E", list.filter(function(p){ return isStore(p)&&p.group==="AE"; }));
  h+=group("هنجر 1 – 8", list.filter(function(p){ return isStore(p)&&p.group==="ONE_TO_EIGHT"; }));
  if(!f) h+=group("التزامات ثابتة", list.filter(function(p){ return p.type==="partner"; }));
  if(!list.length) h+='<div class="panel empty" style="margin-top:14px">ما في نتائج</div>';
  h+='<div style="margin-top:14px"><button type="button" class="btn block" data-act="newperson">+ إضافة مستأجر</button></div>';
  if(!f){
    var off=L.people().filter(function(p){ return p.active===false && !p.archived; }).filter(match);
    h+=group("سجلات موقوفة", off);
    var arch=L.people().filter(function(p){ return p.archived; }).filter(match);
    if(arch.length) h+='<section class="sec"><div class="sec-h"><h2>مستأجرون سابقون</h2><span class="count">'+arch.length+'</span></div><div class="panel">'+arch.map(function(p){
      var s=L.statement(p); return '<button type="button" class="row" data-act="stmt" data-pid="'+p.id+'"><span class="unit">'+esc(unitLabel(p))+'</span><span class="row-main"><b>'+esc(p.name)+'</b><small>'+(p.business?esc(p.business)+' · ':'')+'انتهى '+(p.endDate?R.dmy(p.endDate):monthLabel(p.endMonth||""))+'</small></span><span class="row-end">'+(s.balance>0?'<b class="neg">'+qar(s.balance)+'</b><small>ذمة باقية</small>':'<small>ما عليه شي</small>')+'</span></button>'; }).join("")+'</div></section>';
    var tr=L.trashed().filter(match);
    if(tr.length) h+='<section class="sec"><div class="sec-h"><h2>المحذوفات</h2><span class="count">'+tr.length+'</span></div><div class="panel">'+tr.map(function(p){
      return '<div class="row" style="cursor:default;opacity:.75"><span class="unit">'+esc((p.name||"").slice(0,2))+'</span><span class="row-main"><b>'+esc(p.name)+'</b><small>حُذف '+esc((p.trashedAt||"").slice(0,10))+'</small></span><button type="button" class="btn sm line" data-act="restoreperson" data-pid="'+p.id+'">استرجاع</button></div>'; }).join("")+'</div></section>';
  }
  return h;
}
function personRow(p){
  var bits=[];
  if(isStore(p)){
    if(!digitsOf(p.contact)) bits.push('<span class="neg">بدون رقم</span>');
    var r=L.renewal(p); if(r) bits.push(r.daysLeft<0?'<span class="neg">العقد منتهي</span>':(r.actionDaysLeft<=0?'<span class="chq">التجديد خلال '+r.daysLeft+' يوم</span>':'العقد لـ '+r.date.toLocaleDateString("en-GB")));
    else if(!p.contractStart) bits.push('بدون عقد');
    if(!p.depositType||p.depositType==="none") bits.push('<span class="chq">بدون ضمان</span>');
  }
  return '<button type="button" class="row" data-act="editperson" data-pid="'+p.id+'"><span class="unit">'+esc(isStore(p)?unitLabel(p):(p.name||"").slice(0,2))+'</span>' +
    '<span class="row-main"><b>'+esc(p.business||p.name)+'</b><small>'+(p.business?esc(p.name)+' · ':'')+bits.join(' · ')+'</small></span>' +
    '<span class="row-end"><b>'+qar(p.rent||0)+'</b><small>شهريًا'+(p.dueDay?' · يوم '+p.dueDay:'')+'</small></span></button>';
}

/* ============================ الصفحات المنبثقة ============================ */
function openSheet(s){ A.sheet=s; renderSheet(true); }
function closeSheet(){
  var sh=document.querySelector(".sheet"), sc=document.querySelector(".scrim");
  A.sheet=null;
  if(sh){ sh.classList.remove("on"); sc.classList.remove("on"); setTimeout(function(){ if(!A.sheet) document.getElementById("sheetroot").innerHTML=""; },230); }
  document.body.style.overflow="";
}
function renderSheet(anim){
  var s=A.sheet, root=document.getElementById("sheetroot"); if(!s){ root.innerHTML=""; return; }
  var body = s.kind==="pay"?paySheet(s) : s.kind==="person"?personSheet(s) : s.kind==="stmt"?stmtSheet(s) : s.kind==="transfer"?transferSheet(s)
    : s.kind==="expense"?expenseSheet(s) : s.kind==="shares"?sharesSheet(s) : s.kind==="settings"?settingsSheet(s) : s.kind==="endocc"?endOccSheet(s) : "";
  var keep=document.querySelector(".sheet"), sc=keep?keep.scrollTop:0;
  root.innerHTML='<div class="scrim'+(anim?'':' on')+'" data-act="closesheet"></div><div class="sheet'+(anim?'':' on')+'" role="dialog" aria-modal="true"><div class="grab"></div>'+body+'</div>';
  document.body.style.overflow="hidden";
  var nsh=root.querySelector(".sheet"); nsh.scrollTop=sc;
  if(anim) requestAnimationFrame(function(){ requestAnimationFrame(function(){ root.querySelector(".scrim").classList.add("on"); nsh.classList.add("on"); }); });
}
function choice(name, value, opts, extra){
  return '<div class="choice'+(extra?" "+extra:"")+'" role="group">'+opts.map(function(o){ return '<button type="button" data-act="pick" data-k="'+name+'" data-v="'+o[0]+'" aria-pressed="'+(value===o[0])+'">'+o[1]+'</button>'; }).join("")+'</div>';
}

/* ---- تسجيل دفعة ---- */
function payDraft(pid, m){
  var p=L.person(pid), d=L.payDoc(pid,m)||{}, has=(Number(d.amountPaid)||0)>0;
  return {kind:"pay", pid:pid, m:m, d:{
    amount: has ? Number(d.amountPaid) : "",
    date: d.paymentDate || R.todayISO(),
    method: d.method || p.payMethod || "",
    receiver: L.receiverOf(d) || (has ? "" : lastReceiver()),
    notes: d.notes || "",
    billed: d.billedAmount!=null ? Number(d.billedAmount) : Number(p.rent)||0
  }};
}
function paySheet(s){
  var p=L.person(s.pid), m=s.m, d=s.d, doc=L.payDoc(p.id,m), st=L.status(p,m), carry=L.carryover(p,m), req=(Number(d.billed)||0)+carry, store_=isStore(p);
  var amt=Number(d.amount)||0, legacy=doc?L.legacyFwd(doc,p):0, yp=store_?L.yousefPct(p):1, dadShare=Math.round(amt*(1-yp));
  var hint="";
  if(store_ && amt>0){
    if(d.receiver==="father") hint = yp>=1 ? 'المبلغ كله إلك، وبينخصم من حق الوالد الثابت (8,500).' : 'نصّها حق الوالد ('+fmtPlain(dadShare)+') والنص الثاني إلك وبينخصم من حقه الثابت.';
    else if(d.receiver==="me") hint = dadShare>0 ? 'نصّها ('+fmtPlain(dadShare)+') حق الوالد — بينضاف على حسابه.' : 'المبلغ كله إلك (مخازن A–E).';
    else hint='<span class="neg">حدّد مين قبض الدفعة — هيك بيطلع حساب الوالد صح.</span>';
  }
  var h='<div class="sheet-h"><span class="unit '+st+'">'+esc(store_?unitLabel(p):(p.name||"").slice(0,2))+'</span><div class="t"><h3>'+esc(p.business||p.name)+'</h3><small>'+(p.business?esc(p.name)+' · ':'')+monthLabel(m)+' · <span class="st '+st+'">'+stText(st)+'</span></small></div>' +
    '<button type="button" class="xbtn" data-act="closesheet" aria-label="إغلاق">×</button></div><div class="stack">';
  h+='<div class="panel pad" style="box-shadow:inset 0 0 0 1px var(--line-2)"><div class="sumline"><span>إيجار '+R.monthName(m)+'</span><b>'+qar(d.billed)+'</b></div>' +
    (carry>0?'<div class="sumline"><span>متأخر من الأشهر الماضية</span><b class="neg">+ '+qar(carry)+'</b></div>':'') +
    '<div class="sumline total"><span>المطلوب</span><b>'+qar(req)+'</b></div></div>';
  h+='<div class="field"><label for="pa">المبلغ المدفوع</label><input id="pa" class="big num" type="number" inputmode="numeric" min="0" placeholder="0" data-in="amount" value="'+esc(d.amount)+'"></div>' +
    '<div class="btnrow"><button type="button" class="btn soft" data-act="fullamt" data-v="'+req+'">دفع كامل '+fmtPlain(req)+'</button>'+(amt?'<button type="button" class="btn line" data-act="fullamt" data-v="">مسح</button>':'')+'</div>';
  if(store_) h+='<div class="field"><span class="lbl">مين قبض الدفعة؟</span>'+choice("receiver", d.receiver, [["me","أنا قبضتها"],["father","الوالد قبضها"]], "dadc")+(hint?'<p class="help">'+hint+'</p>':'')+'</div>';
  h+='<div class="grid2"><div class="field"><label for="pd">التاريخ</label><input id="pd" type="date" data-in="date" value="'+esc(d.date)+'"></div>' +
    '<div class="field"><label for="pn">ملاحظة</label><input id="pn" type="text" data-in="notes" placeholder="اختياري" value="'+esc(d.notes)+'"></div></div>' +
    '<div class="field"><span class="lbl">طريقة الدفع</span>'+choice("method", d.method, [["Cash","نقدًا"],["Cheque","شيك"],["Fawran","فوران"]])+'</div>';
  if(legacy>0) h+='<div class="alert info" style="cursor:default">'+I.dad+'<span>مسجّل على هالدفعة تحويل قديم <b>'+fmtPlain(legacy)+'</b> — صار يظهر بقائمة التحويلات بتبويب الوالد.</span></div>';
  h+='<details><summary class="linkbtn" style="list-style:none;cursor:pointer">تعديل إيجار هالشهر فقط</summary><div class="field" style="margin-top:8px"><input type="number" min="0" data-in="billed" value="'+esc(d.billed)+'" aria-label="إيجار هالشهر"><p class="help">للخصم أو الزيادة على هالشهر بس. الإيجار الدائم بيتعدّل من تبويب المستأجرين.</p></div></details>';
  h+='<button type="button" class="btn block" data-act="savepay">حفظ الدفعة</button>';
  if(doc && (Number(doc.amountPaid)>0 || doc.paid)) h+='<button type="button" class="btn danger block" data-act="clearpay">إلغاء الدفعة المسجّلة</button>';
  if(store_){
    var dg=digitsOf(p.contact);
    h+='<div style="border-top:1px solid var(--line-2);padding-top:14px" class="btnrow">' +
      (dg?'<a class="btn line" href="https://wa.me/'+dg+'?text='+encodeURIComponent(reminderMsg(p,m))+'" target="_blank" rel="noopener">'+I.wa+' تذكير واتساب</a><a class="btn line" href="tel:+'+dg+'">'+I.tel+' اتصال</a>'
          :'<button type="button" class="btn line" data-act="editperson" data-pid="'+p.id+'">إضافة رقم تواصل</button>') +
      '<button type="button" class="btn line" data-act="stmt" data-pid="'+p.id+'">كشف حساب</button></div>';
  }
  return h+'</div>';
}

/* ---- كشف حساب ---- */
function stmtText(p){
  var s=L.statement(p), rows=s.rows, out=["Statement — "+String(p.name||"").trim()+(p.business?" ("+p.business+")":""), "As of "+new Date().toLocaleDateString("en-GB")];
  if(rows.length>12){ out.push("Previous balance: "+fmtPlain(rows[rows.length-13].balance)+" QAR"); rows=rows.slice(-12); }
  rows.forEach(function(r){ out.push(monthLabel(r.month,"en")+": due "+fmtPlain(r.due)+" · paid "+fmtPlain(r.paid)+" · balance "+fmtPlain(r.balance)); });
  out.push("", "Total due: "+fmtPlain(s.totalDue)+" QAR", "Total paid: "+fmtPlain(s.totalPaid)+" QAR", (s.balance<0?"Credit: ":"Outstanding: ")+fmtPlain(Math.abs(s.balance))+" QAR");
  return out.join("\n");
}

function copy(text, ok){ (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(function(){ toast(ok); }, function(){ toast("تعذّر النسخ"); }); }
function savePayFromSheet(){
  var s=A.sheet, p=L.person(s.pid), d=s.d, amt=Math.max(0,Number(d.amount)||0), billed=Math.max(0,Number(d.billed)||0);
  var req=billed+L.carryover(p,s.m), doc=L.payDoc(s.pid,s.m)||{};
  if(isStore(p) && amt>0 && !d.receiver){ toast("حدّد مين قبض الدفعة"); return; }
  var patch={amountPaid:amt, paid:amt>0 && amt>=req, paymentDate:amt>0?(d.date||R.todayISO()):null, method:amt>0?(d.method||null):null,
    notes:d.notes||null, billedAmount:billed, receiver:amt>0&&isStore(p)?d.receiver:null};
  if(!(amt>0)){ patch.settle=null; patch.fwdMode=null; patch.fwd=null; patch.fwdDate=null; }
  else if(L.receiverOf(doc) && d.receiver!==L.receiverOf(doc)){ patch.fwdMode=null; patch.fwd=null; patch.fwdDate=null; } // انقلب المستلم: التحويل القديم ما عاد له معنى
  if(d.receiver){ try{ localStorage.setItem("rl2_recv", d.receiver); }catch(x){} }
  savePayment(s.pid, s.m, patch); closeSheet();
}
function openPerson(pid){
  var p=S().people[pid]; if(!p) return;
  openSheet({kind:"person", pid:pid, d:{type:p.type, name:p.name||"", business:p.business||"", rent:p.rent||"", dueDay:p.dueDay||"", unit:p.unit||"",
    contact:p.contact||"", payMethod:p.payMethod||"", contractTerm:p.contractTerm||"", contractStart:p.contractStart||"", depositType:p.depositType||"",
    depositAmount:p.depositAmount||"", startMonth:p.startMonth||"", endMonth:p.endMonth||"", dueFromStart:!!p.dueFromStart}});
}
function savePersonFromSheet(){
  var s=A.sheet, d=s.d, name=String(d.name||"").trim();
  if(!name){ toast("اكتب الاسم"); return; }
  var patch={name:name, business:String(d.business||"").trim()||null, rent:Math.max(0,Number(d.rent)||0), dueDay:d.dueDay?Math.min(28,Math.max(1,Number(d.dueDay))):null, contact:String(d.contact||"").trim()||null};
  if(d.type!=="partner"){
    patch.unit=d.unit||null; patch.payMethod=d.payMethod||null; patch.contractTerm=d.contractTerm||null; patch.contractStart=d.contractStart||null;
    patch.depositType=d.depositType||null; patch.depositAmount=d.depositAmount?Number(d.depositAmount):null;
    if(d.unit && L.cellGroup(d.unit)) patch.group=L.cellGroup(d.unit);
    if(d.dueFromStart && /^\d{4}-\d{2}-\d{2}$/.test(d.contractStart||"")) patch.dueDay=Math.min(28,Number(d.contractStart.slice(8,10)));
  } else {
    var sm=d.startMonth||null, emn=d.endMonth||null; if(sm&&emn&&emn<sm){ toast("شهر النهاية قبل البداية"); return; }
    patch.startMonth=sm; patch.endMonth=emn;
  }
  if(!s.pid){
    if(d.type!=="partner" && !d.unit){ toast("اختر المخزن"); return; }
    addPerson(Object.assign({type:d.type==="partner"?"partner":"store", group:d.type==="partner"?null:(patch.group||"ONE_TO_EIGHT")}, patch));
  } else savePerson(s.pid, patch);
  closeSheet();
}
async function confirmEndOcc(){
  var s=A.sheet, d=s.d, p=S().people[s.pid];
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d.date||"")){ toast("اختر تاريخ صحيح"); return; }
  if(d.next==="new"){ if(!String(d.name).trim()){ toast("اكتب اسم المستأجر الجديد"); return; } if(!/^\d{4}-\d{2}$/.test(d.first||"") || d.first<d.date.slice(0,7)){ toast("أول شهر لازم يكون بعد نهاية السابق"); return; } }
  if(!confirm("تأكيد إنهاء إيجار «"+p.name+"» بتاريخ "+R.dmy(d.date)+"؟")) return;
  var unit=L.unitFor(L.person(s.pid)), patch={archived:true, endDate:d.date, endMonth:d.date.slice(0,7), archivedAt:new Date().toISOString()};
  if(unit && !p.unit) patch.unit=unit;
  closeSheet(); await savePerson(s.pid, patch, true);
  if(d.next==="new") await addPerson({name:String(d.name).trim(), business:String(d.business||"").trim()||null, rent:Number(d.rent)||0, dueDay:p.dueDay||null, group:p.group, unit:unit, prevTenantId:s.pid, startMonth:d.first, order:p.order||null});
  toast("تم إنهاء الإيجار");
}

function saveTransfer(){
  var d=A.sheet.d, amt=Number(d.amount)||0;
  if(!(amt>0)){ toast("اكتب المبلغ"); return; }
  var all=Object.assign({}, S().settings.settleTransfers||{}), list=(all[d.month]||[]).slice();
  list.push({id:uid("tr_"), amount:amt, dir:d.dir, date:d.date||R.todayISO(), method:d.method||null, note:String(d.note||"").slice(0,60)||null});

function delTransfer(id){
  if(String(id).indexOf("row:")===0){
    var key=id.slice(4), doc=S().payments[key]; if(!doc) return;
    if(!confirm("هذا تحويل قديم مسجّل على دفعة. حذفه؟")) return;

  }
  var all=Object.assign({}, S().settings.settleTransfers||{}), list=all[A.month]||[], hit=list.filter(function(x){ return x.id===id; })[0];

  list=list.filter(function(x){ return x.id!==id; }); if(list.length) all[A.month]=list; else delete all[A.month];
  saveSettings({settleTransfers:all});
}
function saveExpense(){

function download(blob, name){ var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(a.href); },2000); }
function exportBackup(){
  var st=Object.assign({}, S().settings); delete st.gsheet;
  download(new Blob([JSON.stringify({app:"rentbook", version:2, exportedAt:new Date().toISOString(), people:S().people, payments:S().payments, settings:st}, null, 1)], {type:"application/json"}), "rent-ledger-backup-"+R.todayISO()+".json");
  toast("تم تنزيل النسخة");
}
function isObj(o){ return !!o && typeof o==="object" && !Array.isArray(o); }
async function importBackup(file){
  var d; try{ d=JSON.parse(await file.text()); }catch(e){ toast("الملف غير صالح"); return; }
  if(!isObj(d) || !isObj(d.people) || !isObj(d.payments)){ toast("الملف غير صالح"); return; }
  var w=[];
  Object.keys(d.people).forEach(function(id){ if(/^[\w-]{1,80}$/.test(id) && isObj(d.people[id])) w.push({col:"people", id:id, data:d.people[id]}); });
  Object.keys(d.payments).forEach(function(id){ if(/^[\w-]{1,80}__\d{4}-\d{2}$/.test(id) && isObj(d.payments[id])) w.push({col:"payments", id:id, data:d.payments[id]}); });
  if(isObj(d.settings)){ var st=Object.assign({}, d.settings); delete st.gsheet; if(S().settings.gsheet) st.gsheet=S().settings.gsheet; w.push({col:"meta", id:"settings", data:st}); }
  if(!confirm("دمج النسخة ("+Object.keys(d.people).length+" سجل، "+Object.keys(d.payments).length+" دفعة) مع البيانات الحالية؟ السجلات المتطابقة بتنستبدل.")) return;
  try{ await store.batch(w); toast("تمت الاستعادة"); }catch(e){ toast("تعذّرت الاستعادة"); }
}

/* ============================ Excel و Google Sheets ============================ */
function monthRows(mk){
  var rows=[["المستأجر","النشاط","المطلوب","يوم الاستحقاق","تاريخ الدفع","المدفوع","الباقي","الحالة","الطريقة","مين قبض","حصة الوالد","التواصل","ملاحظات"]];
  function add(p){ var d=L.payDoc(p.id,mk), req=L.required(p,mk), paid=L.sumPaid(p.id,mk), rc=L.receiverOf(d);
    rows.push([p.name, p.business||"", req, p.dueDay||"", (d&&d.paymentDate)||"", paid, Math.max(0,req-paid), stText(L.status(p,mk)), methodAr(d&&d.method),
      isStore(p)?(rc==="father"?"الوالد":(rc==="me"?"يوسف":"")):"", isStore(p)&&paid>0?Math.round(paid*(1-L.yousefPct(p))):"", p.contact||"", (d&&d.notes)||""]); }
  var ob=L.commitments(mk); if(ob.length){ ob.forEach(add); rows.push([]); }
  L.stores("AE",mk).forEach(add); rows.push([]); L.stores("ONE_TO_EIGHT",mk).forEach(add); rows.push([]);
  var sm=L.monthSummary(mk), sh=L.shares(mk), fm=L.fatherMonth(mk);
  rows.push(["المطلوب","","",sm.expected]); rows.push(["المحصّل","","",sm.collected]); rows.push(["صافي يوسف","","",Math.round(sh.yousef.net)]); rows.push(["صافي الوالد","","",Math.round(sh.father.net)]);
  rows.push(["الحساب مع الوالد هالشهر","","",Math.round(fm.balance), L.balanceText(fm.balance).text]);
  return rows;
}
function buildSheets(){
  var months=L.monthsWithData(), out=[];
  var summ=[["المستأجر","النشاط","المطلوب","المحصّل","نسبة التحصيل","أشهر متأخرة"]];
  L.allStores().forEach(function(p){ var b=0,pd=0,lt=0; months.forEach(function(x){ b+=L.baseRequired(p,x); pd+=L.sumPaid(p.id,x); if(L.status(p,x)==="late") lt++; });
    summ.push([p.name,p.business||"",b,pd,b>0?Math.round(pd/b*100)+"%":"0%",lt]); });
  var acc=L.fatherAccount(), dad=[["الشهر","حق الوالد","قبضه الوالد","حوّل يوسف للوالد","حوّل الوالد ليوسف","رصيد الشهر","الرصيد التراكمي"]];
  acc.rows.forEach(function(r){ dad.push([monthLabel(r.month), r.entitled, r.withFather, r.y2f, r.f2y, Math.round(r.balance), Math.round(r.running)]); });
  dad.push([], ["الخلاصة", L.balanceText(acc.balance).text]);
  var ppl=[["الاسم","النوع","النشاط","الإيجار","يوم الاستحقاق","المخزن","التواصل","مدة العقد","بداية العقد","الضمان","قيمة الضمان","نشط؟"]];
  L.people().forEach(function(p){ ppl.push([p.name, isStore(p)?"مستأجر":"التزام", p.business||"", p.rent||0, p.dueDay||"", isStore(p)?(L.unitFor(p)||""):"", p.contact||"", ({month:"شهري","6":"6 أشهر",year:"سنوي"})[p.contractTerm]||"", p.contractStart||"", ({cheque:"شيك",cash:"مبلغ",none:"لا يوجد"})[p.depositType]||"", p.depositAmount||"", p.active!==false?"نعم":"لا"]); });
  out.push({name:"ملخص المستأجرين", rows:summ.concat([[],["آخر تحديث", new Date().toLocaleString("en-GB")]])});
  out.push({name:"الحساب مع الوالد", rows:dad});
  out.push({name:"المستأجرون", rows:ppl});
  months.slice().reverse().forEach(function(mk){ out.push({name:(R.EN_MONTHS[parseInt(mk.split("-")[1],10)-1]+" "+mk.split("-")[0]), rows:monthRows(mk)}); });
  return out;
}
async function exportExcel(){
  if(typeof XLSX==="undefined"){ try{ await RLLoadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"); }catch(e){} }
  if(typeof XLSX==="undefined"){ toast("تعذّر تحميل مكتبة Excel"); return; }
  var wb=XLSX.utils.book_new(); buildSheets().forEach(function(s){ var ws=XLSX.utils.aoa_to_sheet(s.rows); ws["!views"]=[{RTL:true}]; XLSX.utils.book_append_sheet(wb, ws, s.name.slice(0,31)); });
  download(new Blob([XLSX.write(wb,{type:"array",bookType:"xlsx"})],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}), "rent-ledger-"+R.todayISO()+".xlsx");
  toast("تم تجهيز ملف Excel");
}
var sheet={timer:null, busy:false, pending:false, status:"", at:null, booted:false};
function sheetsCfg(){ var g=S().settings.gsheet; return g && g.url && g.token ? g : null; }
function scheduleSheetSync(){ if(!sheetsCfg()) return; clearTimeout(sheet.timer); sheet.timer=setTimeout(function(){ syncSheets(false); },3000); }
function sheetStatus(){ return sheet.status==="syncing"?"جارٍ التحديث…":(sheet.status==="ok"?"محدَّث ✓ "+sheet.at.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}):(sheet.status==="fail"?'<span class="neg">تعذّر التحديث — تحقق من الرابط</span>':(sheet.status==="badtoken"?'<span class="neg">كلمة السر لا تطابق السكربت</span>':(sheetsCfg()?"يتحدّث تلقائيًا بعد كل تعديل":"")))); }
async function syncSheets(manual){
  var g=sheetsCfg(); if(!g){ if(manual) toast("أدخل الرابط وكلمة السر"); return; }
  if(!Object.keys(S().people).length) return;
  if(sheet.busy){ sheet.pending=true; return; }
  sheet.busy=true; sheet.status="syncing"; var el=document.getElementById("gs-status"); if(el) el.innerHTML=sheetStatus();
  var out=null;
  try{ var res=await fetch(g.url,{method:"POST", body:JSON.stringify({token:g.token, sheets:buildSheets()})}); out=await res.json(); if(!out||!out.ok) throw 0;
    sheet.status="ok"; sheet.at=new Date(); if(out.url && out.url!==g.sheetUrl) saveSettings({gsheet:Object.assign({},g,{sheetUrl:out.url})}, true); if(manual) toast("تم تحديث Google Sheets"); }
  catch(e){ sheet.status=(out&&out.error==="unauthorized")?"badtoken":"fail"; if(manual) toast("تعذّر تحديث الملف"); }
  sheet.busy=false; el=document.getElementById("gs-status"); if(el) el.innerHTML=sheetStatus();
  if(sheet.pending){ sheet.pending=false; scheduleSheetSync(); }
}

/* ============================ واتساب و Meta (سكربت meta-api.gs) ============================ */
var meta={checked:false};
function metaUrl(){ var m=S().settings.metaApi; return (m&&m.url)||""; }
function waReady(){ return !!(meta.cfg && meta.cfg.whatsapp); }
function adsReady(){ return !!(meta.cfg && meta.cfg.ads); }
async function metaCall(action, extra){
  var url=metaUrl(); if(!url) throw {code:"bad_url"};
  var tok; try{ tok=await store.idToken(); }catch(e){ throw {code:"login"}; }
  var out; try{ var res=await fetch(url,{method:"POST", body:JSON.stringify(Object.assign({idToken:tok, action:action}, extra||{}))}); out=await res.json(); }catch(e){ throw {code:"net"}; }
  if(!out||!out.ok) throw {code:(out&&out.error)==="unauthorized"?"unauth":"api", message:out&&out.error};
  return out;
}
function metaErr(e){ var c=e&&e.code; return c==="login"?"يتطلب تسجيل الدخول":c==="unauth"?"حسابك مش مسموح بالسكربت — أضف بريدك إلى ALLOWED_EMAILS":c==="net"?"تعذّر الاتصال بالسكربت":c==="bad_url"?"الرابط غير صحيح":"رد Meta: "+String((e&&e.message)||"?").slice(0,140); }
async function checkMeta(){ meta={checked:true, checking:true}; try{ meta.cfg=await metaCall("config"); }catch(e){ meta.err=metaErr(e); } meta.checking=false; render(); }
function armed(el){ if(el.hasAttribute("data-armed")) return true; el.setAttribute("data-armed","1"); setTimeout(function(){ el.removeAttribute("data-armed"); },4000); return false; }
async function sendWa(el){
  var pid=el.getAttribute("data-pid"), kind=el.getAttribute("data-kind"), p=L.person(pid), m=A.month;
  if(!armed(el)){ toast("اضغط مرة ثانية لإرسال الرسالة لـ "+p.name); return; }
  el.disabled=true; toast("جارٍ الإرسال…");
  var params=kind==="renew" ? [p.name, (L.renewal(p)||{date:new Date()}).date.toLocaleDateString("en-GB")] : [p.name, monthLabel(m,"en"), fmtPlain(L.outstanding(p,m))];
  try{ await metaCall("wa_send",{to:digitsOf(p.contact), kind:kind==="renew"?"renew":"reminder", params:params}); savePerson(pid,{lastWaAt:new Date().toISOString(), lastWaMonth:m}, true); toast("انبعتت الرسالة لـ "+p.name+" ✓"); }
  catch(e){ toast(metaErr(e)); el.disabled=false; }
}
function adsHTML(){
  var h='<div class="sec-h"><h2>إعلانات Meta</h2><button type="button" class="btn sm line" data-act="ads">'+(meta.adsLoading?'جارٍ التحميل…':(meta.ads?'تحديث':'عرض الحملات'))+'</button></div><div class="panel">';
  if(meta.adsErr) h+='<p class="note bad" style="padding:14px">'+esc(meta.adsErr)+'</p>';
  if(meta.ads){ if(!meta.ads.campaigns.length) h+='<div class="empty">ما في حملات</div>';
    h+=meta.ads.campaigns.map(function(c){ var on=c.status==="ACTIVE"; return '<div class="trow"><span class="tm"><b>'+esc(c.name)+'</b><small>'+esc(c.effective_status||c.status)+'</small></span>'+(/ARCHIVED|DELETED/.test(c.status)?'':'<button type="button" class="btn sm '+(on?'line':'')+'" data-act="'+(on?'adoff':'adon')+'" data-cid="'+esc(c.id)+'">'+(on?'إيقاف':'تفعيل')+'</button>')+'</div>'; }).join(""); }
  else if(!meta.adsErr) h+='<div class="empty">اضغط «عرض الحملات»</div>';
  return h+'</div>';
}
function paintAds(){ var el=document.getElementById("mx-ads"); if(el) el.innerHTML=adsHTML(); }
async function loadAds(){ meta.adsLoading=true; meta.adsErr=""; paintAds(); try{ meta.ads=await metaCall("ads_list"); }catch(e){ meta.adsErr=metaErr(e); } meta.adsLoading=false; paintAds(); }
async function setCampaign(el,on){ if(!armed(el)){ toast(on?"اضغط مرة ثانية للتفعيل — بيبدأ الصرف":"اضغط مرة ثانية للإيقاف"); return; } el.disabled=true;
  try{ await metaCall(on?"ads_activate":"ads_pause",{campaignId:el.getAttribute("data-cid")}); toast(on?"تم تفعيل الحملة":"تم إيقاف الحملة"); await loadAds(); }catch(e){ meta.adsErr=metaErr(e); paintAds(); } }

/* ============================ تشغيل ============================ */
store = RLStore({
  audit:true,
  onAuth:function(u){ A.phase = u ? "loading" : "login"; A.loginBusy=false; render(); },
  onError:function(code){ if(code==="perm"){ toast("ما عندك صلاحية على البيانات — راجع قواعد Firestore"); } else { A.phase="error"; A.err="تعذّر تحميل Firebase. تحقّق من الإنترنت ثم أعد المحاولة."; render(); } },
  onChange:function(st){
    if(st.ready){ A.phase="ready"; runDataFixes();
      if(!sheet.booted && sheetsCfg() && st.fresh.people && st.fresh.payments){ sheet.booted=true; scheduleSheetSync(); }
      if(!meta.checked && metaUrl() && store.mode==="cloud") checkMeta(); }
    render();
  }
});
render();
store.init();
if("serviceWorker" in navigator && window.isSecureContext) navigator.serviceWorker.register("sw.js").catch(function(){});
})();
