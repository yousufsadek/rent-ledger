  /* ======================= export ======================= */
  function monthSheetName(mk){
    var p=mk.split("-"), y=p[0], m=parseInt(p[1],10)-1;
    return (EN_MONTHS[m]+" "+y).slice(0,31);
  }
  function monthSheetRows(mk){
    var header = LANG==="en"
      ? ["Tenant","Business","Required","Due date","Payment date","Paid?","Amount paid","Balance","Days late","Status","Pay day","Method","Contact","Notes","Settlement with father","Settlement date","Settlement method"]
      : ["اسم المستأجر","النشاط","الإيجار المطلوب","تاريخ الاستحقاق","تاريخ الدفع","دفع؟","المبلغ المدفوع","الرصيد المتبقي","أيام التأخير","الحالة","يوم الدفع","طريقة الدفع","التواصل","ملاحظات","التخالص مع الوالد","تاريخ التخالص","وسيلة التخالص"];
    var rows=[header];
    function addPersonRow(p){
      var doc=payDoc(p.id,mk);
      var required=requiredFor(p,mk);
      var paidAmt=doc?(doc.amountPaid||0):0;
      var st=statusOf(p,doc,mk);
      var dueDate=mk+"-"+String(p.dueDay||1).padStart(2,"0");
      var paymentDate=doc&&doc.paymentDate?doc.paymentDate:"";
      var paidDay=paymentDate?Number(paymentDate.split("-")[2]):"";
      var daysLate="";
      if(dueDate&&paymentDate) daysLate=Math.max(0,Math.round((new Date(paymentDate)-new Date(dueDate))/86400000));
      else if(dueDate&&!paymentDate&&st.key==="overdue") daysLate=Math.max(0,Math.round((new Date()-new Date(dueDate))/86400000));
      rows.push([p.name,p.business||"",required,dueDate,paymentDate,
        (doc&&doc.paid)?(LANG==="en"?"Yes":"نعم"):(LANG==="en"?"No":"لا"),
        paidAmt,Math.max(0,required-paidAmt),daysLate,st.text,paidDay,(doc&&doc.method)||"",p.contact||"",(doc&&doc.notes)||p.note||"",
        p.type==="store"?settleLabel(doc&&doc.settle):"",(doc&&doc.settleDate)||"",(doc&&doc.settleMethod)||""]);
    }
    var partners=activePartners(mk);
    if(partners.length){ partners.forEach(addPersonRow); rows.push([]); }
    var ae=activeByGroup("AE",mk); ae.forEach(addPersonRow); rows.push([]);
    var ote=activeByGroup("ONE_TO_EIGHT",mk); ote.forEach(addPersonRow); rows.push([]);
    var allStores=ae.concat(ote);
    var totalRequired=allStores.reduce(function(a,p){return a+requiredFor(p,mk);},0);
    var totalPaid=allStores.reduce(function(a,p){return a+sumPaid(p.id,mk);},0);
    var y=yousefMonthShare(mk), f=fatherMonthShare(mk);
    rows.push([t("total_due"),"","",Math.round(totalRequired)]);
    rows.push([t("total_collected"),"","",Math.round(totalPaid)]);
    rows.push([t("kpi_rate"),"","",totalRequired>0?Math.round(totalPaid/totalRequired*100)+"%":"0%"]);
    rows.push([t("net_y"),"","",Math.round(y.remaining)]);
    rows.push([t("net_f"),"","",Math.round(f.remaining)]);
    return rows;
  }
  function allMonthsAll(){
    var set={};
    Object.keys(state.payments).forEach(function(k){ set[state.payments[k].month]=true; });
    set[monthKeyNow()]=true;
    return Object.keys(set).sort();
  }
  // نفس الأوراق تُستخدم لملف Excel ولنسخة Google Sheets المشتركة
  function buildSheets(){
    var sheets=[];
    allMonthsAll().forEach(function(mk){ sheets.push({name:monthSheetName(mk), rows:monthSheetRows(mk)}); });
    var nowKey=monthKeyNow();
    var sumHeader = LANG==="en"
      ? ["Tenant","Business","Total required","Total collected","Rate","Late months"]
      : ["المستأجر","النشاط","إجمالي مطلوب","إجمالي محصَّل","نسبة التحصيل","أشهر متأخرة"];
    var summary=[sumHeader];
    var allMk=allMonthsAll().filter(function(mk){ return mk<=nowKey; });
    allStorePeople().forEach(function(p){
      var billed=0,paid=0,overdue=0;
      allMk.forEach(function(mk){
        billed+=baseRequiredFor(p,mk);
        paid+=sumPaid(p.id,mk);
        if(statusOf(p,payDoc(p.id,mk),mk).key==="overdue") overdue++;
      });
      summary.push([p.name,p.business||"",Math.round(billed),Math.round(paid),billed>0?Math.round(paid/billed*100)+"%":"0%",overdue]);
    });
    sheets.push({name:LANG==="en"?"Tenant summary":"ملخص المستأجرين", rows:summary});

    var peopleHeader = LANG==="en"
      ? ["Name","Type","Business","Default rent","Due day","Contact","Term","Contract start","Deposit type","Deposit amount","Active?"]
      : ["الاسم","النوع","النشاط","الإيجار الافتراضي","يوم الاستحقاق","التواصل","مدة العقد","بداية العقد","نوع الضمان","مبلغ الضمان","نشط؟"];
    var peopleSheet=[peopleHeader];
    peopleList().forEach(function(p){
      peopleSheet.push([p.name, p.type==="store"?t("type_tenant"):(p.type==="partner"?t("type_partner"):t("type_inactive")),
        p.business||"", p.rent||0, p.dueDay||"", p.contact||"",
        p.contractTerm?t(TERM_KEYS[p.contractTerm]):"", p.contractStart||"",
        p.depositType?t(DEPOSIT_KEYS[p.depositType]):"", p.depositAmount||"",
        p.active!==false?(LANG==="en"?"Yes":"نعم"):(LANG==="en"?"No":"لا")]);
    });
    sheets.push({name:LANG==="en"?"Tenants & partners":"المستأجرون والشركاء", rows:peopleSheet});
    return sheets;
  }
  async function exportExcel(){
    if(typeof XLSX==="undefined"){
      try{ await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"); }catch(e){}
    }
    if(typeof XLSX==="undefined"){ toast(t("excel_lib_fail")); return; }
    var wb=XLSX.utils.book_new();
    buildSheets().forEach(function(sh){ XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sh.rows), sh.name); });
    var buf=XLSX.write(wb,{type:"array",bookType:"xlsx"});
    var blob=new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    try{
      downloadBlob(blob, "rent-ledger-"+todayISO()+".xlsx");
      toast(t("export_ok"));
    }catch(e){ toast(t("export_fail")); }
  }

  /* ======================= Google Sheets (ملف مشترك أونلاين) ======================= */
  // بعد كل تعديل تُرسَل نفس أوراق Excel إلى Google Apps Script (google-sheets-script.gs)
  // الذي يكتبها في ملف Google Sheets — الملف يبقى محدّثًا دائمًا ويمكن مشاركته
  var SHEET_DEBOUNCE_MS = 3000;
  var sheet = { timer:null, busy:false, pending:false, status:"", at:null, booted:false };
  function sheetsCfg(){ var g=state.settings.gsheet; return (g && g.url && g.token) ? g : null; }
  function scheduleSheetSync(){
    if(!sheetsCfg()) return;
    clearTimeout(sheet.timer);
    sheet.timer=setTimeout(function(){ syncSheets(false); }, SHEET_DEBOUNCE_MS);
  }
  function sheetPayload(g){
    var prev=LANG; LANG="ar"; // الملف المشترك بالعربية دائمًا
    try{
      var all=buildSheets(), months=all.slice(0,-2).reverse(), rest=all.slice(-2);
      rest[0].rows=rest[0].rows.concat([[], ["آخر تحديث", new Date().toLocaleString("en-GB")]]);
      return {token:g.token, sheets:rest.concat(months)}; // الملخص والمستأجرون أولًا ثم الأشهر من الأحدث
    } finally { LANG=prev; }
  }
  async function syncSheets(manual){
    var g=sheetsCfg();
    if(!g || !isSheetScriptUrl(g.url)){ if(manual) toast(t("gs_not_set")); return; }
    if(!Object.keys(state.people).length){ return; } // لا ترسل ملفًا فارغًا قبل تحميل البيانات
    if(sheet.busy){ sheet.pending=true; return; }
    sheet.busy=true; sheet.status="syncing"; paintSheetStatus();
    var body=JSON.stringify(sheetPayload(g)), out=null;
    try{
      // text/plain بدون headers مخصّصة = طلب بسيط بدون preflight، و Apps Script يسمح بقراءة الرد
      var res=await fetch(g.url,{method:"POST", body:body});
      out=await res.json();
      if(!out || !out.ok) throw new Error((out&&out.error)||"error");
      sheet.status="ok"; sheet.at=new Date();
      if(out.url && out.url!==g.sheetUrl) saveSettings({gsheet:Object.assign({},g,{sheetUrl:out.url})}, true);
      if(manual) toast(t("gs_ok"));
    }catch(e){
      sheet.status = (out && out.error==="unauthorized") ? "badtoken" : "fail";
      if(manual) toast(t(sheet.status==="badtoken"?"gs_badtoken":"gs_fail"));
    }
    sheet.busy=false; paintSheetStatus();
    if(sheet.pending){ sheet.pending=false; scheduleSheetSync(); }
  }
  // مزامنة واحدة عند فتح الموقع (لتحديث حالات التأخير مع مرور الأيام) — بعد وصول البيانات من الخادم
  function maybeBootSheetSync(){
    if(sheet.booted || !sheetsCfg()) return;
    if(!(state.fresh.people && state.fresh.payments && state.fresh.settings)) return;
    sheet.booted=true; scheduleSheetSync();
  }
  function sheetStatusHTML(){
    var s=sheet.status, txt;
    if(s==="syncing") txt='<span class="badge soon">'+t("gs_syncing")+'</span>';
    else if(s==="ok") txt='<span class="badge ok">'+t("gs_synced",{tm:sheet.at.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})})+'</span>';
    else if(s==="fail") txt='<span class="badge duenow">'+t("gs_fail")+'</span>';
    else if(s==="badtoken") txt='<span class="badge duenow">'+t("gs_badtoken")+'</span>';
    else txt='<span class="badge">'+t("gs_auto")+'</span>';
    return txt;
  }
  function paintSheetStatus(){ var el=document.getElementById("gs-status"); if(el) el.innerHTML=sheetStatusHTML(); }

        '<div class="field full"><label for="gs-token">'+t("gs_token")+'</label><input id="gs-token" type="text" dir="ltr" autocomplete="off" value="'+esc(g.token||"")+'"></div>' +

          '<button class="btn ghost" data-act="gssync"'+(g.sheetUrl?'':' style="grid-column:1/-1"')+'>'+t("gs_sync")+'</button>' +

  /* ======================= WhatsApp & Meta ads (عبر سكربت meta-api.gs) ======================= */
  // المفاتيح في سكربت Google الخاص بالمستخدم؛ الموقع يرسل فقط توكن تسجيل الدخول ليثبت هويته
  var meta={checked:false, checking:false, cfg:null, err:"", ads:null, adsLoading:false, adsErr:""};
  function metaUrl(){ var m=state.settings.metaApi; return (m && m.url) || ""; }
  function isMetaUrl(u){ return /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(u||""); }
  function waReady(){ return !!(meta.cfg && meta.cfg.whatsapp); }
  function adsReady(){ return !!(meta.cfg && meta.cfg.ads); }
  async function metaCall(action, extra){
    var url=metaUrl();
    if(!isMetaUrl(url)) throw {code:"bad_url"};
    if(!(state.mode==="cloud" && state.user && window.firebase)) throw {code:"login"};
    var idToken=await firebase.auth().currentUser.getIdToken();
    var out;
    try{
      var res=await fetch(url,{method:"POST", body:JSON.stringify(Object.assign({idToken:idToken, action:action}, extra||{}))});
      out=await res.json();
    }catch(e){ throw {code:"net"}; }
    if(!out || !out.ok) throw {code:(out&&out.error)==="unauthorized"?"unauth":"api", message:out&&out.error};
    return out;
  }
  function metaErr(e){
    var c=e&&e.code;
    if(c==="login") return t("mx_login");
    if(c==="unauth") return t("mx_unauth");
    if(c==="bad_url") return t("mx_bad_url");
    if(c==="net") return t("mx_net");
    return t("mx_api",{m:esc(String((e&&e.message)||"?").slice(0,160))});
  }
  async function checkMeta(){
    meta.checked=true; meta.checking=true; meta.err="";
    try{ meta.cfg=await metaCall("config"); }
    catch(e){ meta.cfg=null; meta.err=metaErr(e); }
    meta.checking=false; render();
  }
  function maybeCheckMeta(){
    if(!meta.checked && !meta.checking && metaUrl() && state.mode==="cloud" && state.user && state.dbReady) checkMeta();
  }
  function renderMetaCard(){
    var url=metaUrl();
    var fields='<div class="fgrid" style="margin-top:12px"><div class="field full"><label for="mx-url">'+t("mx_url")+'</label>' +
      '<input id="mx-url" type="url" dir="ltr" placeholder="https://script.google.com/macros/s/…/exec" value="'+esc(url)+'"></div></div>' +
      '<button class="btn block" style="margin-top:10px" data-mx="save">'+t(url?"mx_save":"mx_link")+'</button>';
    var html='<div class="card"><h3>'+t("mx_title")+'</h3><div class="hint">'+t("mx_hint")+'</div>';
    if(state.mode!=="cloud") return html+'<div class="hint" style="color:var(--warning);font-weight:700">'+t("mx_login")+'</div></div>';
    if(!url) return html+fields+'<div class="hint" style="margin-top:8px">'+t("mx_howto")+'</div></div>';
    var st;
    if(meta.checking) st='<span class="badge soon">'+t("mx_checking")+'</span>';
    else if(meta.err) st='<span class="badge duenow">'+meta.err+'</span>';
    else if(meta.cfg) st='<span class="badge ok">'+t("mx_ok",{e:esc(meta.cfg.email||"")})+'</span> ' +
      '<span class="badge '+(meta.cfg.whatsapp?"ok":"")+'">'+t(meta.cfg.whatsapp?"mx_wa_on":"mx_wa_off")+'</span> ' +
      '<span class="badge '+(meta.cfg.ads?"ok":"")+'">'+t(meta.cfg.ads?"mx_ads_on":"mx_ads_off")+'</span>';
    else st='';
    return html+'<div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">'+st+'</div>' +
      '<details class="disclose"><summary>'+t("mx_settings")+'</summary>'+fields +
      '<button class="btn ghostdanger block" style="margin-top:9px" data-mx="unlink">'+t("mx_unlink")+'</button></details></div>';
  }
  function money(minor, cur){ return (Number(minor||0)/100).toLocaleString("en-US")+" "+(cur||""); }
  function adsCardHTML(){
    var html='<div class="card"><h3>'+t("ads_title")+'</h3><div class="hint">'+t("ads_hint")+'</div>';
    if(meta.adsErr) html+='<div style="margin-top:10px"><span class="badge duenow">'+meta.adsErr+'</span></div>';
    if(meta.ads){
      html+='<div style="margin-top:8px">';
      if(!meta.ads.campaigns.length) html+='<div class="hint">'+t("ads_none")+'</div>';
      meta.ads.campaigns.forEach(function(c){
        var eff=c.effective_status||c.status, on=c.status==="ACTIVE";
        var pill=eff==="ACTIVE"?"paid":(/PAUSED|ARCHIVED|DELETED/.test(eff)?"none":(/DISAPPROVED|WITH_ISSUES|BILLING/.test(eff)?"overdue":"partial"));
        var budget=c.daily_budget?t("ads_daily",{b:money(c.daily_budget,meta.ads.currency)}):(c.lifetime_budget?t("ads_life",{b:money(c.lifetime_budget,meta.ads.currency)}):"");
        html+='<div class="camp"><div class="cinfo"><div class="cname">'+esc(c.name)+'</div>' +
          '<div class="cmeta"><span class="pill '+pill+'">'+esc(t("st_"+eff)!=="st_"+eff?t("st_"+eff):eff)+'</span>'+(budget?'<span>'+budget+'</span>':'')+'</div></div>' +
          (/ARCHIVED|DELETED/.test(c.status)?'':'<button class="btn sm '+(on?"ghost":"")+'" data-mx="'+(on?"pause":"activate")+'" data-cid="'+esc(c.id)+'">'+t(on?"ads_pause":"ads_activate")+'</button>') +
        '</div>';
      });
      html+='</div>';
    }
    html+='<div class="fgrid" style="margin-top:10px"><button class="btn ghost" data-mx="ads"'+(meta.adsLoading?' disabled':'')+'>'+t(meta.adsLoading?"ads_loading":(meta.ads?"ads_refresh":"ads_load"))+'</button>'+adButton().replace(' block','').replace('margin-top:8px','margin:0')+'</div>';
    return html+'</div>';
  }
  function paintAds(){ var el=document.getElementById("mx-ads"); if(el) el.innerHTML=adsCardHTML(); }
  async function loadAds(){
    meta.adsLoading=true; meta.adsErr=""; paintAds();
    try{ meta.ads=await metaCall("ads_list"); }catch(e){ meta.adsErr=metaErr(e); }
    meta.adsLoading=false; paintAds();
  }
  // ضغطة أولى «تسليح» والثانية خلال 4 ثوانٍ تنفّذ — لحماية من الإرسال أو الصرف بالخطأ
  function armed(el, label){
    if(el.hasAttribute("data-armed")) return true;
    el.setAttribute("data-armed","1");
    var span=el.querySelector("span"), old=null;
    if(label){ if(span){ old=span.textContent; span.textContent=label; } else if(el.classList.contains("btn")){ old=el.textContent; el.textContent=label; } }
    setTimeout(function(){
      if(!el.isConnected) return;
      el.removeAttribute("data-armed");
      if(old!=null){ if(span) span.textContent=old; else el.textContent=old; }
    },4000);
    return false;
  }
  async function sendWa(el){
    var pid=el.getAttribute("data-pid"), month=el.getAttribute("data-m"), kind=el.getAttribute("data-kind");
    var person=Object.assign({id:pid}, state.people[pid]||{});
    if(!armed(el, t("wa_confirm"))){ if(!el.querySelector("span")) toast(t("wa_confirm_to",{n:person.name})); return; }
    el.disabled=true; el.removeAttribute("data-armed"); toast(t("wa_sending"));
    var params = kind==="renew"
      ? [person.name, (renewalInfo(person)||{renewalDate:new Date()}).renewalDate.toLocaleDateString("en-GB")]
      : [person.name, monthLabelIn(month,"en"), fmtPlain(outstandingFor(person,month))];
    try{
      await metaCall("wa_send",{to:digitsOf(person.contact), kind:kind, params:params});
      savePerson(pid,{lastWaAt:new Date().toISOString(), lastWaMonth:month}, true);
      toast(t("wa_sent",{n:person.name}));
    }catch(e){ toast(metaErr(e)); el.disabled=false; }
  }
  async function setCampaign(el, on){
    if(!armed(el, t(on?"ads_confirm_on":"ads_confirm_off"))) return;
    el.disabled=true;
    try{
      await metaCall(on?"ads_activate":"ads_pause",{campaignId:el.getAttribute("data-cid")});
      toast(t(on?"ads_on":"ads_off"));
      await loadAds();
    }catch(e){ meta.adsErr=metaErr(e); paintAds(); }
  }
  document.getElementById("content").addEventListener("click", function(e){
    var el=e.target.closest("[data-mx]"); if(!el || el.disabled) return;
    var a=el.getAttribute("data-mx");
    if(a==="wa"){ e.preventDefault(); e.stopPropagation(); sendWa(el); }
    else if(a==="ads") loadAds();
    else if(a==="activate") setCampaign(el, true);
    else if(a==="pause") setCampaign(el, false);
    else if(a==="save"){
      var url=(document.getElementById("mx-url").value||"").trim();
      if(!isMetaUrl(url)){ toast(t("mx_bad_url")); return; }
      meta={checked:false, checking:false, cfg:null, err:"", ads:null, adsLoading:false, adsErr:""};
      saveSettings({metaApi:{url:url}});
    }
    else if(a==="unlink"){
      meta={checked:true, checking:false, cfg:null, err:"", ads:null, adsLoading:false, adsErr:""};
      saveSettings({metaApi:null}); toast(t("mx_unlinked"));
    }
  });

  /* ======================= boot ======================= */
  document.getElementById("acctbtn").addEventListener("click", function(){ askLogout(); });
  document.querySelectorAll(".lang button").forEach(function(b){
    b.addEventListener("click",function(){
      LANG=b.getAttribute("data-lang");
      try{ localStorage.setItem("rentbook_lang",LANG); }catch(e){}
      applyLang(); render();
    });
  });

  function boot(initial){
    if(initial&&initial.tab) state.tab=initial.tab;
    if(initial&&initial.month) state.month=initial.month;
    if(initial&&initial.lang) LANG=initial.lang;
    applyLang();
    render();
    initDb();
  }
  var savedTab=null;
  try{ savedTab=localStorage.getItem("rentbook_tab"); }catch(e){}
  boot({tab: (savedTab==="pay"||savedTab==="stats"||savedTab==="people") ? savedTab : null});
  if("serviceWorker" in navigator && window.isSecureContext){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  }
})();
</script>
</body>
</html>
