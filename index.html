<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دفتر الإيجارات</title>
<meta name="theme-color" content="#0E6B57">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دفتر الإيجارات">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<!-- إعدادات Firebase (اختياري) — اتركها فارغة ليعمل الدفتر محليًا على الجهاز -->
<script src="firebase-config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:light dark;
    --bg:#F6F3ED;
    --bg-2:#EFEADF;
    --surface:#FFFFFF;
    --surface-2:#F1ECE1;
    --border:#E3DBCA;
    --border-soft:#EFE9DC;
    --text:#211E18;
    --text-muted:#736B5C;
    --text-faint:#9C9384;
    --accent:#0E6B57;
    --accent-strong:#0A5546;
    --accent-soft:#DFEFE9;
    --accent-2:#B4712B;
    --accent-2-soft:#F6E7D2;
    --success:#1C8A5F;
    --success-soft:#DFF1E7;
    --warning:#B87A11;
    --warning-soft:#FBEDD6;
    --danger:#BC3F34;
    --danger-soft:#F9E3E0;
    --neutral:#8A8272;
    --neutral-soft:#EDE8DC;
    --wa:#25D366;
    --wa-2:#12A85B;
    --tel:#2BB74A;
    --tel-2:#159C36;
    --sms:#2F7CF6;
    --sms-2:#1A5FD0;
    --shadow-sm:0 1px 2px rgba(33,30,24,.05);
    --shadow:0 1px 2px rgba(33,30,24,.05), 0 6px 18px rgba(33,30,24,.06);
    --shadow-lg:0 2px 4px rgba(33,30,24,.06), 0 16px 40px rgba(33,30,24,.10);
    --r-sm:10px; --r:14px; --r-lg:18px; --r-xl:22px;
    --font-ar:"IBM Plex Sans Arabic","Tahoma",sans-serif;
    --font-en:"Inter","IBM Plex Sans Arabic",sans-serif;
    --font-display-ar:"Cairo","IBM Plex Sans Arabic",sans-serif;
    --font-display-en:"Inter","Cairo",sans-serif;
    --font:var(--font-ar);
    --font-display:var(--font-display-ar);
  }
  html[lang="en"]{ --font:var(--font-en); --font-display:var(--font-display-en); }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14120E; --bg-2:#1A1712; --surface:#1E1B15; --surface-2:#272219; --border:#3A3326; --border-soft:#2E2920;
      --text:#F2EDE2; --text-muted:#B3AA94; --text-faint:#8B8371;
      --accent:#42C4A4; --accent-strong:#5AD6B7; --accent-soft:#17352D;
      --accent-2:#E2A45C; --accent-2-soft:#392B16;
      --success:#4CC98A; --success-soft:#1B3828;
      --warning:#E7B15C; --warning-soft:#3A2D15;
      --danger:#E58172; --danger-soft:#3D201B;
      --neutral:#A39D89; --neutral-soft:#282419;
      --shadow-sm:0 1px 2px rgba(0,0,0,.35);
      --shadow:0 1px 2px rgba(0,0,0,.35), 0 6px 20px rgba(0,0,0,.35);
      --shadow-lg:0 2px 6px rgba(0,0,0,.4), 0 18px 44px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14120E; --bg-2:#1A1712; --surface:#1E1B15; --surface-2:#272219; --border:#3A3326; --border-soft:#2E2920;
    --text:#F2EDE2; --text-muted:#B3AA94; --text-faint:#8B8371;
    --accent:#42C4A4; --accent-strong:#5AD6B7; --accent-soft:#17352D;
    --accent-2:#E2A45C; --accent-2-soft:#392B16;
    --success:#4CC98A; --success-soft:#1B3828;
    --warning:#E7B15C; --warning-soft:#3A2D15;
    --danger:#E58172; --danger-soft:#3D201B;
    --neutral:#A39D89; --neutral-soft:#282419;
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:var(--font);font-size:14px;line-height:1.5;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%}
  [hidden]{display:none!important}
  h1,h2,h3{font-family:var(--font-display);font-weight:800;margin:0;text-wrap:balance}
  button{font-family:inherit}
  input,select,textarea{font-family:inherit;color:var(--text)}
  a{color:inherit;text-decoration:none}

  #app{max-width:760px;margin:0 auto;padding:0 16px 56px;font-variant-numeric:tabular-nums}

  /* ---------- header ---------- */
  .hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);padding:12px 0 10px;margin:0 -16px;padding-inline:16px;border-bottom:1px solid var(--border-soft)}
  .hdr-top{display:flex;align-items:center;gap:11px}
  .mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(150deg,var(--accent-strong),var(--accent));display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:800;font-size:17px;flex:none;box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 35%,transparent)}
  .hdr-txt{flex:1;min-width:0}
  .hdr-txt h1{font-size:18px;letter-spacing:-.2px}
  .hdr-txt .sub{font-size:11.5px;color:var(--text-muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lang{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:99px;padding:3px;flex:none}
  .lang button{border:0;background:transparent;color:var(--text-muted);font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:99px;cursor:pointer;line-height:1}
  .lang button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
  .acct{width:34px;height:34px;border-radius:99px;border:1px solid color-mix(in srgb,var(--danger) 40%,var(--border));background:var(--surface-2);color:var(--danger);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0}
  .acct[hidden]{display:none}
  .acct svg{width:17px;height:17px}
  .pwwrap{position:relative}
  .pwwrap input{padding-inline-end:64px}
  .pwtoggle{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--accent);font-size:11.5px;font-weight:700;cursor:pointer;padding:6px 8px}
  .loginrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap}
  .remember{display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer;user-select:none}
  .remember input{width:17px;height:17px;accent-color:var(--accent);margin:0}
  .linkbtn{border:0;background:transparent;color:var(--accent);font-size:12.5px;font-weight:700;cursor:pointer;padding:4px 0;text-decoration:underline}

  .tabs{display:flex;gap:3px;background:var(--surface-2);border-radius:13px;padding:4px;margin-top:11px}
  .tab{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 6px;border:0;border-radius:10px;background:transparent;color:var(--text-muted);font-size:13px;font-weight:600;cursor:pointer;transition:background .16s,color .16s}
  .tab svg{width:15px;height:15px;opacity:.85}
  .tab[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}

  /* ---------- month bar ---------- */
  .monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:6px;box-shadow:var(--shadow-sm)}
  .monthbar .nav{background:var(--surface-2);border:0;border-radius:10px;width:36px;height:36px;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .monthbar .nav:active{background:var(--border)}
  .monthbar .nav svg{width:16px;height:16px}
  .monthlabel{text-align:center;flex:1}
  .monthlabel .m{font-family:var(--font-display);font-weight:800;font-size:16px}
  .monthlabel .today-btn{display:block;font-family:var(--font);font-weight:600;font-size:11px;color:var(--accent);margin-top:1px;cursor:pointer;background:none;border:0;padding:0}

  /* ---------- kpis ---------- */
  .kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 13px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
  .kpi .label{font-size:11.5px;color:var(--text-muted);font-weight:600}
  .kpi .value{font-family:var(--font-display);font-weight:800;font-size:20px;margin-top:3px;letter-spacing:-.3px}
  .kpi .value.accent{color:var(--accent)}
  .kpi .value.warn{color:var(--warning)}
  .kpi .value.danger{color:var(--danger)}
  .kpi .value.ok{color:var(--success)}
  .kpi .meter{height:4px;border-radius:99px;background:var(--neutral-soft);margin-top:8px;overflow:hidden}
  .kpi .meter > i{display:block;height:100%;border-radius:99px;background:var(--accent)}

  /* ---------- cards ---------- */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow-sm);margin-top:14px}
  .card > h3{font-size:14.5px;letter-spacing:-.2px;display:flex;align-items:center;gap:7px}
  .card .hint{font-size:12px;color:var(--text-muted);margin-top:4px;line-height:1.6}
  .card.accented{border-color:color-mix(in srgb,var(--accent) 45%,var(--border));background:linear-gradient(170deg,var(--accent-soft),var(--surface) 62%)}
  .card.accented2{border-color:color-mix(in srgb,var(--accent-2) 45%,var(--border));background:linear-gradient(170deg,var(--accent-2-soft),var(--surface) 62%)}
  .card.okcard{border-color:color-mix(in srgb,var(--success) 45%,var(--border));background:linear-gradient(170deg,var(--success-soft),var(--surface) 70%)}

  .section-title{margin-top:20px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .section-title h2{font-size:12.5px;color:var(--text-muted);letter-spacing:.3px;text-transform:uppercase;font-weight:700}
  .section-title .count{font-size:11.5px;color:var(--text-faint);background:var(--surface-2);border-radius:99px;padding:3px 9px;font-weight:600}

  /* ---------- follow up ---------- */
  .fu-list{display:flex;flex-direction:column;gap:8px;margin-top:11px}
  .fu-item{display:flex;align-items:center;gap:10px;background:var(--bg-2);border:1px solid var(--border-soft);border-radius:var(--r);padding:9px 10px}
  .fu-main{flex:1;min-width:0;cursor:pointer}
  .fu-name{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fu-meta{font-size:11.5px;color:var(--text-muted);margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .fu-amt{font-family:var(--font-display);font-weight:800;font-size:13px;color:var(--danger);white-space:nowrap}

  /* ---------- app-style contact buttons ---------- */
  .apps{display:inline-flex;gap:7px;flex:none}
  .appbtn{width:38px;height:38px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;color:#fff;flex:none;border:0;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.16), inset 0 1px 0 rgba(255,255,255,.22);transition:transform .12s,filter .12s;-webkit-tap-highlight-color:transparent}
  .appbtn:active{transform:scale(.93);filter:brightness(.94)}
  .appbtn svg{width:20px;height:20px;display:block}
  .appbtn.wa{background:linear-gradient(160deg,#4AE07F,var(--wa-2))}
  .appbtn.tel{background:linear-gradient(160deg,#5BE07A,var(--tel-2))}
  .appbtn.sms{background:linear-gradient(160deg,#5C9BFA,var(--sms-2))}
  .appbtn.send{background:linear-gradient(160deg,var(--accent),var(--accent-strong))}
  .appbtn.send[data-armed]{outline:2px solid var(--warning);outline-offset:2px}
  .btn[data-armed]{background:var(--warning);border-color:var(--warning);color:#fff}
  .camp{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border-soft)}
  .camp:last-child{border-bottom:0}
  .camp .cinfo{flex:1;min-width:0}
  .camp .cname{font-weight:700;font-size:13.5px;overflow-wrap:anywhere}
  .camp .cmeta{font-size:11.5px;color:var(--text-muted);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .appbtn.copy{background:linear-gradient(160deg,var(--neutral),#6E6858)}

  .appbar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
  .appwide{display:flex;align-items:center;justify-content:center;gap:7px;height:42px;border-radius:12px;color:#fff;font-size:13px;font-weight:700;border:0;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.14), inset 0 1px 0 rgba(255,255,255,.2);-webkit-tap-highlight-color:transparent}
  .appwide:active{transform:scale(.985);filter:brightness(.95)}
  .appwide svg{width:18px;height:18px;flex:none}
  .appwide.wa{background:linear-gradient(160deg,#4AE07F,var(--wa-2))}
  .appwide.tel{background:linear-gradient(160deg,#5BE07A,var(--tel-2))}
  .appwide.sms{background:linear-gradient(160deg,#5C9BFA,var(--sms-2))}

  /* ---------- tenant rows ---------- */
  .rowlist{display:flex;flex-direction:column;gap:8px}
  details.prow{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-sm);transition:border-color .15s,box-shadow .15s}
  details.prow[open]{border-color:color-mix(in srgb,var(--accent) 50%,var(--border));box-shadow:var(--shadow)}
  details.prow summary{list-style:none;cursor:pointer;padding:11px 12px;display:flex;align-items:center;gap:10px}
  details.prow summary::-webkit-details-marker{display:none}
  .avatar{width:38px;height:38px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border-soft);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:14px;color:var(--text-muted);flex:none}
  .avatar.paid{background:var(--success-soft);color:var(--success);border-color:transparent}
  .avatar.overdue{background:var(--danger-soft);color:var(--danger);border-color:transparent}
  .avatar.partial{background:var(--warning-soft);color:var(--warning);border-color:transparent}
  .prow .pinfo{flex:1;min-width:0}
  .prow .pname{font-weight:700;font-size:14px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .prow .pbiz{font-size:11.5px;color:var(--text-muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prow .pright{text-align:end;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
  .prow .pamt{font-family:var(--font-display);font-weight:800;font-size:13.5px;white-space:nowrap}
  .prow .pamt small{font-weight:600;color:var(--text-faint);font-size:11px}
  .prow .chev{color:var(--text-faint);flex:none;transition:transform .18s}
  .prow .chev svg{width:15px;height:15px;display:block}
  details.prow[open] .chev{transform:rotate(90deg)}
  html[dir="rtl"] .prow .chev{transform:rotate(180deg)}
  html[dir="rtl"] details.prow[open] .chev{transform:rotate(90deg)}

  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
  .pill::before{content:"";width:6px;height:6px;border-radius:99px;background:currentColor;flex:none}
  .pill.paid{background:var(--success-soft);color:var(--success)}
  .pill.partial{background:var(--warning-soft);color:var(--warning)}
  .pill.overdue{background:var(--danger-soft);color:var(--danger)}
  .pill.due{background:var(--neutral-soft);color:var(--neutral)}
  .pill.none{background:var(--neutral-soft);color:var(--text-muted)}

  .badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--neutral-soft);color:var(--text-muted)}
  .badge.soon{background:var(--warning-soft);color:var(--warning)}
  .badge.duenow{background:var(--danger-soft);color:var(--danger)}
  .badge.ok{background:var(--success-soft);color:var(--success)}

  .peditor{padding:2px 12px 14px;border-top:1px solid var(--border-soft);display:flex;flex-direction:column;gap:11px}
  .switchrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;margin-top:10px;background:var(--surface-2);border-radius:var(--r);}
  .switchrow .lbl{font-size:13.5px;font-weight:700}
  .switch{position:relative;width:46px;height:28px;flex:none}
  .switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:2}
  .switch .track{position:absolute;inset:0;background:var(--neutral-soft);border:1px solid var(--border);border-radius:99px;transition:background .18s,border-color .18s}
  .switch input:checked + .track{background:var(--success);border-color:transparent}
  .switch .knob{position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:99px;background:#fff;transition:inset-inline-start .18s;box-shadow:0 1px 4px rgba(0,0,0,.28)}
  .switch input:checked ~ .knob{inset-inline-start:21px}

  .fgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px}
  .field{display:flex;flex-direction:column;gap:5px;min-width:0}
  .field.full{grid-column:1/-1}
  .field label{font-size:11px;color:var(--text-muted);font-weight:700}
  .field input,.field select,.field textarea{border:1px solid var(--border);border-radius:10px;padding:9px 10px;font-size:13.5px;background:var(--bg-2);width:100%}
  .field input,.field select{min-width:0;max-width:100%;height:40px}
  .field input[type="date"]{-webkit-appearance:none;appearance:none;display:block;text-align:start}
  .field input[type="date"]::-webkit-date-and-time-value{text-align:start}
  .field textarea{resize:vertical;min-height:40px}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;background:var(--surface)}

  .noteflag{font-size:11.5px;color:var(--accent-2);background:var(--accent-2-soft);border-radius:10px;padding:8px 10px;line-height:1.6}
  .searchbar{margin-top:12px;position:relative}
  .searchbar input{width:100%;border:1px solid var(--border);border-radius:12px;padding:11px 38px 11px 14px;font-size:13.5px;background:var(--surface)}
  html[dir="ltr"] .searchbar input{padding:11px 14px 11px 38px}
  .searchbar .si{position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);color:var(--text-faint);pointer-events:none}
  .searchbar .si svg{width:16px;height:16px;display:block}

  /* ---------- buttons ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:#fff;border:0;border-radius:11px;padding:10px 16px;font-size:13.5px;font-weight:700;cursor:pointer}
  .btn:active{filter:brightness(.94)}
  .btn.ghost{background:transparent;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 50%,var(--border))}
  .btn.sm{padding:7px 12px;font-size:12.5px;border-radius:9px}
  .btn.block{width:100%}
  .btn.danger{background:var(--danger)}
  .btn.ghostdanger{background:transparent;color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 45%,var(--border))}

  .segrow{display:flex;gap:3px;background:var(--surface-2);border-radius:12px;padding:4px;margin-top:10px}
  .segbtn{flex:1;text-align:center;padding:8px 5px;border:0;border-radius:9px;background:transparent;color:var(--text-muted);font-size:12px;font-weight:600;cursor:pointer}
  .segbtn[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}

  .chiprow{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
  .fchip{border:1px solid var(--border);background:var(--surface-2);border-radius:99px;padding:7px 12px;font-size:12px;font-weight:700;color:var(--text);cursor:pointer;display:inline-flex;gap:7px;align-items:center;font-family:inherit}
  .fchip b{background:var(--danger-soft);color:var(--danger);border-radius:99px;padding:1px 8px;font-size:11.5px;font-family:var(--font-display)}
  .fchip.zero b{background:var(--success-soft);color:var(--success)}
  .fchip[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:transparent}
  .fchip[aria-pressed="true"] b{background:rgba(255,255,255,.22);color:#fff}
  .prtop .pmain{flex:1;min-width:0}
  .prtop .pmain .pname2{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}

  // إيجار الشهر نفسه دون الرصيد المُرحَّل — يُستخدم في التقارير متعددة الأشهر
  // حتى لا يُحتسب المتأخر مرتين (مرة في شهره ومرة في الشهر التالي)
  function baseRequiredFor(person,month){
    if(beforeStart(person,month) || afterEnd(person,month)) return 0;
    var doc=payDoc(person.id,month);
    return doc && doc.billedAmount!=null ? doc.billedAmount : (person.rent||0);
  }
  function carryoverFor(person,month){
    if(month<=ARREARS_START_MONTH) return 0;
    var prev=shiftMonth(month,-1);
    if(prev<ARREARS_START_MONTH) return 0;
    if(person.startMonth && prev<person.startMonth) return 0;
    // لا يُرحَّل إلا رصيد شهر انتهى فعلًا: الشهر الحالي والأشهر القادمة لم تنتهِ بعد،
    // وترحيلها كان يُراكم الإيجار غير المدفوع شهرًا فوق شهر في الأشهر المستقبلية
    if(prev>=monthKeyNow()) return 0;
    return outstandingFor(person,prev);
  }
  function outstandingFor(person,month){
    var doc=payDoc(person.id,month);
    if(doc && doc.paid) return 0;
    return Math.max(0, requiredFor(person,month)-sumPaid(person.id,month));
  }
  function statusOf(person,doc,month){
    if(!doc) return {key:"none", text:t("st_none")};
    var billed=requiredFor(person,month);
    var paid = doc.paid===true || (doc.paid!==false && (doc.amountPaid||0)>=billed && billed>0);
    if(paid) return {key:"paid", text:t("st_paid")};
    if((doc.amountPaid||0)>0) return {key:"partial", text:t("st_partial")};
    var isPast = month < monthKeyNow();
    var isCurrentPastDue = false;
    if(month===monthKeyNow() && person.dueDay){ isCurrentPastDue = new Date().getDate() > person.dueDay; }
    if(isPast||isCurrentPastDue) return {key:"overdue", text:t("st_overdue")};
    return {key:"due", text:t("st_due")};
  }
  function renewalInfo(person){
    if(!person.contractStart||!person.contractTerm||person.contractTerm==="month") return null;
    var months=TERM_MONTHS[person.contractTerm];
    if(!months) return null;
    var start=new Date(person.contractStart+"T00:00:00");
    if(isNaN(start.getTime())) return null;
    var now=new Date(), renewal=new Date(start.getTime()), guard=0;
    while(renewal.getTime()<=now.getTime() && guard<600){ renewal.setMonth(renewal.getMonth()+months); guard++; }
    // عقد انتهى خلال آخر 60 يومًا ولم يُحدَّث تاريخه: يبقى التنبيه «تجاوز موعد التجديد» بدل القفز للدورة التالية
    if(guard>1){
      var prevEnd=new Date(renewal.getTime()); prevEnd.setMonth(prevEnd.getMonth()-months);
      if(now.getTime()-prevEnd.getTime() <= 60*86400000) renewal=prevEnd;
    }
    var daysLeft=Math.round((renewal.getTime()-now.getTime())/86400000);
    // موعد المتابعة = قبل نهاية العقد بشهر، ليتاح وقت للتفاوض والتحصيل
    var action=new Date(renewal.getTime()); action.setMonth(action.getMonth()-1);
    var actionDaysLeft=Math.round((action.getTime()-now.getTime())/86400000);
    return {renewalDate:renewal, daysLeft:daysLeft,
            actionDate:action, actionDaysLeft:actionDaysLeft,
            dueSoon:actionDaysLeft<=0};
  }
  function missingDeposit(p){ return !p.depositType||p.depositType==="none"; }
  // مؤشر اكتمال البيانات: نواقص المستأجرين المفعّلين (المخازن فقط)
  var DC_TESTS = {
    contact:  function(p){ return !digitsOf(p.contact); },
    contract: function(p){ return !p.contractStart||!p.contractTerm; },
    deposit:  function(p){ return missingDeposit(p); }
  };
  function dcStores(){ return peopleList().filter(function(p){ return p.type==="store" && p.active!==false && !p.archived; }); }
  function dcMissing(key){ return dcStores().filter(DC_TESTS[key]); }
  function renderCompleteness(){
    var keys=["contact","contract","deposit"], total=0, chips="";
    keys.forEach(function(k){
      var n=dcMissing(k).length; total+=n;
      chips+='<button type="button" class="fchip'+(n?"":" zero")+'" data-act="pfilter" data-f="'+k+'" aria-pressed="'+(state.peopleFilter===k?"true":"false")+'">'+t("dc_"+k)+' <b>'+n+'</b></button>';
    });

    return '<div class="card" id="dccard"><h3>'+t("dc_title")+'</h3><div class="hint">'+t("dc_hint")+'</div><div class="chiprow">'+chips+
      (state.peopleFilter?'<button type="button" class="fchip" data-act="pfilter" data-f="">'+t("dc_clear")+'</button>':'')+'</div></div>';
  }
  function matchesQuery(p,q){
    if(!q) return true;
    q=q.trim().toLowerCase(); if(!q) return true;
    return String(p.name||"").toLowerCase().indexOf(q)>=0 || String(p.business||"").toLowerCase().indexOf(q)>=0;
  }

  /* ======================= db ======================= */
  // طبقة تخزين بنفس واجهة Firestore: collection().onSnapshot / doc().set
  // — محليًا (localStorage) افتراضيًا، أو Firebase إذا تم ملء firebase-config.js
  var LOCAL_KEY = "rentbook_data";
  var AUDIT_SHOW = 50, AUDIT_LOCAL_MAX = 200;
  function LocalDB(){
    var data = {people:{}, payments:{}, meta:{}, audit:{}}, subs = {};
    function load(){
      try{ var raw = localStorage.getItem(LOCAL_KEY); if(raw){ var d = JSON.parse(raw); data = {people:d.people||{}, payments:d.payments||{}, meta:d.meta||{}, audit:d.audit||{}}; } }catch(e){}
    }
    function clone(v){ return JSON.parse(JSON.stringify(v)); }
    function emit(col){ (subs[col]||[]).forEach(function(f){ f(); }); }
    function persist(){ localStorage.setItem(LOCAL_KEY, JSON.stringify(data)); }
    function listen(col, fn){
      (subs[col] = subs[col]||[]).push(fn); fn();
      return function(){ subs[col] = subs[col].filter(function(x){ return x!==fn; }); };
    }
    function docRef(col, id){
      return {
        set:function(v){
          var c = data[col] = data[col]||{}, before = c[id];
          c[id] = clone(v);
          if(col==="audit"){ var ak=Object.keys(c).sort(); while(ak.length>AUDIT_LOCAL_MAX) delete c[ak.shift()]; }
          try{ persist(); }catch(e){ if(before===undefined) delete c[id]; else c[id]=before; return Promise.reject(e); }
          emit(col); return Promise.resolve();
        },
        onSnapshot:function(cb){
          return listen(col, function(){ var c = data[col]||{}; cb({exists: c.hasOwnProperty(id), data:function(){ return clone(c[id]); }}); });
        }
      };
    }
    load();
    // مزامنة بين التبويبات المفتوحة على نفس الجهاز
    window.addEventListener("storage", function(e){ if(e.key===LOCAL_KEY){ load(); Object.keys(subs).forEach(emit); } });
    return {
      collection:function(col){
        return {
          doc:function(id){ return docRef(col, id); },
          onSnapshot:function(cb){
            return listen(col, function(){ var c = data[col]||{}; cb({docs:Object.keys(c).map(function(id){ return {id:id, data:function(){ return clone(c[id]); }}; })}); });
          }
        };
      },
      doc:function(path){ var p = path.split("/"); return docRef(p[0], p[1]); },
      importAll:function(d){
        Object.keys(d.people||{}).forEach(function(id){ data.people[id] = clone(d.people[id]); });
        Object.keys(d.payments||{}).forEach(function(id){ data.payments[id] = clone(d.payments[id]); });
        if(d.settings) data.meta.settings = clone(d.settings);
        persist(); ["people","payments","meta"].forEach(emit);
        return Promise.resolve();
      }
    };
  }

  var FIREBASE_VER = "10.12.2";
  function loadScript(src){
    return new Promise(function(res, rej){
      var s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s);
    });
  }
  var unsubs = [];
  function subscribe(){
    unsubs.forEach(function(u){ try{ u(); }catch(e){} }); unsubs = [];
    state.dbReady = true;
    function onErr(e){
      if(e && e.code==="permission-denied"){ state.people={}; state.payments={}; render(); toast(t("perm_denied")); }
    }
    function fresh(key, snap){ state.fresh[key] = !(snap.metadata && snap.metadata.fromCache); maybeBootSheetSync(); }
    unsubs.push(db.collection("people").onSnapshot(function(snap){
      var m={}; snap.docs.forEach(function(d){ m[d.id]=d.data(); });
      state.people=m; render(); fresh("people", snap);
    }, onErr));
    unsubs.push(db.collection("payments").onSnapshot(function(snap){
      var m={}; snap.docs.forEach(function(d){ m[d.id]=d.data(); });
      state.payments=m; render(); fresh("payments", snap);
    }, onErr));
    unsubs.push(db.doc("meta/settings").onSnapshot(function(snap){
      if(snap.exists){ state.settings=Object.assign({},state.settings,snap.data()); render(); }
      fresh("settings", snap);
    }, onErr));
    // سجل التعديلات: اشتراك مستقل — فشله (قواعد الأمان لم تُحدَّث بعد) لا يؤثر على بقية البيانات
    state.audit=[]; state.auditDenied=false;
    try{
      var acol=db.collection("audit");
      var aq=(typeof acol.orderBy==="function") ? acol.orderBy("at","desc").limit(AUDIT_SHOW) : acol;
      unsubs.push(aq.onSnapshot(function(snap){
        var arr=snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
        arr.sort(function(a,b){ return String(b.at||"").localeCompare(String(a.at||"")); });
        state.audit=arr.slice(0,AUDIT_SHOW); state.auditDenied=false;
        if(state.tab==="stats") render();
      }, function(e){
        if(e && e.code==="permission-denied"){ state.auditDenied=true; if(state.tab==="stats") render(); }
      }));
    }catch(e){}
  }
  async function initDb(){
    var cfg = window.FIREBASE_CONFIG;
    if(!(cfg && cfg.apiKey)){
      state.mode = "local"; db = LocalDB(); subscribe(); render(); return;
    }
    state.mode = "cloud";
    try{
      var base = "https://www.gstatic.com/firebasejs/"+FIREBASE_VER+"/";
      await loadScript(base+"firebase-app-compat.js");
      await Promise.all([loadScript(base+"firebase-auth-compat.js"), loadScript(base+"firebase-firestore-compat.js")]);
      firebase.initializeApp(cfg);
    }catch(e){ state.dbMissing=true; render(); return; }
    var fs = firebase.firestore();
    // للمطوّرين: الاتصال بمحاكي Firebase المحلي بدل السحابة، مثال: emulatorHost:"localhost"
    if(cfg.emulatorHost){
      firebase.auth().useEmulator("http://"+cfg.emulatorHost+":9099");
      fs.useEmulator(cfg.emulatorHost, 8080);
    }
    // يعمل بدون إنترنت ويزامن عند عودة الاتصال
    try{ await fs.enablePersistence({synchronizeTabs:true}); }catch(e){}
    firebase.auth().onAuthStateChanged(function(user){
      state.user = user || null; state.loggingIn = false;
      syncAcctBtn();
      if(!user){
        unsubs.forEach(function(u){ try{ u(); }catch(e){} }); unsubs = [];
        db = null; state.dbReady = false; state.needLogin = true;
        state.people = {}; state.payments = {};
        render(); return;
      }
      state.needLogin = false; db = fs; subscribe(); render();
    });
  }
  function syncAcctBtn(){
    var b=document.getElementById("acctbtn"); if(!b) return;
    b.hidden = !(state.mode==="cloud" && state.user);
    b.title = t("logout") + (state.user&&state.user.email ? " — "+state.user.email : "");
    b.setAttribute("aria-label", t("logout"));
  }
  function askLogout(){ if(confirm(t("logout_confirm"))) logout(); }
  // «تذكّرني»: مفعّل = تبقى الجلسة بعد إغلاق المتصفح، غير مفعّل = تنتهي بإغلاق التبويب
  function rememberPref(){ try{ return localStorage.getItem("rentbook_remember")!=="0"; }catch(e){ return true; } }
  async function resetPassword(email){
    if(!email){ state.authError=t("reset_need_email"); render(); return; }
    if(!confirm(t("reset_confirm",{e:email}))) return;
    try{ await firebase.auth().sendPasswordResetEmail(email); toast(t("reset_sent")); }
    catch(e){
      if(e && e.code==="auth/user-not-found") toast(t("reset_sent"));
      else { state.authError=t("reset_fail"); render(); }
    }
  }
  async function logout(){
    try{ await firebase.auth().signOut(); }catch(e){}
    try{ var fs=firebase.firestore(); await fs.terminate(); await fs.clearPersistence(); }catch(e){}
    location.reload();
  }
  async function login(email, password, remember){
    state.loggingIn = true; render();
    try{
      localStorage.setItem("rentbook_remember", remember?"1":"0");
      if(remember) localStorage.setItem("rentbook_email", email); else localStorage.removeItem("rentbook_email");
    }catch(e){}
    try{
      var P = firebase.auth.Auth.Persistence;
      await firebase.auth().setPersistence(remember ? P.LOCAL : P.SESSION);
      await firebase.auth().signInWithEmailAndPassword(email, password);
    }
    catch(e){ state.loggingIn = false; state.authError = t("login_fail"); render(); }
  }

  /* ---------- backup / restore ---------- */
  function downloadBlob(blob, filename){
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
  }
  function exportBackup(){
    var data = {app:"rentbook", version:1, exportedAt:new Date().toISOString(),
      people:state.people, payments:state.payments, settings:Object.assign({},state.settings,{gsheet:undefined})};
    downloadBlob(new Blob([JSON.stringify(data, null, 1)], {type:"application/json"}), "rent-ledger-backup-"+todayISO()+".json");
    toast(t("backup_ok"));
  }
  // تنظيف ملف النسخة قبل الاستعادة: معرّفات آمنة فقط، أرقام وتواريخ بصيغتها، ولا يُستعاد رابط/كلمة سر Google Sheets
  function isPlainObj(o){ return !!o && typeof o==="object" && !Array.isArray(o); }
  function cleanBackup(d){
    if(!isPlainObj(d) || !isPlainObj(d.people) || !isPlainObj(d.payments)) return null;
    var num=function(v){ if(v==null||v==="") return null; var n=Number(v); return isFinite(n)?n:null; };
    var dat=function(v){ return (typeof v==="string" && /^\d{4}-\d{2}-\d{2}([T ][\d:.]+(Z|[+-]\d{2}:?\d{2})?)?$/.test(v)) ? v : null; };
    var out={people:{}, payments:{}, settings:null};
    Object.keys(d.people).forEach(function(id){
      var p=d.people[id];
      if(!/^[\w-]{1,80}$/.test(id) || !isPlainObj(p)) return;
      p=Object.assign({},p);
      ["rent","dueDay","depositAmount","order"].forEach(function(k){ if(k in p) p[k]=num(p[k]); });
      ["contractStart","trashedAt","endDate","archivedAt"].forEach(function(k){ if(k in p) p[k]=dat(p[k]); });
      if("archived" in p) p.archived = p.archived===true;
      if("unit" in p) p.unit = (p.unit!=null && /^[A-Za-z0-9]{1,4}$/.test(String(p.unit))) ? String(p.unit).toUpperCase() : null;
      if("prevTenantId" in p && !/^[\w-]{1,80}$/.test(String(p.prevTenantId))) delete p.prevTenantId;
      if("startMonth" in p && !/^\d{4}-\d{2}$/.test(String(p.startMonth))) delete p.startMonth;
      if("endMonth" in p && !/^\d{4}-\d{2}$/.test(String(p.endMonth))) delete p.endMonth;
      out.people[id]=p;
    });
    Object.keys(d.payments).forEach(function(id){
      var y=d.payments[id];
      if(!/^[\w-]{1,80}__\d{4}-\d{2}$/.test(id) || !isPlainObj(y)) return;
      y=Object.assign({},y);
      ["billedAmount","amountPaid"].forEach(function(k){ if(k in y) y[k]=num(y[k]); });
      ["paymentDate","dueDate","settleDate"].forEach(function(k){ if(k in y) y[k]=dat(y[k]); });
      if("settle" in y && ["pending","f2y","y2f","na"].indexOf(y.settle)<0) y.settle=null;
      if("settleMethod" in y && ["Cash","Fawran"].indexOf(y.settleMethod)<0) y.settleMethod=null;
      out.payments[id]=y;
    });
    if(isPlainObj(d.settings)){
      var st=Object.assign({},d.settings);
      delete st.gsheet;
      Object.keys(st).forEach(function(k){ if(typeof st[k]==="string" && !/^[\p{L}\p{N} ._-]{0,24}$/u.test(st[k])) st[k]=num(st[k]); });
      if("variableExpenses" in st){
        var ve={};
        if(isPlainObj(st.variableExpenses)) Object.keys(st.variableExpenses).forEach(function(mk){
          var arr=st.variableExpenses[mk];
          if(!/^\d{4}-\d{2}$/.test(mk) || !Array.isArray(arr)) return;
          arr=arr.filter(function(x){ return isPlainObj(x) && ["yousef","father","split"].indexOf(x.by)>=0 && num(x.amount)>0; })
                 .map(function(x){ return {id:String(x.id||"").replace(/[^\w-]/g,"").slice(0,40), desc:String(x.desc||"").slice(0,60), amount:num(x.amount), by:x.by}; });
          if(arr.length) ve[mk]=arr;
        });
        st.variableExpenses=ve;
      }
      if(state.settings && state.settings.gsheet) st.gsheet=state.settings.gsheet;
      out.settings=st;
    }
    return out;
  }
  function isSheetScriptUrl(u){ return typeof u==="string" && /^https:\/\/script\.google(usercontent)?\.com\//.test(u); }
  async function importBackup(file){
    var d;
    try{ d = cleanBackup(JSON.parse(await file.text())); }catch(e){ toast(t("restore_bad")); return; }
    if(!d){ toast(t("restore_bad")); return; }
    if(!confirm(t("restore_confirm", {p:Object.keys(d.people).length, y:Object.keys(d.payments).length}))) return;
    try{
      if(db.importAll) await db.importAll(d);
      else{
        // Firestore: دفعات من 400 عملية كحد أقصى
        var writes = [];
        Object.keys(d.people).forEach(function(id){ writes.push([db.collection("people").doc(id), d.people[id]]); });
        Object.keys(d.payments).forEach(function(id){ writes.push([db.collection("payments").doc(id), d.payments[id]]); });
        if(d.settings) writes.push([db.doc("meta/settings"), d.settings]);
        for(var i=0; i<writes.length; i+=400){
          var b = db.batch();
          writes.slice(i, i+400).forEach(function(w){ b.set(w[0], w[1]); });
          await b.commit();
        }
      }
      toast(t("restore_ok")); scheduleSheetSync();
    }catch(e){ toast(t("save_fail")); }
  }
  /* ---------- audit log ---------- */
  var AUDIT_FIELDS = [["billedAmount","base_rent"],["amountPaid","amount_paid"],["paid","paid_q"],["paymentDate","payment_date"],
                      ["method","method"],["notes","note"],["settle","settle"],["settleDate","settle_date"],["settleMethod","settle_method"]];
  // يسجّل الحقول التي تغيّرت فقط (قبل/بعد) مع بريد المستخدم والتوقيت. لا ينتظر الحفظ ولا يعطّله إن فشل.
  function logPaymentAudit(personId, month, existed, before, after){
    try{
      var person=state.people[personId]||{}, b={}, a={}, changed=false;
      var base = existed ? before : {billedAmount:(person.rent||0), paid:false, amountPaid:0};
      AUDIT_FIELDS.forEach(function(f){
        var k=f[0], x=base[k]==null?null:base[k], y=after[k]==null?null:after[k];
        if(x!==y){ b[k]=x; a[k]=y; changed=true; }
      });
      if(!changed) return;
      var hadMoney = existed && ((before.amountPaid||0)>0 || before.paid===true);
      var cleared = hadMoney && !((after.amountPaid||0)>0) && after.paid!==true;
      var entry={ at:new Date().toISOString(), email:(state.user&&state.user.email)||"local",
        action: !existed ? "create" : (cleared ? "delete" : "update"),
        personId:personId, personName:person.name||"", month:month, before:b, after:a };
      if(!db) return;
      var id=Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8);
      var w=db.collection("audit").doc(id).set(entry);
      if(w && w.catch) w.catch(function(e){ if(e && e.code==="permission-denied"){ state.auditDenied=true; } });
    }catch(e){}
  }
  async function savePayment(personId,month,patch){
    var docId=personId+"__"+month;
    var existed=!!state.payments[docId];
    var existing=state.payments[docId]||{};
    var person=state.people[personId]||{};
    var merged=Object.assign({
      personId:personId, month:month,
      billedAmount:(existing.billedAmount!=null?existing.billedAmount:(person.rent||0)),
      paid:false, amountPaid:0, dueDate:null, paymentDate:null, method:null, notes:null, settle:null, settleDate:null, settleMethod:null,
      business:person.business||null
    }, existing, patch, {updatedAt:new Date().toISOString()});
    state.payments[docId]=merged; render(); scheduleSheetSync();
    logPaymentAudit(personId, month, existed, existing, merged);
    if(!db) return;
    try{ await db.collection("payments").doc(docId).set(merged); toast(t("saved")); }
    catch(e){ toast(t("save_fail")); }
  }
  async function savePerson(personId,patch,quiet){
    var merged=Object.assign({},state.people[personId]||{},patch);
    state.people[personId]=merged; render(); scheduleSheetSync();
    if(!db) return;
    try{ await db.collection("people").doc(personId).set(merged); if(!quiet) toast(t("saved")); }
    catch(e){ toast(t("save_fail")); }
  }
  // إنهاء الإشغال: تغيير إضافي فقط — يُضاف للسجل archived/endDate/endMonth (وunit إن أمكن استنتاجه) ولا يُمس أي حقل قائم ولا أي دفعة
  async function endOccupancy(pid, endDate, next){
    var p=state.people[pid]; if(!p) return;
    var unit=unitFor(Object.assign({id:pid},p));
    var patch={archived:true, endDate:endDate, endMonth:endDate.slice(0,7), archivedAt:new Date().toISOString()};
    if(unit && !p.unit) patch.unit=unit;
    state.editPersonId=null; state.endOccId=null;
    await savePerson(pid, patch, true);
    if(next){
      await addPerson(next.name, "store", next.rent, next.dueDay, next.business, p.group,
        {startMonth:next.startMonth, unit:unit, prevTenantId:pid, order:p.order||null});
    }
    toast(t("oc_done"));
  }
  async function trashPerson(personId){
    var merged=Object.assign({},state.people[personId]||{},{trashed:true,trashedAt:new Date().toISOString()});
    state.people[personId]=merged;
    if(state.editPersonId===personId) state.editPersonId=null;
    render(); scheduleSheetSync();
    if(!db) return;
    try{ await db.collection("people").doc(personId).set(merged); toast(t("moved_trash")); }
    catch(e){ toast(t("save_fail")); }
  }
  async function restorePerson(personId){
    var merged=Object.assign({},state.people[personId]||{},{trashed:false,trashedAt:null});
    state.people[personId]=merged; render(); scheduleSheetSync();
    if(!db) return;
    try{ await db.collection("people").doc(personId).set(merged); toast(t("restored")); }
    catch(e){ toast(t("save_fail")); }
  }
  async function saveSettings(patch, quiet){
    state.settings=Object.assign({},state.settings,patch); render();
    if(!quiet) scheduleSheetSync();
    if(!db) return;
    try{ await db.doc("meta/settings").set(state.settings); if(!quiet) toast(t("settings_updated")); }
    catch(e){ toast(t("save_fail")); }
  }
  var addCounter=0;
  async function addPerson(name,type,rent,dueDay,business,group,more){
    addCounter++;
    var id="p_"+Date.now().toString(36)+addCounter;
    var data={ name:name, nameAr:null, type:type, group: type==="store"?(group||"ONE_TO_EIGHT"):null,
      business:business||null, rent:rent||0, dueDay:dueDay||null, contact:null,
      active:true, order:peopleList().length+1, note:null, role:null, startMonth:monthKeyNow() };
    if(more) Object.keys(more).forEach(function(k){ if(more[k]!=null) data[k]=more[k]; });
    state.people[id]=data; render(); scheduleSheetSync();
    if(!db) return;
    try{ await db.collection("people").doc(id).set(data); toast(t("added")); }
    catch(e){ toast(t("save_fail")); }
  }

  /* ======================= render ======================= */
  function renderTabs(){
    var tabs=[["pay","tab_pay",ICON.pay],["stats","tab_stats",ICON.stats],["people","tab_people",ICON.people]];
    document.getElementById("tabs").innerHTML = tabs.map(function(x){
      return '<button class="tab" data-tab="'+x[0]+'" role="tab" aria-selected="'+(state.tab===x[0]?"true":"false")+'">'+x[2]+'<span>'+t(x[1])+'</span></button>';
    }).join("");
    document.querySelectorAll(".tab").forEach(function(btn){
      btn.addEventListener("click", function(){ state.statementId=null; state.tab=btn.getAttribute("data-tab"); try{ localStorage.setItem("rentbook_tab",state.tab); }catch(e){} render(); window.scrollTo({top:0,behavior:"smooth"}); });
    });
  }

  function render(){
    document.querySelectorAll(".tab").forEach(function(btn){
      btn.setAttribute("aria-selected", btn.getAttribute("data-tab")===state.tab?"true":"false");
    });
    var c=document.getElementById("content");
    if(state.dbMissing){ c.innerHTML='<div class="banner">'+t("db_missing")+'</div>'; return; }
    if(state.needLogin){ c.innerHTML=renderLogin(); wireLogin(); return; }
    if(!state.dbReady){ c.innerHTML='<div class="empty">'+t("loading")+'</div>'; return; }
    if(state.tab==="pay") c.innerHTML=renderPay();
    else if(state.tab==="stats") c.innerHTML=renderStats();
    else c.innerHTML=renderPeople();
    wireEvents();
    if(state.tab==="stats") drawTrend();
    maybeCheckMeta();
  }

      '<h3>'+t("login_title")+'</h3><div class="hint">'+t("login_hint")+'</div>' +
      '<div class="fgrid" style="margin-top:12px">' +
        '<div class="field full"><label for="li-email">'+t("email")+'</label><input id="li-email" type="email" autocomplete="username" dir="ltr" required value="'+esc(state.loginEmail!=null?state.loginEmail:savedEmail())+'"></div>' +
        '<div class="field full"><label for="li-pass">'+t("password")+'</label><div class="pwwrap" dir="ltr"><input id="li-pass" type="password" autocomplete="current-password" dir="ltr" required>' +
          '<button type="button" class="pwtoggle" id="li-show" aria-pressed="false">'+t("show_pw")+'</button></div></div>' +
      '</div>' +
      '<div class="loginrow"><label class="remember"><input type="checkbox" id="li-remember"'+((state.loginRemember!=null?state.loginRemember:rememberPref())?' checked':'')+'><span>'+t("remember_me")+'</span></label>' +
        '<button type="button" class="linkbtn" id="li-forgot">'+t("forgot_pw")+'</button></div>' +
      (state.authError?'<div class="hint" style="color:var(--danger);font-weight:700">'+esc(state.authError)+'</div>':'') +

  function savedEmail(){ try{ return localStorage.getItem("rentbook_email")||""; }catch(e){ return ""; } }
  function wireLogin(){
    var f=document.getElementById("loginform");
    f.addEventListener("submit",function(e){
      e.preventDefault(); state.authError="";
      state.loginEmail=document.getElementById("li-email").value.trim();
      state.loginRemember=document.getElementById("li-remember").checked;
      login(state.loginEmail, document.getElementById("li-pass").value, state.loginRemember);
    });
    var pw=document.getElementById("li-pass"), sh=document.getElementById("li-show");
    sh.addEventListener("click",function(){
      var show=pw.type==="password"; pw.type=show?"text":"password";
      sh.textContent=t(show?"hide_pw":"show_pw"); sh.setAttribute("aria-pressed",show?"true":"false");
    });
    document.getElementById("li-forgot").addEventListener("click",function(){
      state.authError=""; state.loginEmail=document.getElementById("li-email").value.trim();
      state.loginRemember=document.getElementById("li-remember").checked;
      resetPassword(state.loginEmail);
    });
  }

      '<button class="nav" data-act="prevm" aria-label="prev">'+(rtl?ICON.chevR:ICON.chevL)+'</button>' +

  function kpi(label,value,cls,meter){
    return '<div class="kpi"><div class="label">'+label+'</div><div class="value '+(cls||"")+'">'+value+'</div>' +
      (meter!=null?'<div class="meter"><i style="width:'+Math.max(0,Math.min(100,Math.round(meter*100)))+'%"></i></div>':'') +
    '</div>';
  }

  function renderFollowupCard(month){
    var all=activeByGroup("AE",month).concat(activeByGroup("ONE_TO_EIGHT",month));
    var items=all.map(function(p){
      var doc=payDoc(p.id,month);
      var st=statusOf(p,doc,month);
      var req=requiredFor(p,month);
      var paidAmt=doc?(doc.amountPaid||0):0;
      return {p:p, st:st, remaining:Math.max(0,req-paidAmt)};
    }).filter(function(it){ return it.st.key!=="paid"; });

    if(items.length===0){
      return '<div class="card okcard"><h3 style="color:var(--success)"><span style="width:18px;height:18px;display:inline-flex;color:var(--success)">'+ICON.check+'</span>'+t("all_paid")+'</h3></div>';
    }
    var order={overdue:0,due:1,partial:2,none:3};
    items.sort(function(a,b){ return (order[a.st.key]!=null?order[a.st.key]:9)-(order[b.st.key]!=null?order[b.st.key]:9) || b.remaining-a.remaining; });

    var html='<div class="card accented"><h3 style="color:var(--accent)">'+t("fu_title")+' ('+items.length+')</h3>' +
      '<div class="hint">'+t("fu_hint")+'</div><div class="fu-list">';
    items.forEach(function(it){
      html += '<div class="fu-item">' +
        '<div class="fu-main" data-act="jumpto" data-rid="'+it.p.id+'__'+month+'">' +
          '<div class="fu-name">'+esc(it.p.name)+'</div>' +
          '<div class="fu-meta"><span class="pill '+it.st.key+'">'+it.st.text+'</span><span class="fu-amt">'+fmt(it.remaining)+'</span></div>' +
        '</div>' + appBtns(it.p, month) +
      '</div>';
    });
    return html+'</div></div>';
  }

  function renderRenewalCard(month){
    var items=[];
    peopleList().forEach(function(p){
      if(p.type!=="store"||p.active===false||p.archived) return;
      var r=renewalInfo(p);
      if(r && (r.actionDaysLeft<=0 || r.daysLeft<=CONTRACT_ALERT_DAYS)) items.push({p:p, r:r});
    });
    if(!items.length) return "";
    items.sort(function(a,b){ return a.r.daysLeft-b.r.daysLeft; });
    var html='<div class="card accented2" id="contractcard"><h3 style="color:var(--accent-2)">'+t("rn_title")+' ('+items.length+')</h3>' +
      '<div class="hint">'+t("rn_hint",{n:CONTRACT_ALERT_DAYS})+'</div><div class="fu-list">';
    items.forEach(function(it){
      var d=it.r.renewalDate.toLocaleDateString("en-GB");
      var late=it.r.daysLeft<0;
      html += '<div class="fu-item">' +
        '<div class="fu-main" data-act="jumpto" data-rid="'+it.p.id+'__'+month+'">' +
          '<div class="fu-name">'+esc(it.p.name)+'</div>' +
          '<div class="fu-meta"><span class="badge '+(late?"duenow":"soon")+'">'+
            (late?t("rn_passed"):t("rn_left",{n:it.r.daysLeft}))+'</span>' +
            '<span>'+t("rn_on",{d:d})+'</span>' +
            (it.r.actionDaysLeft<=0 ? '<span class="badge duenow">'+t("ca_due")+'</span>'
                                    : '<span class="badge">'+t("ca_followup",{d:it.r.actionDate.toLocaleDateString("en-GB")})+'</span>')+'</div>' +
        '</div>' + appBtns(it.p, month, "renew") +
      '</div>';
    });
    return html+'</div></div>';
  }

  function renderPay(){
    var month=state.month, q=state.payQuery;
    var groups=[
      {title:t("grp_ae"), list:activeByGroup("AE",month).filter(function(p){return matchesQuery(p,q);})},
      {title:t("grp_ote"), list:activeByGroup("ONE_TO_EIGHT",month).filter(function(p){return matchesQuery(p,q);})},
      {title:t("grp_partner"), ob:true, list:activePartners(month).filter(function(p){return matchesQuery(p,q);})}
    ];
    var stores=activeByGroup("AE",month).concat(activeByGroup("ONE_TO_EIGHT",month));
    var billedSum=0,paidSum=0,overdueCount=0,notRecorded=0,settlePending=0;
    stores.forEach(function(p){
      var doc=payDoc(p.id,month);
      billedSum+=requiredFor(p,month);
      paidSum+=doc?(doc.amountPaid||0):0;
      var st=statusOf(p,doc,month);
      if(st.key==="overdue") overdueCount++;
      if(st.key==="none") notRecorded++;
      if(doc&&doc.settle==="pending") settlePending++;
    });
    var rate = billedSum>0?paidSum/billedSum:0;

    var future=isFutureMonth(month);
    var html=renderMonthbar();
    // شهر لم يبدأ: لا مؤشرات تأخير ولا نسبة تحصيل — فقط الدخل المتوقع وما حُصِّل مقدمًا
    if(future){
      html+='<div class="kpis">' +
        kpi(t("kpi_expected"), fmt(billedSum), "accent") +
        kpi(t("kpi_prepaid"), fmt(paidSum), paidSum>0?"ok":"") +
      '</div>';
    } else {
      html+='<div class="kpis">' +
        kpi(t("kpi_due"), fmt(billedSum)) +
        kpi(t("kpi_collected"), fmt(paidSum), "ok") +
        kpi(t("kpi_rate"), pct(rate), rate>=0.9?"ok":(rate>=0.5?"warn":"danger"), rate) +
        kpi(t("kpi_overdue"), overdueCount+" / "+notRecorded, overdueCount>0?"danger":"") +
      '</div>';
    }
    if(settlePending>0) html+='<div class="noteflag" style="margin-top:10px">'+t("settle_kpi")+': <b>'+settlePending+'</b></div>';
    html+= future ? '<div class="card"><h3>'+forecastBadge()+' '+monthLabel(month)+'</h3><div class="hint">'+t("forecast_note")+'</div></div>' : renderFollowupCard(month);
    html+=renderRenewalCard(month);

    html+='<div class="segrow" style="margin-top:14px">' +
      '<button class="segbtn" data-act="payview" data-v="list" aria-selected="'+(state.payView==="list"?"true":"false")+'">'+t("view_list")+'</button>' +
      '<button class="segbtn" data-act="payview" data-v="plan" aria-selected="'+(state.payView==="plan"?"true":"false")+'">'+t("view_plan")+'</button>' +
    '</div>';

    if(state.payView==="plan"){
      html+='<div class="segrow" style="margin-top:8px">' +
        '<button class="segbtn" data-act="plandir" data-d="v" aria-selected="'+(state.planDir==="v"?"true":"false")+'">'+t("dir_v")+'</button>' +
        '<button class="segbtn" data-act="plandir" data-d="h" aria-selected="'+(state.planDir==="h"?"true":"false")+'">'+t("dir_h")+'</button>' +
      '</div>';
      html+=renderPlan(month);
      return html;
    }

    html+='<div class="searchbar"><span class="si">'+ICON.search+'</span><input type="text" id="payq" placeholder="'+t("search_pay")+'" value="'+esc(q)+'"></div>';

    groups.forEach(function(g){
      html+='<div class="section-title"><h2>'+g.title+'</h2><span class="count">'+g.list.length+' '+t(g.ob?"count_obligations":"count_tenants")+'</span></div>';
      if(g.list.length===0){ html+='<div class="empty">'+(q?t("no_results"):t(g.ob?"none_ob":"none_here"))+'</div>'; }
      else{
        html+='<div class="rowlist">';
        g.list.forEach(function(p){ html+=renderPayRow(p,month); });
        html+='</div>';
      }
    });
    return html;
  }

  function renderPayRow(p,month){
    var doc=payDoc(p.id,month);
    var baseBilled = doc && doc.billedAmount!=null ? doc.billedAmount : (p.rent||0);
    var carry=carryoverFor(p,month);
    var totalRequired=baseBilled+carry;
    var st=statusOf(p,doc,month);
    var rid=p.id+"__"+month;
    var open = state.openRow===rid ? " open" : "";
    var amountPaid = doc?(doc.amountPaid||0):"";
    var paymentDate = doc&&doc.paymentDate?doc.paymentDate:"";
    var method = doc&&doc.method?doc.method:"";
    var notes = doc&&doc.notes?doc.notes:"";
    var paidChecked = !!(doc && (doc.paid===true || (doc.paid!==false && (doc.amountPaid||0)>=totalRequired && totalRequired>0)));

    var methodOpts='<option value="">—</option>'+METHODS.map(function(m){
      return '<option value="'+m[0]+'"'+(method===m[0]?" selected":"")+'>'+t(m[1])+'</option>';
    }).join("");

    // شارة الضمان انتقلت لصفحة المستأجرين — هون بنخلي الصف هادي، بس تنبيه التجديد لما يقرب
    var badges="";
    var r=renewalInfo(p);
    var settle = doc&&doc.settle?doc.settle:"";
    var settleDate = doc&&doc.settleDate?doc.settleDate:"";
    if(p.type==="store"){
      if(settle==="pending") badges+='<span class="badge soon">'+t("b_st_pending")+'</span>';
      else if(settle==="f2y"||settle==="y2f") badges+='<span class="badge ok">'+t("b_st_done")+'</span>';
    }
    var settleOpts='<option value="">—</option>'+SETTLES.map(function(m){
      return '<option value="'+m[0]+'"'+(settle===m[0]?" selected":"")+'>'+t(m[1])+'</option>';
    }).join("");
    var settleAmt=settleAmount(p,doc);
    var settleDone=(settle==="f2y"||settle==="y2f");
    var settleMethod = doc&&doc.settleMethod?doc.settleMethod:"";
    var settleMethOpts='<option value="">—</option>'+SETTLE_METHODS.map(function(m){
      return '<option value="'+m[0]+'"'+(settleMethod===m[0]?" selected":"")+'>'+t(m[1])+'</option>';
    }).join("");
    var settleBlock = p.type!=="store" ? "" :
      '<div class="field"><label for="stl-'+rid+'">'+t("settle")+'</label><select id="stl-'+rid+'" data-act="settle" data-pid="'+p.id+'" data-m="'+month+'">'+settleOpts+'</select></div>' +
      '<div class="field"><label for="stld-'+rid+'">'+t("settle_date")+'</label><input type="date" id="stld-'+rid+'" data-act="settledate" data-pid="'+p.id+'" data-m="'+month+'" value="'+settleDate+'"></div>' +
      (settleDone?'<div class="field full"><label for="stlm-'+rid+'">'+t("settle_method")+'</label><select id="stlm-'+rid+'" data-act="settlemethod" data-pid="'+p.id+'" data-m="'+month+'">'+settleMethOpts+'</select></div>':'') +
      (settleAmt>0?'<div class="field full"><div class="noteflag">'+t("settle_hint",{a:fmt(settleAmt)})+'</div></div>':'');
    if(p.archived) badges+='<span class="badge">'+t("oc_archived")+'</span>';
    if(r&&r.dueSoon&&!p.archived) badges+='<span class="badge '+(r.daysLeft<0?"duenow":"soon")+'">'+t("b_renewal")+'</span>';

    var carryLine = carry>0 ? '<div class="noteflag">'+t("carry_line",{c:fmt(carry), t:fmt(totalRequired)})+'</div>' : "";
    var avCls = st.key==="paid"?"paid":(st.key==="overdue"?"overdue":(st.key==="partial"?"partial":""));

    return '<details class="prow" data-rid="'+rid+'"'+open+'>' +
      '<summary>' +
        '<div class="avatar '+avCls+'">'+esc(initials(p.name))+'</div>' +
        '<div class="pinfo">' +
          '<div class="pname">'+esc(p.name)+badges+'</div>' +
          (p.business?'<div class="pbiz">'+esc(p.business)+'</div>':'') +
        '</div>' +
        '<div class="pright">' +
          ((isFutureMonth(month)&&(st.key==="none"||st.key==="due")) ? '<span class="pill due">'+t("forecast")+'</span>' : '<span class="pill '+st.key+'">'+st.text+'</span>') +
          '<span class="pamt">'+fmt(amountPaid||0)+' <small>'+t("of")+' '+fmt(totalRequired)+'</small></span>' +
        '</div>' +
        '<span class="chev">'+ICON.chevR+'</span>' +
      '</summary>' +
      '<div class="peditor">' +
        (carryLine?'<div style="margin-top:10px">'+carryLine+'</div>':'') +
        '<div class="switchrow">' +
          '<span class="lbl">'+t("paid_q")+'</span>' +
          '<label class="switch">' +
            '<input type="checkbox" data-act="togglepaid" data-pid="'+p.id+'" data-m="'+month+'" data-billed="'+totalRequired+'" '+(paidChecked?"checked":"")+'>' +
            '<span class="track"></span><span class="knob"></span>' +
          '</label>' +
        '</div>' +
        '<div class="fgrid">' +
          '<div class="field"><label for="rent-'+rid+'">'+t("base_rent")+'</label><input type="number" id="rent-'+rid+'" data-act="billed" data-pid="'+p.id+'" data-m="'+month+'" value="'+baseBilled+'"></div>' +
          '<div class="field"><label for="amt-'+rid+'">'+t("amount_paid")+'</label><input type="number" id="amt-'+rid+'" data-act="amount" data-pid="'+p.id+'" data-m="'+month+'" value="'+amountPaid+'" placeholder="0"></div>' +
          '<div class="field"><label for="date-'+rid+'">'+t("payment_date")+'</label><input type="date" id="date-'+rid+'" data-act="date" data-pid="'+p.id+'" data-m="'+month+'" value="'+paymentDate+'"></div>' +

  /* ======================= warehouse floor plan ======================= */
  // ---------- مخطط الموقع ----------
  // قياسات يوسف الفعلية (متر): A ‎5×8‎ · B,C,D ‎6×8.2‎ · E ‎10×4‎
  // 1–6 ‎5.5×9‎ · 7,8 ‎6.5×12.5‎ — الوحدات مرسومة بمقياس رسم واحد للهنجرين
  var PLAN = {
    ae:{ w:10, h:37.4, side:"west", label:"blk_ae", dims:"A–E",
      cells:[
        {id:"E", x:0,   y:0,    w:10,  h:4},
        {id:"D", x:0,   y:4.2,  w:6,   h:8.2},
        {id:"C", x:0,   y:12.6, w:6,   h:8.2},
        {id:"B", x:0,   y:21,   w:6,   h:8.2},
        {id:"A", x:0,   y:29.4, w:5,   h:8}
      ]},
    ote:{ w:14.5, h:40.1, side:"east", label:"blk_ote", dims:"1–8",
      corridor:{x:5.5, y:12.7, w:3.5, h:27.4},
      cells:[
        {id:"8", x:0,    y:0,   w:7.25, h:12.5},
        {id:"7", x:7.25, y:0,   w:7.25, h:12.5},
        {id:"6", x:0,   y:12.7, w:5.5, h:9},
        {id:"5", x:9,   y:12.7, w:5.5, h:9},
        {id:"4", x:0,   y:21.9, w:5.5, h:9},
        {id:"3", x:9,   y:21.9, w:5.5, h:9},
        {id:"2", x:0,   y:31.1, w:5.5, h:9},
        {id:"1", x:9,   y:31.1, w:5.5, h:9}
      ]}
  };
  var PLAN_GAP = 2;  // فراغ بين الهنجرين على الرسمة

  // هادي بالأصل: ورق أبيض وحدود رفيعة. اللون الواضح محجوز للمتأخر فقط.
  var PLAN_STYLE = {
    paid:   {fill:"var(--surface)",      edge:"var(--success)", ink:"var(--text)",   show:false},
    due:    {fill:"var(--surface)",      edge:"var(--neutral)", ink:"var(--text)",   show:false},
    none:   {fill:"var(--surface)",      edge:"var(--neutral)", ink:"var(--text)",   show:false},
    partial:{fill:"var(--warning-soft)", edge:"var(--warning)", ink:"var(--warning)",show:true},
    overdue:{fill:"var(--danger-soft)",  edge:"var(--danger)",  ink:"var(--danger)", show:true},
    vacant: {fill:"var(--surface-2)",    edge:"var(--border)",  ink:"var(--text-faint)",show:true}
  };
  function planTokens(name){
    var core=String(name||"").replace(/store|stores|مخزن|مخازن/ig," ");
    return (core.match(/\d+|[A-Za-z]/g)||[]).map(function(x){ return x.toUpperCase(); });
  }
  // المخزن: الحقل الاختياري unit إن وُجد، وإلا يُستنتج من الاسم كما في السابق
  function cellMatches(p, cellId){
    var id=String(cellId).toUpperCase();
    return p.unit ? String(p.unit).toUpperCase()===id : planTokens(p.name).indexOf(id)>=0;
  }
  function personForCell(cellId, month){
    var list=activeByGroup("AE",month).concat(activeByGroup("ONE_TO_EIGHT",month)).filter(function(p){ return cellMatches(p,cellId); });
    if(month){ for(var i=0;i<list.length;i++){ if(!beforeStart(list[i],month)) return list[i]; } }
    return list[0]||null;
  }
  function allCells(){
    return PLAN.ae.cells.map(function(c){ return {id:c.id, group:"AE"}; }).concat(PLAN.ote.cells.map(function(c){ return {id:c.id, group:"ONE_TO_EIGHT"}; }))
      .sort(function(a,b){ return a.group===b.group ? String(a.id).localeCompare(String(b.id),"en",{numeric:true}) : (a.group==="AE"?-1:1); });
  }
  function cellGroup(id){ var c=allCells().filter(function(x){ return x.id===String(id).toUpperCase(); })[0]; return c?c.group:null; }
  function unitFor(p){
    if(p.unit) return String(p.unit).toUpperCase();
    var cells=allCells().filter(function(c){ return c.group===p.group; });
    for(var i=0;i<cells.length;i++){ var hit=personForCell(cells[i].id, monthKeyNow()); if(hit && hit.id===p.id) return cells[i].id; }
    return null;
  }
  // الإشغال الفعلي في شهر: مخزن له مستأجر بدأ إشغاله ولم ينتهِ في ذلك الشهر
  function occupancyFor(month){
    var cells=allCells(), vacant=[], occ=0;
    cells.forEach(function(c){
      var list=activeByGroup(c.group,month).filter(function(p){ return cellMatches(p,c.id) && !beforeStart(p,month); });
      if(list.length) occ++; else vacant.push(c.id);
    });
    return {total:cells.length, occupied:occ, vacant:vacant, rate:cells.length?occ/cells.length:0};
  }
  // الوضع الأفقي = دوران المخطط 90°، مع إبقاء الأرقام معتدلة
  function rot(r, bh, horiz){
    if(!horiz) return {x:r.x, y:r.y, w:r.w, h:r.h};
    return {x: bh-(r.y+r.h), y: r.x, w: r.h, h: r.w};
  }
  function planBlockSVG(block, month, horiz){
    var b=PLAN[block];
    var bw = horiz ? b.h : b.w, bh = horiz ? b.w : b.h;
    var pad=0.35, out="";
    if(b.corridor){
      var cr=rot(b.corridor, b.h, horiz);
      out+='<rect x="'+cr.x+'" y="'+cr.y+'" width="'+cr.w+'" height="'+cr.h+'" fill="var(--bg-2)" stroke="var(--border)" stroke-width="0.12" stroke-dasharray="0.8 0.7"/>';
    }
    b.cells.forEach(function(c){
      var p=personForCell(c.id, month);
      var st = p ? statusOf(p, payDoc(p.id,month), month) : {key:"vacant", text:t("vacant")};
      var sty = PLAN_STYLE[st.key]||PLAN_STYLE.none;
      var r=rot(c, b.h, horiz);
      var cx=r.x+r.w/2, cy=r.y+r.h/2;
      var rid = p ? (p.id+"__"+month) : "";
      var y0 = sty.show ? cy-0.75 : cy+0.55;
      out+='<g class="plancell" '+(rid?'data-act="planjump" data-rid="'+rid+'"':'')+' style="cursor:'+(rid?"pointer":"default")+'">' +
        '<rect x="'+r.x+'" y="'+r.y+'" width="'+r.w+'" height="'+r.h+'" rx="0.25" fill="'+sty.fill+'" stroke="var(--border)" stroke-width="0.14"/>' +
        '<rect x="'+r.x+'" y="'+r.y+'" width="'+(horiz?r.w:0.3)+'" height="'+(horiz?0.3:r.h)+'" fill="'+sty.edge+'" opacity=".85"/>' +
        '<text x="'+cx+'" y="'+y0+'" text-anchor="middle" font-size="1.7" font-weight="600" fill="'+sty.ink+'" letter-spacing="-0.03">'+c.id+'</text>' +
        (sty.show?'<text x="'+cx+'" y="'+(y0+1.5)+'" text-anchor="middle" font-size="0.95" font-weight="600" fill="'+sty.ink+'">'+st.text+'</text>':'') +
      '</g>';
    });
    return {w:bw, h:bh,
      svg:'<svg viewBox="'+(-pad)+' '+(-pad)+' '+(bw+pad*2)+' '+(bh+pad*2)+'" preserveAspectRatio="xMidYMin meet" style="width:100%;height:auto;overflow:visible">'+out+'</svg>'};
  }
  function renderPlan(month){
    var horiz = state.planDir==="h";
    var ae=planBlockSVG("ae", month, horiz), ote=planBlockSVG("ote", month, horiz);
    var total = horiz ? Math.max(ae.w, ote.w) : (ae.w + PLAN_GAP + ote.w);
    function blockHTML(b, key){
      var d=PLAN[key];
      var pctW = horiz ? (b.w/total*100) : (b.w/total*100);
      return '<div class="planblock" style="flex:0 0 '+pctW.toFixed(2)+'%">' +
        '<div class="plancap"><b>'+t(d.label)+'</b><span>'+t(d.side)+'</span></div>' +
        b.svg + '</div>';
    }
    var row = '<div class="planrow'+(horiz?" h":"")+'">'+blockHTML(ae,"ae")+blockHTML(ote,"ote")+'</div>';
    var legend=["paid","overdue","partial","due","vacant"].map(function(k){
      var sty=PLAN_STYLE[k];
      var lbl = k==="vacant"?t("vacant"):t("st_"+k);
      return '<span class="lg"><i style="background:'+sty.fill+';box-shadow:inset 3px 0 0 '+sty.edge+'"></i>'+lbl+'</span>';
    }).join("");
    return '<div class="card plancard">' +
      '<div class="planhead"><h3>'+t("view_plan")+'</h3><span>'+monthLabel(month)+'</span></div>' +
      '<div class="planwrap">'+row+'</div>' +
      '<div class="planlegend">'+legend+'</div>' +
      '<div class="hint">'+t("plan_hint")+'</div></div>';
  }

  /* ======================= stats ======================= */
  function allStorePeople(){ return peopleList().filter(function(p){ return p.type==="store"&&p.active!==false; }); }
  function allMonthsWithData(){
    var nowKey=monthKeyNow(), set={};
    Object.keys(state.payments).forEach(function(k){ var mk=state.payments[k].month; if(mk<=nowKey) set[mk]=true; });
    set[nowKey]=true;
    return Object.keys(set).sort();
  }
  function statsRangeMonths(){
    var range=state.statsRange||"1";
    if(range==="all") return allMonthsWithData();
    var n = range==="12"?12:(range==="3"?3:(range==="2"?2:1));
    var arr=[], mk=state.month;
    for(var i=0;i<n;i++){ arr.unshift(mk); mk=shiftMonth(mk,-1); }
    // النطاق السنوي لا يمتد إلى ما قبل أول شهر مسجَّل، حتى لا تُحتسب أشهر بلا بيانات كمستحقات غير محصَّلة
    if(range==="12"){
      var first=allMonthsWithData()[0];
      var kept=arr.filter(function(m){ return m>=first; });
      if(kept.length) arr=kept;
    }
    return arr;
  }
  function statsRangeLabel(){
    var range=state.statsRange||"1", months=statsRangeMonths();
    if(range==="all") return t("for_all",{m:monthLabel(monthKeyNow())});
    if(months.length===1) return t("for_month",{m:monthLabel(months[0])});
    return t("for_range",{a:monthLabel(months[0]), b:monthLabel(months[months.length-1])});
  }
  function rangeBtn(val,key){
    return '<button class="segbtn" data-act="statsrange" data-range="'+val+'" aria-selected="'+((state.statsRange||"1")===val?"true":"false")+'">'+t(key)+'</button>';
  }

  // المصروفات المتغيرة: settings.variableExpenses[شهر] = [{id, desc, amount, by: yousef|father|split}]
  // حقل اختياري — غيابه يعني صفرًا، فتبقى أرقام الأشهر التي بلا مصروفات كما هي تمامًا.
  var VE_BY = {yousef:"ve_yousef", father:"ve_father", split:"ve_split"};
  function varExpenses(month){
    var v=state.settings.variableExpenses, a=v && v[month];
    return Array.isArray(a) ? a.filter(function(x){ return x && VE_BY[x.by] && Number(x.amount)>0; }) : [];
  }
  function varShareOf(x, who){ return x.by===who ? Number(x.amount) : (x.by==="split" ? Number(x.amount)/2 : 0); }
  function varShare(month, who){ return varExpenses(month).reduce(function(a,x){ return a+varShareOf(x,who); },0); }
  function varLines(month, who){
    return varExpenses(month).filter(function(x){ return varShareOf(x,who)>0; }).map(function(x){
      return pline(x.by==="split"?t("ve_half",{n:esc(x.desc)}):esc(x.desc), "− "+fmt(varShareOf(x,who)));
    }).join("");
  }
  function yousefMonthShare(month){
    var s=state.settings;
    var aeP=peopleList().filter(function(p){return p.type==="store"&&p.group==="AE"&&p.active!==false;});
    var oteP=peopleList().filter(function(p){return p.type==="store"&&p.group==="ONE_TO_EIGHT"&&p.active!==false;});
    var aeCollected=aeP.reduce(function(a,p){return a+sumPaid(p.id,month);},0);
    var oteCollected=oteP.reduce(function(a,p){return a+sumPaid(p.id,month);},0);
    var aeBilled=aeP.reduce(function(a,p){return a+requiredFor(p,month);},0);
    var oteBilled=oteP.reduce(function(a,p){return a+requiredFor(p,month);},0);
    var aePct=s.storeAEYousefPct!=null?s.storeAEYousefPct:1;
    var otePct=s.store1to8YousefPct!=null?s.store1to8YousefPct:0.5;
    var aeExpense=s.aeYousefExpense!=null?s.aeYousefExpense:5500;
    var oteExpense=s.oteYousefExpense!=null?s.oteYousefExpense:3000;
    var grossAE=aeCollected*aePct, grossOTE=oteCollected*otePct;
    var potGrossAE=aeBilled*aePct, potGrossOTE=oteBilled*otePct;
    var gift = s.motherGiftExpense!=null?s.motherGiftExpense:1500;
    var net  = s.internetExpense!=null?s.internetExpense:250;
    // مصروف يخص شهرًا بعينه (مثل تسوية تُدفع على دفعتين) — يختفي تلقائيًا بعد شهره
    var ex = (s.monthlyExtras && s.monthlyExtras[month]) || {};
    var extra = Number(ex.yousef)||0;
    var extraLabel = ex.label || "";
    var varExp = varShare(month,"yousef");
    return {aeCollected:aeCollected, oteCollected:oteCollected, aeBilled:aeBilled, oteBilled:oteBilled,
      grossAE:grossAE, grossOTE:grossOTE, aeExpense:aeExpense, oteExpense:oteExpense, gift:gift, net:net,
      extra:extra, extraLabel:extraLabel,
      potGrossAE:potGrossAE, potGrossOTE:potGrossOTE, potTaken:potGrossAE+potGrossOTE,
      taken:grossAE+grossOTE,
      varExp:varExp,
      remaining:(grossAE-aeExpense)+(grossOTE-oteExpense)-gift-net-extra-varExp,
      potentialRemaining:(potGrossAE-aeExpense)+(potGrossOTE-oteExpense)-gift-net-extra-varExp};
  }
  function fatherMonthShare(month){
    var s=state.settings, y=yousefMonthShare(month);
    var fatherPct=s.store1to8FatherPct!=null?s.store1to8FatherPct:0.5;
    var fatherExpense=s.fatherOteExpense!=null?s.fatherOteExpense:3000;
    var aeExpense=s.aeFatherExpense!=null?s.aeFatherExpense:500;
    var grossOTE=y.oteCollected*fatherPct;
    var potGrossOTE=y.oteBilled*fatherPct;
    var exF=(s.monthlyExtras && s.monthlyExtras[month]) || {};
    var extra=Number(exF.father)||0;
    var varExp=varShare(month,"father");
    return {oteCollected:y.oteCollected, grossOTE:grossOTE, expense:fatherExpense, aeExpense:aeExpense,
      extra:extra, extraLabel:exF.label||"",
      potGrossOTE:potGrossOTE, potTaken:potGrossOTE,
      varExp:varExp,
      taken:grossOTE, remaining:grossOTE-fatherExpense-aeExpense-extra-varExp,
      potentialRemaining:potGrossOTE-fatherExpense-aeExpense-extra-varExp};
  }
  function progressBar(title,current,target){
    var tg=Math.max(0,target||0), cur=current||0;
    var p = tg>0 ? Math.max(0,Math.min(1,cur/tg)) : (cur>0?1:0);
    return '<div style="margin-top:14px">' +
      '<div style="font-size:11.5px;color:var(--text-muted);font-weight:700">'+title+'</div>' +
      '<div style="height:10px;border-radius:99px;background:var(--neutral-soft);overflow:hidden;margin-top:7px">' +
        '<div style="height:100%;border-radius:99px;background:var(--success);width:'+Math.round(p*100)+'%;transition:width .35s"></div>' +
      '</div>' +
      '<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);margin-top:5px">' +
        '<span>'+pct(p)+' '+t("of_target")+'</span><span>'+t("left_to_target")+': '+fmt(Math.max(0,tg-cur))+'</span>' +
      '</div></div>';
  }
  function pline(k,v){ return '<div class="profitline"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'; }
  function moneyRow(label,key,val){
    return '<div class="frow"><label for="mset-'+key+'">'+label+'</label><input class="pctin" id="mset-'+key+'" data-act="settingmoney" data-key="'+key+'" type="number" min="0" value="'+val+'"></div>';
  }
  function settingsRow(label,key,val){
    return '<div class="frow"><label for="set-'+key+'">'+label+'</label><input class="pctin" style="width:66px" id="set-'+key+'" data-act="setting" data-key="'+key+'" type="number" min="0" max="100" value="'+Math.round(val*100)+'"></div>';
  }

        '<div class="ystat"><div class="ylabel">'+t(fut?"exp_net":"y_left")+'</div><div class="yval">'+fmt(fut?y.potentialRemaining:y.remaining)+'</div></div>' +
      '</div>' +
      (fut?'':progressBar(t("progress_title"), y.remaining, y.potentialRemaining)) +

        pline(t(fut?"expected_x":"collected_x",{x:"A–E"})+" × "+pct(s.storeAEYousefPct!=null?s.storeAEYousefPct:1), fmt(fut?y.potGrossAE:y.grossAE)) +
        pline(t(fut?"expected_x":"collected_x",{x:"1–8"})+" × "+pct(s.store1to8YousefPct!=null?s.store1to8YousefPct:0.5), fmt(fut?y.potGrossOTE:y.grossOTE)) +
        pline(t("y_rent_ae"), "− "+fmt(y.aeExpense)) +
        pline(t("y_rent_ote"), "− "+fmt(y.oteExpense)) +
        pline(t("gift"), "− "+fmt(y.gift)) +

      '</div></details></div>';
  }
  function renderFatherCard(month){
    var f=fatherMonthShare(month), fut=isFutureMonth(month);
    return '<div class="card accented2"><h3 style="color:var(--accent-2)">'+t("f_title")+' — '+monthLabel(month)+(fut?' '+forecastBadge():'')+'</h3>' +
      '<div class="yrow">' +
        '<div class="ystat"><div class="ylabel">'+t(fut?"exp_share":"f_taken")+'</div><div class="yval accent2">'+fmt(fut?f.potTaken:f.taken)+'</div></div>' +
        '<div class="ystat"><div class="ylabel">'+t(fut?"exp_net":"f_left")+'</div><div class="yval">'+fmt(fut?f.potentialRemaining:f.remaining)+'</div></div>' +
      '</div>' +

        pline(t(fut?"expected_x":"collected_x",{x:"1–8"})+" × "+pct(state.settings.store1to8FatherPct!=null?state.settings.store1to8FatherPct:0.5), fmt(fut?f.potGrossOTE:f.grossOTE)) +

  function renderVarExpCard(month){
    var items=varExpenses(month);
    var html='<div class="card" id="vecard"><h3>'+t("ve_title")+' — '+monthLabel(month)+'</h3><div class="hint">'+t("ve_hint")+'</div>';
    if(!items.length) html+='<div class="hint" style="margin-top:8px">'+t("ve_none")+'</div>';
    else{

  /* ======================= tenant statement ======================= */
  // كشف حساب المستأجر: شهرًا بشهر من أول شهر مسجَّل حتى الشهر الحالي (أو شهر نهاية الإشغال)،
  // مع أي دفعات مقدَّمة لأشهر قادمة. المستحق = إيجار الشهر نفسه دون الترحيل حتى لا يُحتسب مرتين.
  function methodLabel(v){ for(var i=0;i<METHODS.length;i++) if(METHODS[i][0]===v) return t(METHODS[i][1]); return v||""; }
  function statementData(p){
    var now=monthKeyNow(), docMonths=[];
    Object.keys(state.payments).forEach(function(k){ var d=state.payments[k]; if(d && d.personId===p.id && /^\d{4}-\d{2}$/.test(String(d.month))) docMonths.push(d.month); });
    docMonths.sort();
    var first=docMonths[0]||null;
    if(p.startMonth && (!first || p.startMonth<first)) first=p.startMonth;
    if(!first) first=now;
    var last=(p.endMonth && p.endMonth<now) ? p.endMonth : now;
    var months=[], mk=first, guard=0;
    while(mk<=last && guard<600){ months.push(mk); mk=shiftMonth(mk,1); guard++; }
    docMonths.forEach(function(m){ if(m>last && months.indexOf(m)<0) months.push(m); });
    var bal=0, tDue=0, tPaid=0;
    var rows=months.map(function(m){
      var doc=payDoc(p.id,m), due=baseRequiredFor(p,m), paid=sumPaid(p.id,m);
      tDue+=due; tPaid+=paid; bal+=due-paid;
      return {month:m, due:due, paid:paid, date:(doc&&doc.paymentDate)||"", method:(doc&&doc.method)||"", balance:bal, advance:m>now};
    });
    return {rows:rows, totalDue:tDue, totalPaid:tPaid, balance:tDue-tPaid};
  }
  function statementText(p){
    var s=statementData(p), rows=s.rows, lines=[];
    lines.push(t("stmt_title",{n:String(p.name||"").trim()})+(p.business?" ("+p.business+")":""));
    lines.push(t("stmt_asof",{d:new Date().toLocaleDateString("en-GB")}));
    if(rows.length>12){
      var cut=rows.length-12;
      lines.push(t("stmt_prev")+": "+fmt(rows[cut-1].balance));
      rows=rows.slice(cut);
    }
    rows.forEach(function(r){ lines.push(t("stmt_line",{m:monthLabel(r.month), a:fmtPlain(r.due), b:fmtPlain(r.paid), c:fmtPlain(r.balance)})); });
    lines.push("");
    lines.push(t("stmt_tdue")+": "+fmt(s.totalDue));
    lines.push(t("stmt_tpaid")+": "+fmt(s.totalPaid));
    lines.push((s.balance<0?t("stmt_credit"):t("stmt_balance"))+": "+fmt(Math.abs(s.balance)));
    return lines.join("\n");
  }

  /* ======================= chart ======================= */
  function drawTrend(){
    var canvas=document.getElementById("trendcanvas");
    if(!canvas) return;
    var months=allMonthsWithData();
    var stores=allStorePeople();
    var data=months.map(function(mk){
      var billed=0,paid=0;
      stores.forEach(function(p){
        billed+=baseRequiredFor(p,mk);
        paid+=sumPaid(p.id,mk);
      });
      return {mk:mk, pct:billed>0?paid/billed:0};
    });
    var barW=34,gap=14,padL=34,padB=30,padT=14;
    var w=Math.max(canvas.parentElement.clientWidth, padL+data.length*(barW+gap)+10);
    var h=150, dpr=window.devicePixelRatio||1;
    canvas.width=w*dpr; canvas.height=h*dpr; canvas.style.width=w+"px"; canvas.style.height=h+"px";
    var ctx=canvas.getContext("2d"); ctx.scale(dpr,dpr);
    var css=getComputedStyle(document.documentElement);
    var border=css.getPropertyValue("--border").trim();
    var muted=css.getPropertyValue("--text-muted").trim();
    var accent=css.getPropertyValue("--accent").trim();
    var text=css.getPropertyValue("--text").trim();
    ctx.clearRect(0,0,w,h);
    var plotH=h-padT-padB;
    [0,0.5,1].forEach(function(v){
      var y=padT+plotH*(1-v);
      ctx.strokeStyle=border; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(padL-6,y); ctx.lineTo(w-4,y); ctx.stroke();
      ctx.fillStyle=muted; ctx.font="10px "+(LANG==="ar"?"IBM Plex Sans Arabic":"Inter")+", sans-serif"; ctx.textAlign="right";
      ctx.fillText(Math.round(v*100)+"%", padL-10, y+3);
    });
    data.forEach(function(d,i){
      var x=padL+i*(barW+gap);
      var bh=plotH*Math.max(0,Math.min(1,d.pct));
      var y=padT+plotH-bh, r=5;
      ctx.fillStyle=accent; ctx.beginPath();
      ctx.moveTo(x,padT+plotH); ctx.lineTo(x,y+r);
      ctx.arcTo(x,y,x+r,y,r); ctx.lineTo(x+barW-r,y);
      ctx.arcTo(x+barW,y,x+barW,y+r,r); ctx.lineTo(x+barW,padT+plotH);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle=text; ctx.font="10px "+(LANG==="ar"?"IBM Plex Sans Arabic":"Inter")+", sans-serif"; ctx.textAlign="center";
      ctx.fillText(Math.round(d.pct*100)+"%", x+barW/2, y-4>padT?y-4:padT+10);
      var lbl=monthLabel(d.mk).split(" ");
      ctx.fillStyle=muted; ctx.font="9.5px "+(LANG==="ar"?"IBM Plex Sans Arabic":"Inter")+", sans-serif";
      ctx.fillText(lbl[0].slice(0,4)+" "+lbl[1].slice(2), x+barW/2, h-padB+14);
    });
  }

      if(el.checked){
        var existing=state.payments[pid+"__"+m];
        var amt = existing&&existing.amountPaid>=billed?existing.amountPaid:billed;
        savePayment(pid,m,{paid:true, amountPaid:amt, paymentDate:(existing&&existing.paymentDate)||todayISO()});
      } else savePayment(pid,m,{paid:false});
    });
    on('[data-act="billed"]',"change",function(el){ savePayment(el.getAttribute("data-pid"),el.getAttribute("data-m"),{billedAmount:Number(el.value)||0}); });
