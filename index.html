<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دفتر الإيجارات</title>
<meta name="theme-color" content="#0E6B57">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دفتر الإيجارات">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<!-- إعدادات Firebase (اختياري) — اتركها فارغة ليعمل الدفتر محليًا على الجهاز -->
<script src="firebase-config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:light dark;
    --bg:#F6F3ED;
    --bg-2:#EFEADF;
    --surface:#FFFFFF;
    --surface-2:#F1ECE1;
    --border:#E3DBCA;
    --border-soft:#EFE9DC;
    --text:#211E18;
    --text-muted:#736B5C;
    --text-faint:#9C9384;
    --accent:#0E6B57;
    --accent-strong:#0A5546;
    --accent-soft:#DFEFE9;
    --accent-2:#B4712B;
    --accent-2-soft:#F6E7D2;
    --success:#1C8A5F;
    --success-soft:#DFF1E7;
    --warning:#B87A11;
    --warning-soft:#FBEDD6;
    --danger:#BC3F34;
    --danger-soft:#F9E3E0;
    --neutral:#8A8272;
    --neutral-soft:#EDE8DC;
    --wa:#25D366;
    --wa-2:#12A85B;
    --tel:#2BB74A;
    --tel-2:#159C36;
    --sms:#2F7CF6;
    --sms-2:#1A5FD0;
    --shadow-sm:0 1px 2px rgba(33,30,24,.05);
    --shadow:0 1px 2px rgba(33,30,24,.05), 0 6px 18px rgba(33,30,24,.06);
    --shadow-lg:0 2px 4px rgba(33,30,24,.06), 0 16px 40px rgba(33,30,24,.10);
    --r-sm:10px; --r:14px; --r-lg:18px; --r-xl:22px;
    --font-ar:"IBM Plex Sans Arabic","Tahoma",sans-serif;
    --font-en:"Inter","IBM Plex Sans Arabic",sans-serif;
    --font-display-ar:"Cairo","IBM Plex Sans Arabic",sans-serif;
    --font-display-en:"Inter","Cairo",sans-serif;
    --font:var(--font-ar);
    --font-display:var(--font-display-ar);
  }
  html[lang="en"]{ --font:var(--font-en); --font-display:var(--font-display-en); }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14120E; --bg-2:#1A1712; --surface:#1E1B15; --surface-2:#272219; --border:#3A3326; --border-soft:#2E2920;
      --text:#F2EDE2; --text-muted:#B3AA94; --text-faint:#8B8371;
      --accent:#42C4A4; --accent-strong:#5AD6B7; --accent-soft:#17352D;
      --accent-2:#E2A45C; --accent-2-soft:#392B16;
      --success:#4CC98A; --success-soft:#1B3828;
      --warning:#E7B15C; --warning-soft:#3A2D15;
      --danger:#E58172; --danger-soft:#3D201B;
      --neutral:#A39D89; --neutral-soft:#282419;
      --shadow-sm:0 1px 2px rgba(0,0,0,.35);
      --shadow:0 1px 2px rgba(0,0,0,.35), 0 6px 20px rgba(0,0,0,.35);
      --shadow-lg:0 2px 6px rgba(0,0,0,.4), 0 18px 44px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14120E; --bg-2:#1A1712; --surface:#1E1B15; --surface-2:#272219; --border:#3A3326; --border-soft:#2E2920;
    --text:#F2EDE2; --text-muted:#B3AA94; --text-faint:#8B8371;
    --accent:#42C4A4; --accent-strong:#5AD6B7; --accent-soft:#17352D;
    --accent-2:#E2A45C; --accent-2-soft:#392B16;
    --success:#4CC98A; --success-soft:#1B3828;
    --warning:#E7B15C; --warning-soft:#3A2D15;
    --danger:#E58172; --danger-soft:#3D201B;
    --neutral:#A39D89; --neutral-soft:#282419;
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:var(--font);font-size:14px;line-height:1.5;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%}
  [hidden]{display:none!important}
  h1,h2,h3{font-family:var(--font-display);font-weight:800;margin:0;text-wrap:balance}
  button{font-family:inherit}
  input,select,textarea{font-family:inherit;color:var(--text)}
  a{color:inherit;text-decoration:none}

  #app{max-width:760px;margin:0 auto;padding:0 16px 56px;font-variant-numeric:tabular-nums}

  /* ---------- header ---------- */
  .hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);padding:12px 0 10px;margin:0 -16px;padding-inline:16px;border-bottom:1px solid var(--border-soft)}
  .hdr-top{display:flex;align-items:center;gap:11px}
  .mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(150deg,var(--accent-strong),var(--accent));display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:800;font-size:17px;flex:none;box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 35%,transparent)}
  .hdr-txt{flex:1;min-width:0}
  .hdr-txt h1{font-size:18px;letter-spacing:-.2px}
  .hdr-txt .sub{font-size:11.5px;color:var(--text-muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lang{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:99px;padding:3px;flex:none}
  .lang button{border:0;background:transparent;color:var(--text-muted);font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:99px;cursor:pointer;line-height:1}
  .lang button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}

  .tabs{display:flex;gap:3px;background:var(--surface-2);border-radius:13px;padding:4px;margin-top:11px}
  .tab{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 6px;border:0;border-radius:10px;background:transparent;color:var(--text-muted);font-size:13px;font-weight:600;cursor:pointer;transition:background .16s,color .16s}
  .tab svg{width:15px;height:15px;opacity:.85}
  .tab[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}

  /* ---------- month bar ---------- */
  .monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:6px;box-shadow:var(--shadow-sm)}
  .monthbar .nav{background:var(--surface-2);border:0;border-radius:10px;width:36px;height:36px;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .monthbar .nav:active{background:var(--border)}
  .monthbar .nav svg{width:16px;height:16px}
  .monthlabel{text-align:center;flex:1}
  .monthlabel .m{font-family:var(--font-display);font-weight:800;font-size:16px}
  .monthlabel .today-btn{display:block;font-family:var(--font);font-weight:600;font-size:11px;color:var(--accent);margin-top:1px;cursor:pointer;background:none;border:0;padding:0}

  /* ---------- kpis ---------- */
  .kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 13px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
  .kpi .label{font-size:11.5px;color:var(--text-muted);font-weight:600}
  .kpi .value{font-family:var(--font-display);font-weight:800;font-size:20px;margin-top:3px;letter-spacing:-.3px}
  .kpi .value.accent{color:var(--accent)}
  .kpi .value.warn{color:var(--warning)}
  .kpi .value.danger{color:var(--danger)}
  .kpi .value.ok{color:var(--success)}
  .kpi .meter{height:4px;border-radius:99px;background:var(--neutral-soft);margin-top:8px;overflow:hidden}
  .kpi .meter > i{display:block;height:100%;border-radius:99px;background:var(--accent)}

  /* ---------- cards ---------- */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow-sm);margin-top:14px}
  .card > h3{font-size:14.5px;letter-spacing:-.2px;display:flex;align-items:center;gap:7px}
  .card .hint{font-size:12px;color:var(--text-muted);margin-top:4px;line-height:1.6}
  .card.accented{border-color:color-mix(in srgb,var(--accent) 45%,var(--border));background:linear-gradient(170deg,var(--accent-soft),var(--surface) 62%)}
  .card.accented2{border-color:color-mix(in srgb,var(--accent-2) 45%,var(--border));background:linear-gradient(170deg,var(--accent-2-soft),var(--surface) 62%)}
  .card.okcard{border-color:color-mix(in srgb,var(--success) 45%,var(--border));background:linear-gradient(170deg,var(--success-soft),var(--surface) 70%)}

  .section-title{margin-top:20px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .section-title h2{font-size:12.5px;color:var(--text-muted);letter-spacing:.3px;text-transform:uppercase;font-weight:700}
  .section-title .count{font-size:11.5px;color:var(--text-faint);background:var(--surface-2);border-radius:99px;padding:3px 9px;font-weight:600}

  /* ---------- follow up ---------- */
  .fu-list{display:flex;flex-direction:column;gap:8px;margin-top:11px}
  .fu-item{display:flex;align-items:center;gap:10px;background:var(--bg-2);border:1px solid var(--border-soft);border-radius:var(--r);padding:9px 10px}
  .fu-main{flex:1;min-width:0;cursor:pointer}
  .fu-name{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fu-meta{font-size:11.5px;color:var(--text-muted);margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .fu-amt{font-family:var(--font-display);font-weight:800;font-size:13px;color:var(--danger);white-space:nowrap}

  /* ---------- app-style contact buttons ---------- */
  .apps{display:inline-flex;gap:7px;flex:none}
  .appbtn{width:38px;height:38px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;color:#fff;flex:none;border:0;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.16), inset 0 1px 0 rgba(255,255,255,.22);transition:transform .12s,filter .12s;-webkit-tap-highlight-color:transparent}
  .appbtn:active{transform:scale(.93);filter:brightness(.94)}
  .appbtn svg{width:20px;height:20px;display:block}
  .appbtn.wa{background:linear-gradient(160deg,#4AE07F,var(--wa-2))}
  .appbtn.tel{background:linear-gradient(160deg,#5BE07A,var(--tel-2))}
  .appbtn.sms{background:linear-gradient(160deg,#5C9BFA,var(--sms-2))}
  .appbtn.copy{background:linear-gradient(160deg,var(--neutral),#6E6858)}

  .appbar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
  .appwide{display:flex;align-items:center;justify-content:center;gap:7px;height:42px;border-radius:12px;color:#fff;font-size:13px;font-weight:700;border:0;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.14), inset 0 1px 0 rgba(255,255,255,.2);-webkit-tap-highlight-color:transparent}
  .appwide:active{transform:scale(.985);filter:brightness(.95)}
  .appwide svg{width:18px;height:18px;flex:none}
  .appwide.wa{background:linear-gradient(160deg,#4AE07F,var(--wa-2))}
  .appwide.tel{background:linear-gradient(160deg,#5BE07A,var(--tel-2))}
  .appwide.sms{background:linear-gradient(160deg,#5C9BFA,var(--sms-2))}

  /* ---------- tenant rows ---------- */
  .rowlist{display:flex;flex-direction:column;gap:8px}
  details.prow{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-sm);transition:border-color .15s,box-shadow .15s}
  details.prow[open]{border-color:color-mix(in srgb,var(--accent) 50%,var(--border));box-shadow:var(--shadow)}
  details.prow summary{list-style:none;cursor:pointer;padding:11px 12px;display:flex;align-items:center;gap:10px}
  details.prow summary::-webkit-details-marker{display:none}
  .avatar{width:38px;height:38px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border-soft);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:14px;color:var(--text-muted);flex:none}
  .avatar.paid{background:var(--success-soft);color:var(--success);border-color:transparent}
  .avatar.overdue{background:var(--danger-soft);color:var(--danger);border-color:transparent}
  .avatar.partial{background:var(--warning-soft);color:var(--warning);border-color:transparent}
  .prow .pinfo{flex:1;min-width:0}
  .prow .pname{font-weight:700;font-size:14px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .prow .pbiz{font-size:11.5px;color:var(--text-muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prow .pright{text-align:end;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
  .prow .pamt{font-family:var(--font-display);font-weight:800;font-size:13.5px;white-space:nowrap}
  .prow .pamt small{font-weight:600;color:var(--text-faint);font-size:11px}
  .prow .chev{color:var(--text-faint);flex:none;transition:transform .18s}
  .prow .chev svg{width:15px;height:15px;display:block}
  details.prow[open] .chev{transform:rotate(90deg)}
  html[dir="rtl"] .prow .chev{transform:rotate(180deg)}
  html[dir="rtl"] details.prow[open] .chev{transform:rotate(90deg)}

  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
  .pill::before{content:"";width:6px;height:6px;border-radius:99px;background:currentColor;flex:none}
  .pill.paid{background:var(--success-soft);color:var(--success)}
  .pill.partial{background:var(--warning-soft);color:var(--warning)}
  .pill.overdue{background:var(--danger-soft);color:var(--danger)}
  .pill.due{background:var(--neutral-soft);color:var(--neutral)}
  .pill.none{background:var(--neutral-soft);color:var(--text-muted)}

  .badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--neutral-soft);color:var(--text-muted)}
  .badge.soon{background:var(--warning-soft);color:var(--warning)}
  .badge.duenow{background:var(--danger-soft);color:var(--danger)}
  .badge.ok{background:var(--success-soft);color:var(--success)}

  .peditor{padding:2px 12px 14px;border-top:1px solid var(--border-soft);display:flex;flex-direction:column;gap:11px}
  .switchrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;margin-top:10px;background:var(--surface-2);border-radius:var(--r);}
  .switchrow .lbl{font-size:13.5px;font-weight:700}
  .switch{position:relative;width:46px;height:28px;flex:none}
  .switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:2}
  .switch .track{position:absolute;inset:0;background:var(--neutral-soft);border:1px solid var(--border);border-radius:99px;transition:background .18s,border-color .18s}
  .switch input:checked + .track{background:var(--success);border-color:transparent}
  .switch .knob{position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:99px;background:#fff;transition:inset-inline-start .18s;box-shadow:0 1px 4px rgba(0,0,0,.28)}
  .switch input:checked ~ .knob{inset-inline-start:21px}

  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .field{display:flex;flex-direction:column;gap:5px}
  .field.full{grid-column:1/-1}
  .field label{font-size:11px;color:var(--text-muted);font-weight:700}
  .field input,.field select,.field textarea{border:1px solid var(--border);border-radius:10px;padding:9px 10px;font-size:13.5px;background:var(--bg-2);width:100%}
  .field textarea{resize:vertical;min-height:40px}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;background:var(--surface)}

  .noteflag{font-size:11.5px;color:var(--accent-2);background:var(--accent-2-soft);border-radius:10px;padding:8px 10px;line-height:1.6}
  .searchbar{margin-top:12px;position:relative}
  .searchbar input{width:100%;border:1px solid var(--border);border-radius:12px;padding:11px 38px 11px 14px;font-size:13.5px;background:var(--surface)}
  html[dir="ltr"] .searchbar input{padding:11px 14px 11px 38px}
  .searchbar .si{position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);color:var(--text-faint);pointer-events:none}
  .searchbar .si svg{width:16px;height:16px;display:block}

  /* ---------- buttons ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:#fff;border:0;border-radius:11px;padding:10px 16px;font-size:13.5px;font-weight:700;cursor:pointer}
  .btn:active{filter:brightness(.94)}
  .btn.ghost{background:transparent;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 50%,var(--border))}
  .btn.sm{padding:7px 12px;font-size:12.5px;border-radius:9px}
  .btn.block{width:100%}
  .btn.danger{background:var(--danger)}
  .btn.ghostdanger{background:transparent;color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 45%,var(--border))}

  .segrow{display:flex;gap:3px;background:var(--surface-2);border-radius:12px;padding:4px;margin-top:10px}
  .segbtn{flex:1;text-align:center;padding:8px 5px;border:0;border-radius:9px;background:transparent;color:var(--text-muted);font-size:12px;font-weight:600;cursor:pointer}
  .segbtn[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}

  /* ---------- stats ---------- */
  .yrow{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
  .ystat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:11px 12px}
  .ylabel{font-size:11px;color:var(--text-muted);font-weight:700}
  .yval{font-family:var(--font-display);font-weight:800;font-size:19px;margin-top:3px;letter-spacing:-.3px}
  .yval.accent{color:var(--accent)}
  .yval.accent2{color:var(--accent-2)}

  table.stats{width:100%;border-collapse:collapse;font-size:12.5px}
  table.stats th{font-size:10.5px;color:var(--text-muted);text-align:start;font-weight:700;padding:7px 6px;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.3px}
  table.stats td{padding:9px 6px;border-bottom:1px solid var(--border-soft);white-space:nowrap}
  table.stats tr:last-child td{border-bottom:0}
  .scrollx{overflow-x:auto;margin:10px -16px 0;padding:0 16px}
  .scrollx table{min-width:540px}
  .bar-mini{height:6px;border-radius:99px;background:var(--neutral-soft);overflow:hidden;width:58px;flex:none}
  .bar-mini > i{display:block;height:100%;background:var(--accent);border-radius:99px}

  .trendwrap{overflow-x:auto;margin-top:12px}
  .trendwrap canvas{display:block}

  .methodrow{display:flex;align-items:center;gap:10px;padding:7px 0}
  .methodrow .mlabel{width:72px;font-size:12.5px;font-weight:600;flex:none}
  .methodrow .mbar{flex:1;height:8px;border-radius:99px;background:var(--neutral-soft);overflow:hidden}
  .methodrow .mbar > i{display:block;height:100%;border-radius:99px;background:var(--accent-2)}
  .methodrow .mcount{font-size:12px;color:var(--text-muted);width:34px;text-align:end}

  .profitline{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--border);font-size:12.5px}
  .profitline:last-of-type{border-bottom:0}
  .profitline .k{color:var(--text-muted)}
  .profitline .v{font-weight:700;font-family:var(--font-display);white-space:nowrap}
  .profittotal{margin-top:8px;padding-top:10px;border-top:2px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:10px}
  .profittotal .k{font-weight:700;font-size:13px}
  .profittotal .v{font-family:var(--font-display);font-weight:800;font-size:17px;color:var(--accent);white-space:nowrap}

  .settingsform{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .settingsform .frow{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .settingsform .frow label{font-size:12.5px;flex:1;color:var(--text-muted)}
  .settingsform .frow .pctin{width:86px;border:1px solid var(--border);border-radius:9px;padding:7px 9px;font-size:13px;text-align:center;background:var(--bg-2)}

  details.disclose > summary::-webkit-details-marker{display:none}
  details.disclose > summary::after{content:"▾";font-size:10px;transition:transform .15s}
  details.disclose[open] > summary::after{transform:rotate(180deg)}

  .personrow{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:13px;box-shadow:var(--shadow-sm)}

  .togglechip.on{background:var(--success-soft);color:var(--success);border-color:transparent}

  .empty{color:var(--text-muted);font-size:13px;text-align:center;padding:22px 10px;background:var(--surface);border:1px dashed var(--border);border-radius:var(--r)}
  .banner{background:var(--accent-soft);border:1px solid var(--accent);color:var(--accent-strong);border-radius:var(--r-lg);padding:15px;font-size:13px;line-height:1.7;margin-top:16px}

  .adweb{display:block;text-align:center;font-size:11.5px;color:var(--text-muted);margin-top:6px;text-decoration:underline}
  .plancard{padding:14px 14px 13px}
  .planhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .planhead h3{font-size:14px}
  .planhead span{font-size:11.5px;color:var(--text-faint)}
  .planwrap{margin-top:13px;background:var(--bg-2);border:1px solid var(--border-soft);border-radius:var(--r);padding:12px 12px 14px}
  .planrow{display:flex;align-items:flex-start;justify-content:center;gap:5%;direction:ltr}
  .planrow.h{flex-direction:column;align-items:center;gap:18px}
  .planblock{min-width:0}
  .planrow.h .planblock{width:100%}
  .plancap{display:flex;align-items:baseline;gap:6px;margin-bottom:6px;direction:rtl;justify-content:center}
  html[dir="ltr"] .plancap{direction:ltr}
  .plancap b{font-size:11px;font-weight:700;color:var(--text-muted)}
  .plancap span{font-size:10px;color:var(--text-faint)}
  .planwrap svg{display:block;font-family:var(--font)}
  .plancell rect:first-of-type{transition:fill .15s}
  .plancell:active rect:first-of-type{fill:var(--surface-2)}
  .planlegend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:12px}
  .planlegend .lg{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--text-muted);font-weight:500}
  .planlegend .lg i{width:12px;height:14px;border-radius:2px;border:1px solid var(--border);display:inline-block}

  .toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(14px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;z-index:60;max-width:88vw;text-align:center;box-shadow:var(--shadow-lg)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .footspace{height:24px}
</style>

  // المستأجر الجديد: لا يُحتسب عليه إيجار ولا متأخرات قبل شهر إضافته (startMonth)
  function beforeStart(person,month){
    return !!(person && person.startMonth && month < person.startMonth && !payDoc(person.id,month));
  }
  function requiredFor(person,month){
    if(beforeStart(person,month)) return 0;
    var doc=payDoc(person.id,month);
    var base = doc && doc.billedAmount!=null ? doc.billedAmount : (person.rent||0);
    return base + carryoverFor(person,month);
  }
  // إيجار الشهر نفسه دون الرصيد المُرحَّل — يُستخدم في التقارير متعددة الأشهر
  // حتى لا يُحتسب المتأخر مرتين (مرة في شهره ومرة في الشهر التالي)
  function baseRequiredFor(person,month){
    if(beforeStart(person,month)) return 0;
    var doc=payDoc(person.id,month);
    return doc && doc.billedAmount!=null ? doc.billedAmount : (person.rent||0);
  }
  function carryoverFor(person,month){
    if(month<=ARREARS_START_MONTH) return 0;
    var prev=shiftMonth(month,-1);
    if(prev<ARREARS_START_MONTH) return 0;
    if(person.startMonth && prev<person.startMonth) return 0;
    return outstandingFor(person,prev);
  }
  function outstandingFor(person,month){
    var doc=payDoc(person.id,month);
    if(doc && doc.paid) return 0;
    return Math.max(0, requiredFor(person,month)-sumPaid(person.id,month));
  }
  function statusOf(person,doc,month){
    if(!doc) return {key:"none", text:t("st_none")};
    var billed=requiredFor(person,month);
    var paid = doc.paid===true || (doc.paid!==false && (doc.amountPaid||0)>=billed && billed>0);
    if(paid) return {key:"paid", text:t("st_paid")};
    if((doc.amountPaid||0)>0) return {key:"partial", text:t("st_partial")};
    var isPast = month < monthKeyNow();
    var isCurrentPastDue = false;
    if(month===monthKeyNow() && person.dueDay){ isCurrentPastDue = new Date().getDate() > person.dueDay; }
    if(isPast||isCurrentPastDue) return {key:"overdue", text:t("st_overdue")};
    return {key:"due", text:t("st_due")};
  }
  function renewalInfo(person){
    if(!person.contractStart||!person.contractTerm||person.contractTerm==="month") return null;
    var months=TERM_MONTHS[person.contractTerm];
    if(!months) return null;
    var start=new Date(person.contractStart+"T00:00:00");
    if(isNaN(start.getTime())) return null;
    var now=new Date(), renewal=new Date(start.getTime()), guard=0;
    while(renewal.getTime()<=now.getTime() && guard<600){ renewal.setMonth(renewal.getMonth()+months); guard++; }
    // عقد انتهى خلال آخر 60 يومًا ولم يُحدَّث تاريخه: يبقى التنبيه «تجاوز موعد التجديد» بدل القفز للدورة التالية
    if(guard>1){
      var prevEnd=new Date(renewal.getTime()); prevEnd.setMonth(prevEnd.getMonth()-months);
      if(now.getTime()-prevEnd.getTime() <= 60*86400000) renewal=prevEnd;
    }
    var daysLeft=Math.round((renewal.getTime()-now.getTime())/86400000);
    // موعد المتابعة = قبل نهاية العقد بشهر، ليتاح وقت للتفاوض والتحصيل
    var action=new Date(renewal.getTime()); action.setMonth(action.getMonth()-1);
    var actionDaysLeft=Math.round((action.getTime()-now.getTime())/86400000);
    return {renewalDate:renewal, daysLeft:daysLeft,
            actionDate:action, actionDaysLeft:actionDaysLeft,
            dueSoon:actionDaysLeft<=0};
  }

  // طبقة تخزين بنفس واجهة Firestore: collection().onSnapshot / doc().set
  // — محليًا (localStorage) افتراضيًا، أو Firebase إذا تم ملء firebase-config.js
  var LOCAL_KEY = "rentbook_data";
  function LocalDB(){
    var data = {people:{}, payments:{}, meta:{}}, subs = {};
    function load(){
      try{ var raw = localStorage.getItem(LOCAL_KEY); if(raw){ var d = JSON.parse(raw); data = {people:d.people||{}, payments:d.payments||{}, meta:d.meta||{}}; } }catch(e){}
    }
    function clone(v){ return JSON.parse(JSON.stringify(v)); }
    function emit(col){ (subs[col]||[]).forEach(function(f){ f(); }); }
    function persist(){ localStorage.setItem(LOCAL_KEY, JSON.stringify(data)); }
    function listen(col, fn){
      (subs[col] = subs[col]||[]).push(fn); fn();
      return function(){ subs[col] = subs[col].filter(function(x){ return x!==fn; }); };
    }
    function docRef(col, id){
      return {
        set:function(v){
          var c = data[col] = data[col]||{}, before = c[id];
          c[id] = clone(v);
          try{ persist(); }catch(e){ if(before===undefined) delete c[id]; else c[id]=before; return Promise.reject(e); }
          emit(col); return Promise.resolve();
        },
        onSnapshot:function(cb){
          return listen(col, function(){ var c = data[col]||{}; cb({exists: c.hasOwnProperty(id), data:function(){ return clone(c[id]); }}); });
        }
      };
    }
    load();
    // مزامنة بين التبويبات المفتوحة على نفس الجهاز
    window.addEventListener("storage", function(e){ if(e.key===LOCAL_KEY){ load(); Object.keys(subs).forEach(emit); } });
    return {
      collection:function(col){
        return {
          doc:function(id){ return docRef(col, id); },
          onSnapshot:function(cb){
            return listen(col, function(){ var c = data[col]||{}; cb({docs:Object.keys(c).map(function(id){ return {id:id, data:function(){ return clone(c[id]); }}; })}); });
          }
        };
      },
      doc:function(path){ var p = path.split("/"); return docRef(p[0], p[1]); },
      importAll:function(d){
        Object.keys(d.people||{}).forEach(function(id){ data.people[id] = clone(d.people[id]); });
        Object.keys(d.payments||{}).forEach(function(id){ data.payments[id] = clone(d.payments[id]); });
        if(d.settings) data.meta.settings = clone(d.settings);
        persist(); ["people","payments","meta"].forEach(emit);
        return Promise.resolve();
      }
    };
  }

  var FIREBASE_VER = "10.12.2";
  function loadScript(src){
    return new Promise(function(res, rej){

    });

  var unsubs = [];
  function subscribe(){
    unsubs.forEach(function(u){ try{ u(); }catch(e){} }); unsubs = [];

      if(e && e.code==="permission-denied"){ state.people={}; state.payments={}; render(); toast(t("perm_denied")); }
    }
    function fresh(key, snap){ state.fresh[key] = !(snap.metadata && snap.metadata.fromCache); maybeBootSheetSync(); }
    unsubs.push(db.collection("people").onSnapshot(function(snap){
      var m={}; snap.docs.forEach(function(d){ m[d.id]=d.data(); });
      state.people=m; render(); fresh("people", snap);
    }, onErr));
    unsubs.push(db.collection("payments").onSnapshot(function(snap){
      var m={}; snap.docs.forEach(function(d){ m[d.id]=d.data(); });
      state.payments=m; render(); fresh("payments", snap);
    }, onErr));
    unsubs.push(db.doc("meta/settings").onSnapshot(function(snap){
      if(snap.exists){ state.settings=Object.assign({},state.settings,snap.data()); render(); }
      fresh("settings", snap);

      await loadScript(base+"firebase-app-compat.js");
      await Promise.all([loadScript(base+"firebase-auth-compat.js"), loadScript(base+"firebase-firestore-compat.js")]);
      firebase.initializeApp(cfg);
    }catch(e){ state.dbMissing=true; render(); return; }
    var fs = firebase.firestore();
    // للمطوّرين: الاتصال بمحاكي Firebase المحلي بدل السحابة، مثال: emulatorHost:"localhost"
    if(cfg.emulatorHost){
      firebase.auth().useEmulator("http://"+cfg.emulatorHost+":9099");
      fs.useEmulator(cfg.emulatorHost, 8080);
    }
    // يعمل بدون إنترنت ويزامن عند عودة الاتصال
    try{ await fs.enablePersistence({synchronizeTabs:true}); }catch(e){}
    firebase.auth().onAuthStateChanged(function(user){
      state.user = user || null;
      if(!user){
        unsubs.forEach(function(u){ try{ u(); }catch(e){} }); unsubs = [];
        db = null; state.dbReady = false; state.needLogin = true;
        state.people = {}; state.payments = {};
        render(); return;
      }
      state.needLogin = false; db = fs; subscribe(); render();
    });

  function downloadBlob(blob, filename){

    a.href = URL.createObjectURL(blob); a.download = filename;

    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
  }
  function exportBackup(){

      people:state.people, payments:state.payments, settings:Object.assign({},state.settings,{gsheet:undefined})};

  // تنظيف ملف النسخة قبل الاستعادة: معرّفات آمنة فقط، أرقام وتواريخ بصيغتها، ولا يُستعاد رابط/كلمة سر Google Sheets
  function isPlainObj(o){ return !!o && typeof o==="object" && !Array.isArray(o); }
  function cleanBackup(d){
    if(!isPlainObj(d) || !isPlainObj(d.people) || !isPlainObj(d.payments)) return null;
    var num=function(v){ if(v==null||v==="") return null; var n=Number(v); return isFinite(n)?n:null; };
    var dat=function(v){ return (typeof v==="string" && /^\d{4}-\d{2}-\d{2}([T ][\d:.]+(Z|[+-]\d{2}:?\d{2})?)?$/.test(v)) ? v : null; };
    var out={people:{}, payments:{}, settings:null};
    Object.keys(d.people).forEach(function(id){
      var p=d.people[id];
      if(!/^[\w-]{1,80}$/.test(id) || !isPlainObj(p)) return;
      p=Object.assign({},p);
      ["rent","dueDay","depositAmount","order"].forEach(function(k){ if(k in p) p[k]=num(p[k]); });
      ["contractStart","trashedAt"].forEach(function(k){ if(k in p) p[k]=dat(p[k]); });
      if("startMonth" in p && !/^\d{4}-\d{2}$/.test(String(p.startMonth))) delete p.startMonth;
      out.people[id]=p;
    });
    Object.keys(d.payments).forEach(function(id){
      var y=d.payments[id];
      if(!/^[\w-]{1,80}__\d{4}-\d{2}$/.test(id) || !isPlainObj(y)) return;
      y=Object.assign({},y);
      ["billedAmount","amountPaid"].forEach(function(k){ if(k in y) y[k]=num(y[k]); });
      ["paymentDate","dueDate"].forEach(function(k){ if(k in y) y[k]=dat(y[k]); });
      out.payments[id]=y;
    });
    if(isPlainObj(d.settings)){
      var st=Object.assign({},d.settings);
      delete st.gsheet;
      Object.keys(st).forEach(function(k){ if(typeof st[k]==="string" && !/^[\p{L}\p{N} ._-]{0,24}$/u.test(st[k])) st[k]=num(st[k]); });
      if(state.settings && state.settings.gsheet) st.gsheet=state.settings.gsheet;
      out.settings=st;
    }
    return out;
  }
  function isSheetScriptUrl(u){ return typeof u==="string" && /^https:\/\/script\.google(usercontent)?\.com\//.test(u); }
  async function importBackup(file){
    var d;
    try{ d = cleanBackup(JSON.parse(await file.text())); }catch(e){ toast(t("restore_bad")); return; }
    if(!d){ toast(t("restore_bad")); return; }
    if(!confirm(t("restore_confirm", {p:Object.keys(d.people).length, y:Object.keys(d.payments).length}))) return;
    try{
      if(db.importAll) await db.importAll(d);
      else{
        // Firestore: دفعات من 400 عملية كحد أقصى
        var writes = [];
        Object.keys(d.people).forEach(function(id){ writes.push([db.collection("people").doc(id), d.people[id]]); });
        Object.keys(d.payments).forEach(function(id){ writes.push([db.collection("payments").doc(id), d.payments[id]]); });
        if(d.settings) writes.push([db.doc("meta/settings"), d.settings]);
        for(var i=0; i<writes.length; i+=400){
          var b = db.batch();
          writes.slice(i, i+400).forEach(function(w){ b.set(w[0], w[1]); });
          await b.commit();
        }
      }
      toast(t("restore_ok")); scheduleSheetSync();
    }catch(e){ toast(t("save_fail")); }
  }

      paid:false, amountPaid:0, dueDate:null, paymentDate:null, method:null, notes:null,
      business:person.business||null

    state.payments[docId]=merged; render(); scheduleSheetSync();
    if(!db) return;
    try{ await db.collection("payments").doc(docId).set(merged); toast(t("saved")); }
    catch(e){ toast(t("save_fail")); }

  function render(){
    document.querySelectorAll(".tab").forEach(function(btn){
      btn.setAttribute("aria-selected", btn.getAttribute("data-tab")===state.tab?"true":"false");

    var c=document.getElementById("content");
    if(state.dbMissing){ c.innerHTML='<div class="banner">'+t("db_missing")+'</div>'; return; }

  function renderFollowupCard(month){
    var all=activeByGroup("AE").concat(activeByGroup("ONE_TO_EIGHT"));
    var items=all.map(function(p){
      var doc=payDoc(p.id,month);
      var st=statusOf(p,doc,month);
      var req=requiredFor(p,month);
      var paidAmt=doc?(doc.amountPaid||0):0;
      return {p:p, st:st, remaining:Math.max(0,req-paidAmt)};
    }).filter(function(it){ return it.st.key!=="paid"; });

    if(items.length===0){
      return '<div class="card okcard"><h3 style="color:var(--success)"><span style="width:18px;height:18px;display:inline-flex;color:var(--success)">'+ICON.check+'</span>'+t("all_paid")+'</h3></div>';
    }
    var order={overdue:0,due:1,partial:2,none:3};
    items.sort(function(a,b){ return (order[a.st.key]!=null?order[a.st.key]:9)-(order[b.st.key]!=null?order[b.st.key]:9) || b.remaining-a.remaining; });

    var html='<div class="card accented"><h3 style="color:var(--accent)">'+t("fu_title")+' ('+items.length+')</h3>' +
      '<div class="hint">'+t("fu_hint")+'</div><div class="fu-list">';

        '<div class="fu-main" data-act="jumpto" data-rid="'+it.p.id+'__'+month+'">' +
          '<div class="fu-name">'+esc(it.p.name)+'</div>' +
          '<div class="fu-meta"><span class="pill '+it.st.key+'">'+it.st.text+'</span><span class="fu-amt">'+fmt(it.remaining)+'</span></div>' +
        '</div>' + appBtns(it.p, month) +

  function renderPayRow(p,month){
    var doc=payDoc(p.id,month);
    var baseBilled = doc && doc.billedAmount!=null ? doc.billedAmount : (p.rent||0);
    var carry=carryoverFor(p,month);
    var totalRequired=baseBilled+carry;
    var st=statusOf(p,doc,month);
    var rid=p.id+"__"+month;
    var open = state.openRow===rid ? " open" : "";
    var amountPaid = doc?(doc.amountPaid||0):"";
    var paymentDate = doc&&doc.paymentDate?doc.paymentDate:"";
    var method = doc&&doc.method?doc.method:"";
    var notes = doc&&doc.notes?doc.notes:"";
    var paidChecked = !!(doc && (doc.paid===true || (doc.paid!==false && (doc.amountPaid||0)>=totalRequired && totalRequired>0)));

    var methodOpts='<option value="">—</option>'+METHODS.map(function(m){
      return '<option value="'+m[0]+'"'+(method===m[0]?" selected":"")+'>'+t(m[1])+'</option>';
    }).join("");

    // شارة الضمان انتقلت لصفحة المستأجرين — هون بنخلي الصف هادي، بس تنبيه التجديد لما يقرب
    var badges="";
    var r=renewalInfo(p);
    if(r&&r.dueSoon) badges+='<span class="badge '+(r.daysLeft<0?"duenow":"soon")+'">'+t("b_renewal")+'</span>';

    var carryLine = carry>0 ? '<div class="noteflag">'+t("carry_line",{c:fmt(carry), t:fmt(totalRequired)})+'</div>' : "";
    var avCls = st.key==="paid"?"paid":(st.key==="overdue"?"overdue":(st.key==="partial"?"partial":""));

    return '<details class="prow" data-rid="'+rid+'"'+open+'>' +
      '<summary>' +
        '<div class="avatar '+avCls+'">'+esc(initials(p.name))+'</div>' +
        '<div class="pinfo">' +
          '<div class="pname">'+esc(p.name)+badges+'</div>' +
          (p.business?'<div class="pbiz">'+esc(p.business)+'</div>':'') +
        '</div>' +
        '<div class="pright">' +
          '<span class="pill '+st.key+'">'+st.text+'</span>' +
          '<span class="pamt">'+fmt(amountPaid||0)+' <small>'+t("of")+' '+fmt(totalRequired)+'</small></span>' +
        '</div>' +
        '<span class="chev">'+ICON.chevR+'</span>' +
      '</summary>' +
      '<div class="peditor">' +
        (carryLine?'<div style="margin-top:10px">'+carryLine+'</div>':'') +
        '<div class="switchrow">' +
          '<span class="lbl">'+t("paid_q")+'</span>' +
          '<label class="switch">' +
            '<input type="checkbox" data-act="togglepaid" data-pid="'+p.id+'" data-m="'+month+'" data-billed="'+totalRequired+'" '+(paidChecked?"checked":"")+'>' +

  /* ======================= warehouse floor plan ======================= */
  // ---------- مخطط الموقع ----------
  // قياسات يوسف الفعلية (متر): A ‎5×8‎ · B,C,D ‎6×8.2‎ · E ‎10×4‎
  // 1–6 ‎5.5×9‎ · 7,8 ‎6.5×12.5‎ — الوحدات مرسومة بمقياس رسم واحد للهنجرين
  var PLAN = {
    ae:{ w:10, h:37.4, side:"west", label:"blk_ae", dims:"A–E",
      cells:[
        {id:"E", x:0,   y:0,    w:10,  h:4},
        {id:"D", x:0,   y:4.2,  w:6,   h:8.2},
        {id:"C", x:0,   y:12.6, w:6,   h:8.2},
        {id:"B", x:0,   y:21,   w:6,   h:8.2},
        {id:"A", x:0,   y:29.4, w:5,   h:8}
      ]},
    ote:{ w:14.5, h:40.1, side:"east", label:"blk_ote", dims:"1–8",
      corridor:{x:5.5, y:12.7, w:3.5, h:27.4},
      cells:[
        {id:"8", x:0,    y:0,   w:7.25, h:12.5},
        {id:"7", x:7.25, y:0,   w:7.25, h:12.5},
        {id:"6", x:0,   y:12.7, w:5.5, h:9},
        {id:"5", x:9,   y:12.7, w:5.5, h:9},
        {id:"4", x:0,   y:21.9, w:5.5, h:9},
        {id:"3", x:9,   y:21.9, w:5.5, h:9},
        {id:"2", x:0,   y:31.1, w:5.5, h:9},
        {id:"1", x:9,   y:31.1, w:5.5, h:9}
      ]}
  };
  var PLAN_GAP = 2;  // فراغ بين الهنجرين على الرسمة

  // هادي بالأصل: ورق أبيض وحدود رفيعة. اللون الواضح محجوز للمتأخر فقط.
  var PLAN_STYLE = {
    paid:   {fill:"var(--surface)",      edge:"var(--success)", ink:"var(--text)",   show:false},
    due:    {fill:"var(--surface)",      edge:"var(--neutral)", ink:"var(--text)",   show:false},
    none:   {fill:"var(--surface)",      edge:"var(--neutral)", ink:"var(--text)",   show:false},
    partial:{fill:"var(--warning-soft)", edge:"var(--warning)", ink:"var(--warning)",show:true},
    overdue:{fill:"var(--danger-soft)",  edge:"var(--danger)",  ink:"var(--danger)", show:true},
    vacant: {fill:"var(--surface-2)",    edge:"var(--border)",  ink:"var(--text-faint)",show:true}
  };
  function planTokens(name){
    var core=String(name||"").replace(/store|stores|مخزن|مخازن/ig," ");
    return (core.match(/\d+|[A-Za-z]/g)||[]).map(function(x){ return x.toUpperCase(); });
  }
  function personForCell(cellId){
    var list=activeByGroup("AE").concat(activeByGroup("ONE_TO_EIGHT"));
    for(var i=0;i<list.length;i++){
      if(planTokens(list[i].name).indexOf(cellId.toUpperCase())>=0) return list[i];
    }
    return null;
  }
  // الوضع الأفقي = دوران المخطط 90°، مع إبقاء الأرقام معتدلة
  function rot(r, bh, horiz){
    if(!horiz) return {x:r.x, y:r.y, w:r.w, h:r.h};
    return {x: bh-(r.y+r.h), y: r.x, w: r.h, h: r.w};
  }
  function planBlockSVG(block, month, horiz){
    var b=PLAN[block];
    var bw = horiz ? b.h : b.w, bh = horiz ? b.w : b.h;
    var pad=0.35, out="";
    if(b.corridor){
      var cr=rot(b.corridor, b.h, horiz);
      out+='<rect x="'+cr.x+'" y="'+cr.y+'" width="'+cr.w+'" height="'+cr.h+'" fill="var(--bg-2)" stroke="var(--border)" stroke-width="0.12" stroke-dasharray="0.8 0.7"/>';
    }
    b.cells.forEach(function(c){
      var p=personForCell(c.id);
      var st = p ? statusOf(p, payDoc(p.id,month), month) : {key:"vacant", text:t("vacant")};
      var sty = PLAN_STYLE[st.key]||PLAN_STYLE.none;
      var r=rot(c, b.h, horiz);
      var cx=r.x+r.w/2, cy=r.y+r.h/2;
      var rid = p ? (p.id+"__"+month) : "";
      var y0 = sty.show ? cy-0.75 : cy+0.55;
      out+='<g class="plancell" '+(rid?'data-act="planjump" data-rid="'+rid+'"':'')+' style="cursor:'+(rid?"pointer":"default")+'">' +
        '<rect x="'+r.x+'" y="'+r.y+'" width="'+r.w+'" height="'+r.h+'" rx="0.25" fill="'+sty.fill+'" stroke="var(--border)" stroke-width="0.14"/>' +
        '<rect x="'+r.x+'" y="'+r.y+'" width="'+(horiz?r.w:0.3)+'" height="'+(horiz?0.3:r.h)+'" fill="'+sty.edge+'" opacity=".85"/>' +
        '<text x="'+cx+'" y="'+y0+'" text-anchor="middle" font-size="1.7" font-weight="600" fill="'+sty.ink+'" letter-spacing="-0.03">'+c.id+'</text>' +
        (sty.show?'<text x="'+cx+'" y="'+(y0+1.5)+'" text-anchor="middle" font-size="0.95" font-weight="600" fill="'+sty.ink+'">'+st.text+'</text>':'') +
      '</g>';
    });
    return {w:bw, h:bh,
      svg:'<svg viewBox="'+(-pad)+' '+(-pad)+' '+(bw+pad*2)+' '+(bh+pad*2)+'" preserveAspectRatio="xMidYMin meet" style="width:100%;height:auto;overflow:visible">'+out+'</svg>'};
  }
  function renderPlan(month){
    var horiz = state.planDir==="h";
    var ae=planBlockSVG("ae", month, horiz), ote=planBlockSVG("ote", month, horiz);
    var total = horiz ? Math.max(ae.w, ote.w) : (ae.w + PLAN_GAP + ote.w);
    function blockHTML(b, key){
      var d=PLAN[key];
      var pctW = horiz ? (b.w/total*100) : (b.w/total*100);
      return '<div class="planblock" style="flex:0 0 '+pctW.toFixed(2)+'%">' +
        '<div class="plancap"><b>'+t(d.label)+'</b><span>'+t(d.side)+'</span></div>' +
        b.svg + '</div>';
    }
    var row = '<div class="planrow'+(horiz?" h":"")+'">'+blockHTML(ae,"ae")+blockHTML(ote,"ote")+'</div>';
    var legend=["paid","overdue","partial","due","vacant"].map(function(k){
      var sty=PLAN_STYLE[k];
      var lbl = k==="vacant"?t("vacant"):t("st_"+k);
      return '<span class="lg"><i style="background:'+sty.fill+';box-shadow:inset 3px 0 0 '+sty.edge+'"></i>'+lbl+'</span>';
    }).join("");
    return '<div class="card plancard">' +
      '<div class="planhead"><h3>'+t("view_plan")+'</h3><span>'+monthLabel(month)+'</span></div>' +
      '<div class="planwrap">'+row+'</div>' +
      '<div class="planlegend">'+legend+'</div>' +
      '<div class="hint">'+t("plan_hint")+'</div></div>';
  }

  function allStorePeople(){ return peopleList().filter(function(p){ return p.type==="store"&&p.active!==false; }); }
  function allMonthsWithData(){
    var nowKey=monthKeyNow(), set={};
    Object.keys(state.payments).forEach(function(k){ var mk=state.payments[k].month; if(mk<=nowKey) set[mk]=true; });
    set[nowKey]=true;
    return Object.keys(set).sort();
  }
  function statsRangeMonths(){
    var range=state.statsRange||"1";
    if(range==="all") return allMonthsWithData();
    var n = range==="3"?3:(range==="2"?2:1);
    var arr=[], mk=state.month;
    for(var i=0;i<n;i++){ arr.unshift(mk); mk=shiftMonth(mk,-1); }
    return arr;
  }

    var range=state.statsRange||"1", months=statsRangeMonths();
    if(range==="all") return t("for_all",{m:monthLabel(monthKeyNow())});
    if(months.length===1) return t("for_month",{m:monthLabel(months[0])});
    return t("for_range",{a:monthLabel(months[0]), b:monthLabel(months[months.length-1])});

  function yousefMonthShare(month){
    var s=state.settings;
    var aeP=peopleList().filter(function(p){return p.type==="store"&&p.group==="AE"&&p.active!==false;});
    var oteP=peopleList().filter(function(p){return p.type==="store"&&p.group==="ONE_TO_EIGHT"&&p.active!==false;});
    var aeCollected=aeP.reduce(function(a,p){return a+sumPaid(p.id,month);},0);
    var oteCollected=oteP.reduce(function(a,p){return a+sumPaid(p.id,month);},0);
    var aeBilled=aeP.reduce(function(a,p){return a+requiredFor(p,month);},0);
    var oteBilled=oteP.reduce(function(a,p){return a+requiredFor(p,month);},0);
    var aePct=s.storeAEYousefPct!=null?s.storeAEYousefPct:1;
    var otePct=s.store1to8YousefPct!=null?s.store1to8YousefPct:0.5;
    var aeExpense=s.aeYousefExpense!=null?s.aeYousefExpense:5500;
    var oteExpense=s.oteYousefExpense!=null?s.oteYousefExpense:3000;
    var grossAE=aeCollected*aePct, grossOTE=oteCollected*otePct;
    var potGrossAE=aeBilled*aePct, potGrossOTE=oteBilled*otePct;
    var gift = s.motherGiftExpense!=null?s.motherGiftExpense:1500;
    var net  = s.internetExpense!=null?s.internetExpense:250;
    // مصروف يخص شهرًا بعينه (مثل تسوية تُدفع على دفعتين) — يختفي تلقائيًا بعد شهره
    var ex = (s.monthlyExtras && s.monthlyExtras[month]) || {};
    var extra = Number(ex.yousef)||0;
    var extraLabel = ex.label || "";
    return {aeCollected:aeCollected, oteCollected:oteCollected, aeBilled:aeBilled, oteBilled:oteBilled,
      grossAE:grossAE, grossOTE:grossOTE, aeExpense:aeExpense, oteExpense:oteExpense, gift:gift, net:net,
      extra:extra, extraLabel:extraLabel,
      taken:grossAE+grossOTE,
      remaining:(grossAE-aeExpense)+(grossOTE-oteExpense)-gift-net-extra,
      potentialRemaining:(potGrossAE-aeExpense)+(potGrossOTE-oteExpense)-gift-net-extra};
  }
  function fatherMonthShare(month){
    var s=state.settings, y=yousefMonthShare(month);
    var fatherPct=s.store1to8FatherPct!=null?s.store1to8FatherPct:0.5;
    var fatherExpense=s.fatherOteExpense!=null?s.fatherOteExpense:3000;
    var aeExpense=s.aeFatherExpense!=null?s.aeFatherExpense:500;
    var grossOTE=y.oteCollected*fatherPct;
    var potGrossOTE=y.oteBilled*fatherPct;
    var exF=(s.monthlyExtras && s.monthlyExtras[month]) || {};
    var extra=Number(exF.father)||0;
    return {oteCollected:y.oteCollected, grossOTE:grossOTE, expense:fatherExpense, aeExpense:aeExpense,
      extra:extra, extraLabel:exF.label||"",
      taken:grossOTE, remaining:grossOTE-fatherExpense-aeExpense-extra,
      potentialRemaining:potGrossOTE-fatherExpense-aeExpense-extra};
  }

  function renderStats(){
    var months=statsRangeMonths(), monthSet={};
    months.forEach(function(mk){ monthSet[mk]=true; });
    var people=allStorePeople();
    var rows=people.map(function(p){
      var billed=0,paid=0,overdue=0;
      months.forEach(function(mk){
        billed+=baseRequiredFor(p,mk);
        paid+=sumPaid(p.id,mk);
        if(statusOf(p,payDoc(p.id,mk),mk).key==="overdue") overdue++;
      });
      return {p:p,billed:billed,paid:paid,pct:billed>0?paid/billed:0,overdue:overdue};
    });
    var totalBilled=rows.reduce(function(a,r){return a+r.billed;},0);
    var totalPaid=rows.reduce(function(a,r){return a+r.paid;},0);
    var totalPct=totalBilled>0?totalPaid/totalBilled:0;

    var methodCounts={Cash:0,Cheque:0,Fawran:0}, methodTotal=0;
    Object.keys(state.payments).forEach(function(k){
      var d=state.payments[k];
      if(!monthSet[d.month]) return;
      if(d.method&&methodCounts.hasOwnProperty(d.method)){ methodCounts[d.method]++; methodTotal++; }
    });

    var html=renderMonthbar();
    html+=renderYousefCard(state.month);
    html+=renderFatherCard(state.month);
    html+='<div class="card"><h3>'+t("stats_scope")+'</h3><div class="segrow">' +
      rangeBtn("1","r_1")+rangeBtn("2","r_2")+rangeBtn("3","r_3")+rangeBtn("all","r_all")+'</div></div>';

    html+='<div class="card"><h3>'+t("summary")+' — '+statsRangeLabel()+'</h3>' +
      '<div class="kpis" style="margin-top:10px">' +
        kpi(t("total_due"), fmt(totalBilled)) +
        kpi(t("total_collected"), fmt(totalPaid), "ok") +

  /* ======================= chart ======================= */
  function drawTrend(){
    var canvas=document.getElementById("trendcanvas");
    if(!canvas) return;
    var months=allMonthsWithData();
    var stores=allStorePeople();
    var data=months.map(function(mk){
      var billed=0,paid=0;
      stores.forEach(function(p){
        billed+=baseRequiredFor(p,mk);
        paid+=sumPaid(p.id,mk);
      });
      return {mk:mk, pct:billed>0?paid/billed:0};
    });
    var barW=34,gap=14,padL=34,padB=30,padT=14;
    var w=Math.max(canvas.parentElement.clientWidth, padL+data.length*(barW+gap)+10);
    var h=150, dpr=window.devicePixelRatio||1;
    canvas.width=w*dpr; canvas.height=h*dpr; canvas.style.width=w+"px"; canvas.style.height=h+"px";
    var ctx=canvas.getContext("2d"); ctx.scale(dpr,dpr);
    var css=getComputedStyle(document.documentElement);
    var border=css.getPropertyValue("--border").trim();
    var muted=css.getPropertyValue("--text-muted").trim();
    var accent=css.getPropertyValue("--accent").trim();
    var text=css.getPropertyValue("--text").trim();
    ctx.clearRect(0,0,w,h);
    var plotH=h-padT-padB;
    [0,0.5,1].forEach(function(v){
      var y=padT+plotH*(1-v);
      ctx.strokeStyle=border; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(padL-6,y); ctx.lineTo(w-4,y); ctx.stroke();
      ctx.fillStyle=muted; ctx.font="10px "+(LANG==="ar"?"IBM Plex Sans Arabic":"Inter")+", sans-serif"; ctx.textAlign="right";
      ctx.fillText(Math.round(v*100)+"%", padL-10, y+3);
    });
    data.forEach(function(d,i){
      var x=padL+i*(barW+gap);
      var bh=plotH*Math.max(0,Math.min(1,d.pct));
      var y=padT+plotH-bh, r=5;
      ctx.fillStyle=accent; ctx.beginPath();
      ctx.moveTo(x,padT+plotH); ctx.lineTo(x,y+r);
      ctx.arcTo(x,y,x+r,y,r); ctx.lineTo(x+barW-r,y);
      ctx.arcTo(x+barW,y,x+barW,y+r,r); ctx.lineTo(x+barW,padT+plotH);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle=text; ctx.font="10px "+(LANG==="ar"?"IBM Plex Sans Arabic":"Inter")+", sans-serif"; ctx.textAlign="center";
      ctx.fillText(Math.round(d.pct*100)+"%", x+barW/2, y-4>padT?y-4:padT+10);
      var lbl=monthLabel(d.mk).split(" ");
      ctx.fillStyle=muted; ctx.font="9.5px "+(LANG==="ar"?"IBM Plex Sans Arabic":"Inter")+", sans-serif";
      ctx.fillText(lbl[0].slice(0,4)+" "+lbl[1].slice(2), x+barW/2, h-padB+14);
    });
  }

  function monthSheetRows(mk){
    var header = LANG==="en"
      ? ["Tenant","Business","Required","Due date","Payment date","Paid?","Amount paid","Balance","Days late","Status","Pay day","Method","Contact","Notes"]
      : ["اسم المستأجر","النشاط","الإيجار المطلوب","تاريخ الاستحقاق","تاريخ الدفع","دفع؟","المبلغ المدفوع","الرصيد المتبقي","أيام التأخير","الحالة","يوم الدفع","طريقة الدفع","التواصل","ملاحظات"];
    var rows=[header];
    function addPersonRow(p){
      var doc=payDoc(p.id,mk);
      var required=requiredFor(p,mk);
      var paidAmt=doc?(doc.amountPaid||0):0;
      var st=statusOf(p,doc,mk);
      var dueDate=mk+"-"+String(p.dueDay||1).padStart(2,"0");
      var paymentDate=doc&&doc.paymentDate?doc.paymentDate:"";
      var paidDay=paymentDate?Number(paymentDate.split("-")[2]):"";
      var daysLate="";
      if(dueDate&&paymentDate) daysLate=Math.max(0,Math.round((new Date(paymentDate)-new Date(dueDate))/86400000));
      else if(dueDate&&!paymentDate&&st.key==="overdue") daysLate=Math.max(0,Math.round((new Date()-new Date(dueDate))/86400000));
      rows.push([p.name,p.business||"",required,dueDate,paymentDate,
        (doc&&doc.paid)?(LANG==="en"?"Yes":"نعم"):(LANG==="en"?"No":"لا"),
        paidAmt,Math.max(0,required-paidAmt),daysLate,st.text,paidDay,(doc&&doc.method)||"",p.contact||"",(doc&&doc.notes)||p.note||""]);
    }
    var partners=activePartners();
    if(partners.length){ partners.forEach(addPersonRow); rows.push([]); }
    var ae=activeByGroup("AE"); ae.forEach(addPersonRow); rows.push([]);
    var ote=activeByGroup("ONE_TO_EIGHT"); ote.forEach(addPersonRow); rows.push([]);
    var allStores=ae.concat(ote);
    var totalRequired=allStores.reduce(function(a,p){return a+requiredFor(p,mk);},0);
    var totalPaid=allStores.reduce(function(a,p){return a+sumPaid(p.id,mk);},0);
    var y=yousefMonthShare(mk), f=fatherMonthShare(mk);
    rows.push([t("total_due"),"","",Math.round(totalRequired)]);
    rows.push([t("total_collected"),"","",Math.round(totalPaid)]);
    rows.push([t("kpi_rate"),"","",totalRequired>0?Math.round(totalPaid/totalRequired*100)+"%":"0%"]);
    rows.push([t("net_y"),"","",Math.round(y.remaining)]);
    rows.push([t("net_f"),"","",Math.round(f.remaining)]);
    return rows;
  }
  function allMonthsAll(){
    var set={};
    Object.keys(state.payments).forEach(function(k){ set[state.payments[k].month]=true; });
    set[monthKeyNow()]=true;
    return Object.keys(set).sort();
  }
  // نفس الأوراق تُستخدم لملف Excel ولنسخة Google Sheets المشتركة
  function buildSheets(){
    var sheets=[];
    allMonthsAll().forEach(function(mk){ sheets.push({name:monthSheetName(mk), rows:monthSheetRows(mk)}); });
    var nowKey=monthKeyNow();
    var sumHeader = LANG==="en"
      ? ["Tenant","Business","Total required","Total collected","Rate","Late months"]
      : ["المستأجر","النشاط","إجمالي مطلوب","إجمالي محصَّل","نسبة التحصيل","أشهر متأخرة"];
    var summary=[sumHeader];
    var allMk=allMonthsAll().filter(function(mk){ return mk<=nowKey; });
    allStorePeople().forEach(function(p){
      var billed=0,paid=0,overdue=0;
      allMk.forEach(function(mk){
        billed+=baseRequiredFor(p,mk);
        paid+=sumPaid(p.id,mk);
        if(statusOf(p,payDoc(p.id,mk),mk).key==="overdue") overdue++;
      });
      summary.push([p.name,p.business||"",Math.round(billed),Math.round(paid),billed>0?Math.round(paid/billed*100)+"%":"0%",overdue]);
    });
    sheets.push({name:LANG==="en"?"Tenant summary":"ملخص المستأجرين", rows:summary});

    var peopleHeader = LANG==="en"
      ? ["Name","Type","Business","Default rent","Due day","Contact","Term","Contract start","Deposit type","Deposit amount","Active?"]
      : ["الاسم","النوع","النشاط","الإيجار الافتراضي","يوم الاستحقاق","التواصل","مدة العقد","بداية العقد","نوع الضمان","مبلغ الضمان","نشط؟"];
    var peopleSheet=[peopleHeader];
    peopleList().forEach(function(p){
      peopleSheet.push([p.name, p.type==="store"?t("type_tenant"):(p.type==="partner"?t("type_partner"):t("type_inactive")),
        p.business||"", p.rent||0, p.dueDay||"", p.contact||"",
        p.contractTerm?t(TERM_KEYS[p.contractTerm]):"", p.contractStart||"",
        p.depositType?t(DEPOSIT_KEYS[p.depositType]):"", p.depositAmount||"",
        p.active!==false?(LANG==="en"?"Yes":"نعم"):(LANG==="en"?"No":"لا")]);
    });
    sheets.push({name:LANG==="en"?"Tenants & partners":"المستأجرون والشركاء", rows:peopleSheet});
    return sheets;
  }
  async function exportExcel(){
    if(typeof XLSX==="undefined"){
      try{ await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"); }catch(e){}
    }
    if(typeof XLSX==="undefined"){ toast(t("excel_lib_fail")); return; }
    var wb=XLSX.utils.book_new();
    buildSheets().forEach(function(sh){ XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sh.rows), sh.name); });
    var buf=XLSX.write(wb,{type:"array",bookType:"xlsx"});
    var blob=new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    try{
      downloadBlob(blob, "rent-ledger-"+todayISO()+".xlsx");
      toast(t("export_ok"));
    }catch(e){ toast(t("export_fail")); }
  }

  /* ======================= Google Sheets (ملف مشترك أونلاين) ======================= */
  // بعد كل تعديل تُرسَل نفس أوراق Excel إلى Google Apps Script (google-sheets-script.gs)
  // الذي يكتبها في ملف Google Sheets — الملف يبقى محدّثًا دائمًا ويمكن مشاركته
  var SHEET_DEBOUNCE_MS = 3000;
  var sheet = { timer:null, busy:false, pending:false, status:"", at:null, booted:false };
  function sheetsCfg(){ var g=state.settings.gsheet; return (g && g.url && g.token) ? g : null; }
  function scheduleSheetSync(){
    if(!sheetsCfg()) return;
    clearTimeout(sheet.timer);
    sheet.timer=setTimeout(function(){ syncSheets(false); }, SHEET_DEBOUNCE_MS);
  }
  function sheetPayload(g){
    var prev=LANG; LANG="ar"; // الملف المشترك بالعربية دائمًا
    try{
      var all=buildSheets(), months=all.slice(0,-2).reverse(), rest=all.slice(-2);
      rest[0].rows=rest[0].rows.concat([[], ["آخر تحديث", new Date().toLocaleString("en-GB")]]);
      return {token:g.token, sheets:rest.concat(months)}; // الملخص والمستأجرون أولًا ثم الأشهر من الأحدث
    } finally { LANG=prev; }
  }
  async function syncSheets(manual){
    var g=sheetsCfg();
    if(!g || !isSheetScriptUrl(g.url)){ if(manual) toast(t("gs_not_set")); return; }
    if(!Object.keys(state.people).length){ return; } // لا ترسل ملفًا فارغًا قبل تحميل البيانات
    if(sheet.busy){ sheet.pending=true; return; }
    sheet.busy=true; sheet.status="syncing"; paintSheetStatus();
    var body=JSON.stringify(sheetPayload(g)), out=null;
    try{
      // text/plain بدون headers مخصّصة = طلب بسيط بدون preflight، و Apps Script يسمح بقراءة الرد
      var res=await fetch(g.url,{method:"POST", body:body});
      out=await res.json();
      if(!out || !out.ok) throw new Error((out&&out.error)||"error");
      sheet.status="ok"; sheet.at=new Date();
      if(out.url && out.url!==g.sheetUrl) saveSettings({gsheet:Object.assign({},g,{sheetUrl:out.url})}, true);
      if(manual) toast(t("gs_ok"));
    }catch(e){
      sheet.status = (out && out.error==="unauthorized") ? "badtoken" : "fail";
      if(manual) toast(t(sheet.status==="badtoken"?"gs_badtoken":"gs_fail"));
    }
    sheet.busy=false; paintSheetStatus();
    if(sheet.pending){ sheet.pending=false; scheduleSheetSync(); }
  }
  // مزامنة واحدة عند فتح الموقع (لتحديث حالات التأخير مع مرور الأيام) — بعد وصول البيانات من الخادم
  function maybeBootSheetSync(){
    if(sheet.booted || !sheetsCfg()) return;
    if(!(state.fresh.people && state.fresh.payments && state.fresh.settings)) return;
    sheet.booted=true; scheduleSheetSync();
  }
  function sheetStatusHTML(){
    var s=sheet.status, txt;
    if(s==="syncing") txt='<span class="badge soon">'+t("gs_syncing")+'</span>';
    else if(s==="ok") txt='<span class="badge ok">'+t("gs_synced",{tm:sheet.at.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})})+'</span>';
    else if(s==="fail") txt='<span class="badge duenow">'+t("gs_fail")+'</span>';
    else if(s==="badtoken") txt='<span class="badge duenow">'+t("gs_badtoken")+'</span>';
    else txt='<span class="badge">'+t("gs_auto")+'</span>';
    return txt;
  }
  function paintSheetStatus(){ var el=document.getElementById("gs-status"); if(el) el.innerHTML=sheetStatusHTML(); }
  function renderSheetsCard(){
    var g=state.settings.gsheet||{}, linked=!!sheetsCfg();
    var fields='<div class="fgrid" style="margin-top:12px">' +
        '<div class="field full"><label for="gs-url">'+t("gs_url")+'</label><input id="gs-url" type="url" dir="ltr" placeholder="https://script.google.com/macros/s/…/exec" value="'+esc(g.url||"")+'"></div>' +
        '<div class="field full"><label for="gs-token">'+t("gs_token")+'</label><input id="gs-token" type="text" dir="ltr" autocomplete="off" value="'+esc(g.token||"")+'"></div>' +
      '</div>' +
      '<button class="btn block" style="margin-top:10px" data-act="gssave">'+t(linked?"gs_save":"gs_link")+'</button>';
    var html='<div class="card"><h3>'+t("gs_title")+'</h3><div class="hint">'+t("gs_hint")+'</div>';
    if(linked){
      html+='<div style="margin-top:10px" id="gs-status">'+sheetStatusHTML()+'</div>' +
        '<div class="fgrid" style="margin-top:10px">' +
          (/^https:\/\/docs\.google\.com\//.test(g.sheetUrl||"")?'<a class="btn" href="'+esc(g.sheetUrl)+'" target="_blank" rel="noopener">'+t("gs_open")+'</a>':'') +
          '<button class="btn ghost" data-act="gssync"'+(g.sheetUrl?'':' style="grid-column:1/-1"')+'>'+t("gs_sync")+'</button>' +
        '</div>' +
        '<details class="disclose"><summary>'+t("gs_settings")+'</summary>'+fields +
          '<button class="btn ghostdanger block" style="margin-top:9px" data-act="gsunlink">'+t("gs_unlink")+'</button></details>';
    } else {
      html+=fields+'<div class="hint" style="margin-top:8px">'+t("gs_howto")+'</div>';
    }
    return html+'</div>';
  }

  /* ======================= boot ======================= */
  document.querySelectorAll(".lang button").forEach(function(b){
    b.addEventListener("click",function(){
      LANG=b.getAttribute("data-lang");
      try{ localStorage.setItem("rentbook_lang",LANG); }catch(e){}
      applyLang(); render();
    });
  });

  function boot(initial){
    if(initial&&initial.tab) state.tab=initial.tab;
    if(initial&&initial.month) state.month=initial.month;
    if(initial&&initial.lang) LANG=initial.lang;
    applyLang();
    render();
    initDb();
  }
  var savedTab=null;
  try{ savedTab=localStorage.getItem("rentbook_tab"); }catch(e){}
  boot({tab: (savedTab==="pay"||savedTab==="stats"||savedTab==="people") ? savedTab : null});
  if("serviceWorker" in navigator && window.isSecureContext){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  }
})();
</script>
